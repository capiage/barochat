<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le BaroChat™</title>
    
    <link id="dynamic-favicon" rel="icon" type="image/x-icon" href="favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CRITICAL POLYFILLS FOR SIMPLE-PEER IN BROWSER -->
    <script>
        window.global = window;
        window.process = { env: { DEBUG: undefined } };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #1e1f22; color: #dbdee1; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #111214; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Dynamic Flexbox WebRTC Video Grid */
        #fullscreen-video-grid {
            display: flex; flex-wrap: wrap; justify-content: center; align-content: center; align-items: center;
            gap: 1rem; width: 100%; height: 100%; padding: 1rem; min-h-0; min-w-0;
        }
        .video-wrapper {
            position: relative; flex: 0 1 auto;
            aspect-ratio: 16 / 9;
            border-radius: 0.5rem; background-color: #1e1f22;
            overflow: hidden; border: 1px solid #2b2d31;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.5);
            cursor: pointer; transition: all 0.2s ease-in-out;
        }
        
        /* Flawless Grid Scaling Logic w/ Aspect Ratio Clamping */
        .grid-count-1 .video-wrapper { 
            width: 100%; max-height: calc(100vh - 2rem); max-width: calc((100vh - 2rem) * 16 / 9); 
        }
        .grid-count-2 .video-wrapper { 
            width: calc(50% - 0.5rem); max-height: calc(100vh - 2rem); max-width: calc((100vh - 2rem) * 16 / 9); 
        }
        .grid-count-3 .video-wrapper, .grid-count-4 .video-wrapper { 
            width: calc(50% - 0.5rem); max-height: calc(50vh - 1.5rem); max-width: calc((50vh - 1.5rem) * 16 / 9); 
        }
        .grid-count-5 .video-wrapper, .grid-count-6 .video-wrapper { 
            width: calc(33.333% - 0.67rem); max-height: calc(50vh - 1.5rem); max-width: calc((50vh - 1.5rem) * 16 / 9); 
        }
        .grid-count-7 .video-wrapper, .grid-count-8 .video-wrapper, .grid-count-9 .video-wrapper { 
            width: calc(33.333% - 0.67rem); max-height: calc(33.333vh - 1.33rem); max-width: calc((33.333vh - 1.33rem) * 16 / 9); 
        }
        .grid-count-more .video-wrapper { 
            width: calc(25% - 0.75rem); max-height: calc(33.333vh - 1.33rem); max-width: calc((33.333vh - 1.33rem) * 16 / 9); 
        }

        .video-wrapper:hover { border-color: #5865F2; }
        .video-wrapper video {
            width: 100%; height: 100%; background-color: #000;
            object-fit: cover; 
        }

        /* Fixed Fullscreen Mode - Absolute Top Z-Index */
        .video-fullscreen-mode {
            position: absolute !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
            width: 100% !important; height: 100% !important; z-index: 50 !important; 
            border-radius: 0 !important; background-color: #000 !important; border: none !important;
            max-width: none !important; max-height: none !important;
        }

        .image-lightbox {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
        }
        .image-lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5); }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen flex bg-[#1e1f22]" x-data="nexusApp()" x-cloak>

    <!-- Global Toast Notification -->
    <div x-show="toast.show" x-transition.opacity class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[1000] px-4 py-3 rounded-md shadow-2xl text-sm font-bold text-white transition-all flex items-center gap-3" :class="toast.isError ? 'bg-red-500' : 'bg-[#5865F2]'" style="display: none;">
        <i class="ph-fill text-xl" :class="toast.isError ? 'ph-warning-circle' : 'ph-info'"></i>
        <span x-text="toast.message"></span>
    </div>

    <!-- Image Lightbox Modal -->
    <div x-show="zoomedImage" class="image-lightbox" style="display: none;" @click="zoomedImage = null">
        <button class="absolute top-6 right-6 text-white bg-red-500 hover:bg-red-600 rounded-full p-2 transition"><i class="ph-bold ph-x text-xl"></i></button>
        <img :src="zoomedImage" @click.stop>
    </div>

    <!-- Onboarding / Auth Overlay -->
    <div x-show="!isReady" class="fixed inset-0 z-50 flex items-center justify-center bg-[#1e1f22] overflow-y-auto py-10" style="display: none;">
        <div x-show="authLoading" class="flex flex-col items-center text-gray-300">
            <i class="ph ph-spinner-gap animate-spin text-5xl mb-4 text-[#5865F2]"></i>
            <h1 class="text-xl font-bold tracking-tight">Connecting to Le BaroChat™...</h1>
        </div>

        <div x-show="!authLoading" class="flex flex-col md:flex-row gap-8 items-start max-w-5xl w-full px-6">
            <div class="bg-[#313338] p-8 rounded-xl shadow-2xl w-full max-w-md">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-100" x-text="authMode === 'login' ? 'Welcome Back!' : 'Create an Account'"></h2>
                    <p class="text-gray-400 mt-1 text-sm" x-text="authMode === 'login' ? 'Log in with your unique @username.' : 'Join Le BaroChat™ and connect with friends.'"></p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Username</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-gray-500 font-bold">@</span>
                            <input type="text" x-model="authUsername" placeholder="e.g. capybara" class="w-full pl-8 pr-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-[#5865F2] focus:ring-1 focus:ring-[#5865F2] text-gray-100 text-sm outline-none transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Password</label>
                        <input type="password" x-model="authPassword" @keydown.enter="processAuth()" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-[#5865F2] focus:ring-1 focus:ring-[#5865F2] text-gray-100 text-sm outline-none transition">
                    </div>

                    <template x-if="authMode === 'register'">
                        <div class="space-y-4 pt-2 border-t border-[#2b2d31] mt-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 mt-4">Display Name</label>
                                <input type="text" x-model="authDisplayName" placeholder="How you appear to others" maxlength="20" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-[#5865F2] focus:ring-1 focus:ring-[#5865F2] text-gray-100 text-sm outline-none transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Choose an Avatar</label>
                                <div class="grid grid-cols-4 gap-3 mb-3">
                                    <template x-for="(avatarObj, index) in defaultAvatars" :key="index">
                                        <button @click="authAvatar = avatarObj.data" class="aspect-square rounded-full overflow-hidden border-2 transition hover:opacity-80 bg-[#1e1f22]" :class="authAvatar === avatarObj.data ? 'border-[#5865F2] scale-105 shadow-lg' : 'border-transparent'">
                                            <img :src="avatarObj.data" class="w-full h-full object-cover">
                                        </button>
                                    </template>
                                </div>
                                <button @click="triggerImageUpload('setup')" class="w-full py-2 text-sm text-[#5865F2] font-medium bg-[#2b2d31] hover:bg-[#1e1f22] rounded-md transition border border-transparent hover:border-[#383a40]">
                                    Or upload custom image...
                                </button>
                            </div>
                        </div>
                    </template>

                    <button @click="processAuth()" :disabled="!authUsername || !authPassword || (authMode === 'register' && !authDisplayName)" class="w-full py-3 bg-[#5865F2] hover:bg-[#4752C4] disabled:opacity-50 text-white font-bold rounded-md shadow transition mt-6">
                        <span x-text="authMode === 'login' ? 'Log In' : 'Register'"></span>
                    </button>

                    <div class="text-sm text-gray-400 mt-4 text-center">
                        <span x-text="authMode === 'login' ? 'Need an account?' : 'Already have an account?'"></span>
                        <button @click="authMode = authMode === 'login' ? 'register' : 'login'" class="text-[#00A8FC] hover:underline ml-1 font-medium">
                            <span x-text="authMode === 'login' ? 'Register' : 'Log In'"></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Live Profile Preview -->
            <div class="w-full max-w-sm hidden md:block" x-show="authMode === 'register'">
                <div class="text-xs font-bold text-gray-500 uppercase mb-3 text-center">Live Profile Preview</div>
                <div class="bg-[#232428] rounded-xl shadow-2xl w-full overflow-hidden">
                    <div class="h-24 bg-[#5865F2] w-full"></div>
                    <div class="px-5 pb-6">
                        <div class="-mt-12 bg-[#232428] rounded-full p-1.5 inline-block relative z-10">
                            <img :src="authAvatar" class="w-20 h-20 rounded-full object-cover bg-[#1e1f22] shadow-sm">
                        </div>
                        <div class="pt-2">
                            <h3 class="text-xl font-extrabold text-gray-100 leading-tight truncate" x-text="authDisplayName || 'Your Name'"></h3>
                            <p class="text-sm text-gray-400 font-medium mb-4" x-text="'@' + (authUsername.replace(/[^a-zA-Z0-9_]/g, '').toLowerCase() || 'username')"></p>
                            <div class="w-full h-[1px] bg-[#313338] mb-4"></div>
                            <h4 class="text-[11px] font-bold text-gray-400 uppercase mb-2">About Me</h4>
                            <p class="text-sm text-gray-300">Ready to chat on Le BaroChat™!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Interface -->
    <template x-if="isReady && currentUserProfile">
        <div class="flex h-full w-full">
            
            <!-- Far Left Sidebar (Server List) -->
            <div class="w-[72px] h-full bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0 z-30 overflow-y-auto no-scrollbar">
                
                <!-- Home Button -->
                <button @click="openHome()" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-gray-100 flex items-center justify-center transition-all duration-200 relative group" :class="{'rounded-[16px] bg-[#5865F2] text-white': activeView === 'home'}">
                    <img :src="defaultAvatars[0].data" class="w-8 h-8 object-contain drop-shadow-md">
                    <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeView === 'home' ? 'h-10 top-1' : 'h-0 top-[24px] group-hover:h-5 group-hover:top-[14px]'"></div>
                    <!-- Home DM Notification Badge -->
                    <div x-show="totalUnreadDms > 0" class="absolute -bottom-1 -right-1 bg-red-500 rounded-full border-[3px] border-[#1e1f22] text-[10px] font-bold text-white flex items-center justify-center min-w-[20px] h-[20px] px-1 z-10" x-text="totalUnreadDms > 99 ? '99+' : totalUnreadDms"></div>
                </button>

                <div class="w-8 h-[2px] bg-[#313338] rounded-full my-1"></div>

                <!-- Unread DMs floating in the primary sidebar like Discord -->
                <template x-for="dm in dms.filter(d => getUnreadCount(d.id) > 0 && activeTarget !== d.id)" :key="dm.id">
                    <button @click="openDM(dm.id)" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] flex items-center justify-center transition-all duration-200 relative group overflow-hidden mt-1" title="Direct Message">
                        <img :src="getUser(dm.partnerUid)?.avatar" class="w-full h-full object-cover">
                        <!-- Notification Badge -->
                        <div class="absolute -bottom-1 -right-1 bg-red-500 rounded-full border-[3px] border-[#1e1f22] text-[10px] font-bold text-white flex items-center justify-center min-w-[20px] h-[20px] px-1 z-10" x-text="getUnreadCount(dm.id) > 99 ? '99+' : getUnreadCount(dm.id)"></div>
                    </button>
                </template>
                <div x-show="dms.filter(d => getUnreadCount(d.id) > 0 && activeTarget !== d.id).length > 0" class="w-8 h-[2px] bg-[#313338] rounded-full my-1"></div>

                <!-- Mapped Servers -->
                <template x-for="server in myServers" :key="server.id">
                    <button @click="openServer(server.id)" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-gray-100 hover:text-white flex items-center justify-center transition-all duration-200 shadow relative group overflow-hidden" :class="{'rounded-[16px] bg-[#5865F2] text-white': activeTarget === server.id && activeView === 'server'}">
                        <template x-if="server.icon">
                            <img :src="server.icon" class="w-full h-full object-cover">
                        </template>
                        <template x-if="!server.icon">
                            <span x-text="server.name.substring(0,2).toUpperCase()" class="font-bold text-sm"></span>
                        </template>
                        
                        <!-- Morphing Discord Pill -->
                        <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" 
                             :class="activeTarget === server.id && activeView === 'server' ? 'h-10 top-1' : (getServerUnreadState(server.id) ? 'h-2 top-[20px] group-hover:h-5 group-hover:top-[14px]' : 'h-0 top-[24px] group-hover:h-5 group-hover:top-[14px]')">
                        </div>

                        <!-- Ping Badge -->
                        <div x-show="getServerMentionCount(server.id) > 0" class="absolute -bottom-1 -right-1 bg-red-500 rounded-full border-[3px] border-[#1e1f22] text-[10px] font-bold text-white flex items-center justify-center min-w-[20px] h-[20px] px-1 z-10" x-text="getServerMentionCount(server.id) > 99 ? '99+' : getServerMentionCount(server.id)"></div>
                    </button>
                </template>

                <!-- Actions -->
                <button @click="showCreateServerModal = true; newServerName = ''" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] hover:bg-[#23A559] text-[#23A559] hover:text-white flex items-center justify-center transition-all duration-200 mt-2 group relative" title="Add a Server">
                    <i class="ph ph-plus text-xl"></i>
                </button>
                <button @click="openDiscovery()" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] hover:bg-[#5865F2] text-gray-300 hover:text-white flex items-center justify-center transition-all duration-200 mt-2 relative group" :class="{'rounded-[16px] bg-[#5865F2] text-white': activeView === 'discovery'}" title="Discover Servers">
                    <i class="ph-fill ph-compass text-2xl"></i>
                    <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeView === 'discovery' ? 'h-10 top-1' : 'h-0 top-[24px] group-hover:h-5 group-hover:top-[14px]'"></div>
                </button>
            </div>

            <!-- Secondary Sidebar (Channels or DMs) -->
            <div class="w-60 h-full bg-[#2b2d31] flex flex-col flex-shrink-0 z-20 relative">
                
                <!-- Home Sidebar (Friends & DMs) -->
                <template x-if="activeView === 'home' || activeView === 'discovery'">
                    <div class="flex flex-col flex-1 min-h-0">
                        <div class="h-12 border-b border-[#1e1f22] shadow-sm flex items-center px-4 flex-shrink-0">
                            <div class="w-full bg-[#1e1f22] text-gray-400 text-sm py-1.5 px-3 rounded flex items-center justify-center cursor-pointer hover:text-gray-200 transition" @click="friendsTab = 'add'; activeTarget = null;">
                                Find or start a conversation
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto p-2 space-y-[2px]">
                            <button @click="activeTarget = null; activeView = 'home'" class="w-full flex items-center px-3 py-2 rounded-md transition mb-2" :class="!activeTarget && activeView === 'home' ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:text-gray-100 hover:bg-[#35373c]'">
                                <i class="ph-fill ph-users mr-3 text-lg"></i>
                                <div class="flex-1 text-left font-medium text-[15px]">Friends</div>
                                <template x-if="incomingFriendRequests.length > 0">
                                    <div class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full" x-text="incomingFriendRequests.length"></div>
                                </template>
                            </button>
                            
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 py-2 mt-2 flex justify-between items-center hover:text-gray-300 cursor-pointer">
                                <span>Direct Messages</span>
                                <i class="ph ph-plus"></i>
                            </div>
                            
                            <!-- DM List (Sorted by recent) w/ Date Times -->
                            <template x-for="dm in sortedDms" :key="dm.id">
                                <button @click="openDM(dm.id)" class="w-full flex items-center px-2 py-1.5 rounded-md transition group" :class="activeTarget === dm.id && activeView === 'home' ? 'bg-[#3f4147] text-white' : 'hover:bg-[#35373c] text-gray-400 hover:text-gray-200'">
                                    <div class="relative flex-shrink-0 mr-3">
                                        <img :src="getUser(dm.partnerUid)?.avatar" class="w-8 h-8 rounded-full object-cover bg-[#1e1f22]">
                                        <div class="absolute bottom-0 right-0 w-3 h-3 border-2 border-[#2b2d31] rounded-full" :class="isUserOnline(dm.partnerUid) ? 'bg-[#23A559]' : 'bg-gray-500'"></div>
                                    </div>
                                    <div class="flex-1 min-w-0 flex items-center justify-between">
                                        <div class="font-medium text-[15px] truncate" :class="hasUnread(dm.id) ? 'text-gray-100 font-bold' : ''" x-text="getUser(dm.partnerUid)?.displayName || 'Unknown'"></div>
                                        <div class="flex items-center gap-1.5 pl-2 flex-shrink-0">
                                            <template x-if="getUnreadCount(dm.id) > 0 && activeTarget !== dm.id">
                                                <div class="bg-red-500 rounded-full text-white text-[10px] font-bold px-1.5 h-4 min-w-[16px] flex items-center justify-center shadow" x-text="getUnreadCount(dm.id) > 99 ? '99+' : getUnreadCount(dm.id)"></div>
                                            </template>
                                            <div class="text-[10px] font-medium" :class="hasUnread(dm.id) && activeTarget !== dm.id ? 'text-gray-300' : 'text-gray-500'" x-show="getLastMessageTimestamp(dm.id) > 0" x-text="formatSidebarTime(getLastMessageTimestamp(dm.id))"></div>
                                        </div>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
                
                <!-- Server Sidebar (Channels) -->
                <template x-if="activeView === 'server'">
                    <div class="flex flex-col flex-1 min-h-0">
                        <!-- Server Header w/ Dropdown -->
                        <div class="h-12 border-b border-[#1e1f22] shadow-sm flex items-center px-4 font-bold text-gray-100 justify-between cursor-pointer hover:bg-[#35373c] transition group relative z-50 flex-shrink-0">
                            <span class="truncate pr-2" x-text="getServer()?.name || 'Loading...'"></span>
                            <i class="ph ph-caret-down text-gray-400 group-hover:text-gray-200 transition-transform"></i>
                            
                            <!-- Dropdown Menu -->
                            <div class="absolute top-10 left-2 right-2 bg-[#111214] rounded-md shadow-2xl border border-[#1e1f22] p-2 hidden group-hover:block">
                                <button @click.stop="copyInviteLink()" class="w-full flex items-center justify-between px-2 py-1.5 text-[#5865F2] hover:bg-[#5865F2] hover:text-white rounded-md transition text-sm font-medium mb-1">
                                    <span>Invite People</span>
                                    <i class="ph ph-user-plus"></i>
                                </button>
                                <template x-if="getServer()?.owner === currentUserProfile?.uid">
                                    <button @click.stop="openServerSettingsModal()" class="w-full flex items-center justify-between px-2 py-1.5 text-gray-300 hover:bg-[#5865F2] hover:text-white rounded-md transition text-sm font-medium">
                                        <span>Server Settings</span>
                                        <i class="ph ph-gear"></i>
                                    </button>
                                </template>
                                <div class="h-px bg-[#2b2d31] my-1"></div>
                                <button @click.stop="leaveServer()" class="w-full flex items-center justify-between px-2 py-1.5 text-red-400 hover:bg-red-500 hover:text-white rounded-md transition text-sm font-medium">
                                    <span>Leave Server</span>
                                    <i class="ph ph-sign-out"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="flex-1 overflow-y-auto p-2 space-y-[2px]">
                            <!-- Text Channels -->
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 py-2 flex justify-between items-center group">
                                <span>Text Channels</span>
                                <template x-if="getServer()?.owner === currentUserProfile?.uid">
                                    <button @click="openServerSettingsModal('channels')" class="hidden group-hover:block hover:text-gray-200"><i class="ph ph-plus"></i></button>
                                </template>
                            </div>
                            <template x-for="channel in (getServer()?.channels || []).filter(c => c.type === 'text')" :key="channel.id">
                                <button @click="selectChannel(channel.id)" class="w-full flex items-center px-2 py-1.5 rounded-md transition" :class="activeChannelId === channel.id && !viewingVoice ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                    <i class="ph ph-hash mr-2 text-lg" :class="hasUnread(channel.id) ? 'text-gray-200' : ''"></i>
                                    <span class="font-medium text-[15px] truncate flex-1 text-left" :class="hasUnread(channel.id) ? 'text-gray-100 font-bold' : ''" x-text="channel.name"></span>
                                    
                                    <!-- Mention Ping Badge inside channel -->
                                    <template x-if="getMentionCount(channel.id) > 0">
                                        <div class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full flex-shrink-0" x-text="getMentionCount(channel.id) > 99 ? '99+' : getMentionCount(channel.id)"></div>
                                    </template>
                                    
                                    <!-- Standard Unread Dot -->
                                    <template x-if="hasUnread(channel.id) && getMentionCount(channel.id) === 0 && activeChannelId !== channel.id">
                                        <div class="w-1.5 h-1.5 bg-white rounded-full flex-shrink-0"></div>
                                    </template>
                                </button>
                            </template>

                            <!-- Voice Channels -->
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 py-2 mt-4 flex justify-between items-center group">
                                <span>Voice Channels</span>
                                <template x-if="getServer()?.owner === currentUserProfile?.uid">
                                    <button @click="openServerSettingsModal('channels')" class="hidden group-hover:block hover:text-gray-200"><i class="ph ph-plus"></i></button>
                                </template>
                            </div>

                        </template>
                    </div>
                </div>

                <!-- WebRTC Fullscreen Video Grid -->
                <div x-show="viewingVoice && inVoiceRoom" class="flex-1 bg-[#000000] flex flex-col relative overflow-hidden" style="display: none;">
                    <div id="fullscreen-video-grid" :class="'grid-count-' + (videoCount > 9 ? 'more' : videoCount)">
                        <!-- Local Camera Video (Always exists if in room) -->
                        <div class="video-wrapper group" :class="fullscreenVideoId === 'local' ? 'video-fullscreen-mode' : ''" @click="toggleFullscreenVideo('local')">
                            <video id="local-video" autoplay playsinline muted class="w-full h-full bg-black object-cover transition-opacity duration-300"></video>
                            
                            <!-- Avatar overlay when cam is off (Correctly pulls color) -->
                            <div x-show="rtcVideoOff" x-transition.opacity class="absolute inset-0 flex items-center justify-center z-0" :style="'background-color: ' + (currentUserProfile?.dominantColor || '#5865F2')">
                                <img :src="currentUserProfile?.avatar" class="w-32 h-32 rounded-full object-cover shadow-2xl bg-[#1e1f22]">
                            </div>

                            <div class="absolute bottom-3 left-3 bg-black/60 px-2.5 py-1.5 rounded text-[13px] text-white font-bold backdrop-blur-sm flex items-center gap-2 z-10">
                                <span x-text="currentUserProfile?.displayName + ' (You)'"></span>
                                <i class="ph-fill text-red-500" x-show="rtcVideoOff" class="ph-video-camera-slash"></i>
                                <i class="ph-fill text-red-500" x-show="isMuted" class="ph-microphone-slash"></i>
                            </div>
                        </div>
                        <!-- Remote Videos and Local Screenshare dynamically injected here -->
                    </div>
                </div>

                <!-- Text Chat Window -->
                <div x-show="!viewingVoice && activeView !== 'discovery' && (activeTarget || activeChannelId)" class="flex-1 overflow-y-auto flex flex-col p-4" id="chatContainer">
                    <template x-if="!currentChatId">
                        <div class="flex flex-col items-center justify-center h-full text-gray-500">
                            <i class="ph-fill ph-chat-circle-dots text-6xl mb-4 text-[#3f4147]"></i>
                            <p class="text-gray-400 font-medium">Select a channel or friend to start chatting.</p>
                        </div>
                    </template>

                    <div class="mt-auto"></div>

                    <!-- Discord-Style Grouped Messages -->
                    <template x-for="group in groupedMessages" :key="group.id">
                        <div class="flex flex-col w-full">
                            <!-- Day Separator -->
                            <template x-if="group.dateSeparator">
                                <div class="flex items-center justify-center mt-6 mb-2 px-2">
                                    <div class="flex-1 h-px bg-[#3f4147]"></div>
                                    <span class="px-3 text-xs font-bold text-gray-400" x-text="group.dateSeparator"></span>
                                    <div class="flex-1 h-px bg-[#3f4147]"></div>
                                </div>
                            </template>

                            <!-- New Messages Red Line -->
                            <template x-if="group.messages[0].isFirstUnread">
                                <div class="flex items-center justify-center mt-4 mb-1 px-2">
                                    <div class="flex-1 h-[1px] bg-red-500"></div>
                                    <span class="px-2 text-[10px] font-bold text-red-500 uppercase tracking-wider">New Messages</span>
                                    <div class="flex-1 h-[1px] bg-red-500"></div>
                                </div>
                            </template>

                            <div class="flex mt-2 px-2 group">
                                <!-- Group Header (PFP) -->
                                <div class="flex-shrink-0 mr-4 w-10">
                                    <img :src="getUser(group.senderId)?.avatar" @click="openProfilePopout(group.senderId)" class="w-10 h-10 rounded-full mt-0.5 object-cover cursor-pointer bg-[#1e1f22]">
                                </div>
                                <div class="flex-1 min-w-0 flex flex-col">
                                    <div class="flex items-baseline mb-1">
                                        <span class="font-medium text-gray-100 mr-2 cursor-pointer hover:underline text-[15px]" @click="openProfilePopout(group.senderId)" x-text="getUser(group.senderId)?.displayName || 'Unknown'"></span>
                                        <i x-show="activeView === 'server' && getServer()?.owner === group.senderId" class="ph-fill ph-crown text-[#F1C40F] mr-2 text-sm" title="Server Owner"></i>
                                        <span class="text-[11px] text-gray-400 font-medium" x-text="formatChatTime(group.timestamp)"></span>
                                    </div>
                                    
                                    <!-- Messages in this Group -->
                                    <div class="space-y-0.5">
                                        <template x-for="msg in group.messages" :key="msg.id">
                                            <div class="group/msg relative flex flex-col items-start py-0.5 hover:bg-[#2b2d31] transition -ml-14 pl-14 rounded-r" :class="isMentioned(msg.text) ? 'bg-[#5865F2]/10 border-l-2 border-[#5865F2]' : 'border-l-2 border-transparent'">
                                                
                                                <!-- Message Content -->
                                                <div class="w-full text-gray-300 break-words leading-snug text-[15px]" x-show="msg.text"><span class="whitespace-pre-wrap" x-html="formatMessage(msg.text)"></span><span x-show="msg.edited" class="text-[10px] text-gray-500 ml-1">(edited)</span></div>
                                                
                                                <!-- Image Attachments -->
                                                <template x-if="msg.image">
                                                    <img :src="msg.image" class="mt-1 max-w-md w-full rounded-md object-contain border border-[#1e1f22] bg-[#2b2d31] cursor-pointer block" @click="zoomedImage = msg.image">
                                                </template>
                                                
                                                <!-- Edit/Delete Controls (Right aligned) -->
                                                <div x-show="msg.senderId === logicalUid" class="absolute right-2 -top-3 bg-[#313338] border border-[#1e1f22] rounded shadow-md hidden group-hover/msg:flex items-center z-10 overflow-hidden">
                                                    <button @click="startEditMessage(msg)" class="p-1.5 text-gray-400 hover:bg-[#3f4147] hover:text-gray-200 transition" title="Edit">
                                                        <i class="ph-fill ph-pencil-simple text-sm"></i>
                                                    </button>
                                                    <button @click="deleteMessage(msg.id)" class="p-1.5 text-gray-400 hover:bg-red-500 hover:text-white transition" title="Delete">
                                                        <i class="ph-fill ph-trash text-sm"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Chat Input Bar -->
                <div class="p-4 pt-0 flex-shrink-0 bg-[#313338] relative" x-show="currentChatId && !viewingVoice && activeView !== 'discovery'" style="display: none;">
                    
                    <!-- Edit Mode Indicator -->
                    <div x-show="editingMessageId" class="text-xs text-gray-400 mb-1 font-medium flex items-center justify-between px-2">
                        <span>Editing message...</span>
                        <button @click="cancelEditMessage()" class="text-[#00A8FC] hover:underline">Cancel</button>
                    </div>

                    <!-- @ Mention Autocomplete Menu -->
                    <div x-show="showMentions" class="absolute bottom-full left-4 mb-2 bg-[#2b2d31] border border-[#1e1f22] rounded-md shadow-2xl w-64 max-h-48 overflow-y-auto z-50 py-1" style="display:none;">
                        <div class="px-3 py-1 text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Members (Tab to select)</div>
                        <template x-for="(user, index) in filteredMentionUsers" :key="user.uid">
                            <button @click="insertMention(user.username)" class="w-full flex items-center px-3 py-1.5 hover:bg-[#3f4147] transition group text-left" :class="index === 0 ? 'bg-[#3f4147]/50' : ''">
                                <img :src="user.avatar" class="w-6 h-6 rounded-full mr-2 object-cover bg-[#1e1f22]">
                                <span class="text-sm font-medium text-gray-200 group-hover:text-white truncate" x-text="user.displayName"></span>
                                <span class="text-xs text-gray-500 ml-2 truncate" x-text="'@' + user.username"></span>
                            </button>
                        </template>
                    </div>

                    <div class="bg-[#383a40] rounded-lg flex items-center px-4 py-2.5 transition">
                        <button @click="triggerImageUpload('chat')" x-show="!editingMessageId" class="text-gray-400 hover:text-gray-200 p-1 flex-shrink-0 transition mr-2 bg-[#2b2d31] rounded-full h-7 w-7 flex items-center justify-center hover:bg-[#5865F2] hover:text-white">
                            <i class="ph-fill ph-plus font-bold"></i>
                        </button>
                        <input type="text" x-model="newMessage" x-ref="chatInput" @input="checkMentions()" @keydown.tab.prevent="if(showMentions && filteredMentionUsers.length > 0) insertMention(filteredMentionUsers[0].username)" @keydown.enter="sendMessage()" :placeholder="editingMessageId ? 'Edit message...' : getChatPlaceholder()" class="flex-1 bg-transparent px-1 focus:outline-none text-gray-100 placeholder-gray-500 text-[15px]">
                        <button @click="sendMessage()" :disabled="!newMessage.trim() && !pendingImage" class="p-1.5 rounded-md text-gray-400 hover:text-[#5865F2] disabled:opacity-50 disabled:cursor-not-allowed transition flex-shrink-0 ml-2">
                            <i x-show="!editingMessageId" class="ph-fill ph-paper-plane-right text-xl"></i>
                            <i x-show="editingMessageId" class="ph-bold ph-check text-xl text-[#23A559]"></i>
                        </button>
                    </div>
                    
                    <!-- Pending Image Preview -->
                    <template x-if="pendingImage">
                        <div class="mt-3 relative inline-block bg-[#2b2d31] p-2 rounded-md border border-[#1e1f22] shadow-lg">
                            <img :src="pendingImage" class="h-32 rounded object-cover">
                            <button @click="pendingImage = null" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md hover:bg-red-600">
                                <i class="ph ph-x text-xs"></i>
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Far Right Sidebar (Member List & Active Now) -->
            <div class="bg-[#2b2d31] flex flex-col flex-shrink-0 transition-all duration-300 overflow-hidden" :class="(showMembersList && activeView === 'server' && !viewingVoice) || (showMembersList && activeView === 'home' && activeTarget && !viewingVoice) || (activeView === 'home' && !activeTarget) ? 'w-72' : 'w-0'">
                <div class="p-4 w-72 h-full overflow-y-auto flex flex-col">
                    
                    <!-- Active Now Hub (Home Screen) -->
                    <template x-if="activeView === 'home' && !activeTarget">
                        <div class="flex-1">
                            <h2 class="font-extrabold text-gray-100 text-xl mb-4 mt-2">Active Now</h2>
                            
                            <template x-if="activeNowGroups.length === 0">
                                <div class="text-center p-4">
                                    <p class="text-sm text-gray-400 font-medium mt-4">It's quiet for now...</p>
                                    <p class="text-[13px] text-gray-500 mt-2">When a friend starts a voice call, it will show up here.</p>
                                </div>
                            </template>
                            
                            <div class="space-y-3">
                                <template x-for="group in activeNowGroups" :key="group.key">
                                    <div class="bg-[#313338] border border-[#1e1f22] rounded-lg p-3 hover:bg-[#35373c] cursor-pointer transition shadow-md group" @click="joinActiveCall(group.serverId, group.voiceId)">
                                        <div class="flex flex-col gap-1 mb-3">
                                            <span class="font-bold text-gray-100 text-[14px] truncate group-hover:underline" x-text="getServerName(group.serverId) || 'Direct Message'"></span>
                                            <div class="text-xs font-bold text-gray-300 flex items-center gap-1.5">
                                                <i class="ph-fill ph-speaker-high text-[#23A559] text-sm"></i>
                                                <span class="truncate" x-text="getChannelName(group.voiceId)"></span>
                                            </div>
                                        </div>
                                        <div class="flex flex-wrap gap-2">
                                            <template x-for="user in group.users" :key="user.uid">
                                                <img :src="user.avatar" class="w-8 h-8 rounded-full object-cover bg-[#1e1f22] border border-[#2b2d31]" :title="user.displayName">
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Server Member List -->
                    <template x-if="activeView === 'server'">
                        <div>
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-3">Online — <span x-text="getServerMembers('online').length"></span></div>
                            <div class="space-y-[2px] mb-6">
                                <template x-for="p in getServerMembers('online')" :key="p.uid">
                                    <div @click="openProfilePopout(p.uid)" class="flex items-center px-2 py-1.5 rounded-md hover:bg-[#35373c] cursor-pointer transition group">
                                        <div class="relative">
                                            <img :src="p.avatar" class="w-8 h-8 rounded-full object-cover bg-[#1e1f22]">
                                            <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-[#23A559] border-2 border-[#2b2d31] rounded-full"></div>
                                        </div>
                                        <div class="ml-3 truncate flex-1 flex justify-between items-center">
                                            <div class="text-[15px] font-medium text-gray-300 group-hover:text-gray-100 truncate transition" :class="p.uid === getServer()?.owner ? 'text-gray-100 font-bold' : ''" x-text="p.displayName"></div>
                                            <i x-show="getServer()?.owner === p.uid" class="ph-fill ph-crown text-[#F1C40F] ml-1" title="Server Owner"></i>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-3">Offline — <span x-text="getServerMembers('offline').length"></span></div>
                            <div class="space-y-[2px]">
                                <template x-for="p in getServerMembers('offline')" :key="p.uid">
                                    <div @click="openProfilePopout(p.uid)" class="flex items-center px-2 py-1.5 rounded-md hover:bg-[#35373c] cursor-pointer transition group opacity-50 hover:opacity-100">
                                        <div class="relative">
                                            <img :src="p.avatar" class="w-8 h-8 rounded-full object-cover bg-[#1e1f22] grayscale group-hover:grayscale-0 transition">
                                            <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-gray-500 border-2 border-[#2b2d31] rounded-full"></div>
                                        </div>
                                        <div class="ml-3 truncate flex-1 flex justify-between items-center">
                                            <div class="text-[15px] font-medium text-gray-400 group-hover:text-gray-200 truncate transition" x-text="p.displayName"></div>
                                            <i x-show="getServer()?.owner === p.uid" class="ph-fill ph-crown text-[#F1C40F] ml-1 grayscale" title="Server Owner"></i>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- DM Member List (Just shows the two participants) -->
                    <template x-if="activeView === 'home' && activeTarget">
                        <div>
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-3">Participants</div>
                            <div class="space-y-[2px] mb-6">
                                <!-- The Partner -->
                                <div @click="openProfilePopout(getDmPartner(activeTarget))" class="flex items-center px-2 py-1.5 rounded-md hover:bg-[#35373c] cursor-pointer transition group">
                                    <div class="relative">
                                        <img :src="getUser(getDmPartner(activeTarget))?.avatar" class="w-8 h-8 rounded-full object-cover bg-[#1e1f22]" :class="isUserOnline(getDmPartner(activeTarget)) ? '' : 'grayscale'">
                                        <div class="absolute bottom-0 right-0 w-3.5 h-3.5 border-2 border-[#2b2d31] rounded-full" :class="isUserOnline(getDmPartner(activeTarget)) ? 'bg-[#23A559]' : 'bg-gray-500'"></div>
                                    </div>
                                    <div class="ml-3 truncate flex-1">
                                        <div class="text-[15px] font-medium text-gray-300 group-hover:text-gray-100 truncate transition" x-text="getUser(getDmPartner(activeTarget))?.displayName"></div>
                                    </div>
                                </div>
                                <!-- You -->
                                <div class="flex items-center px-2 py-1.5 rounded-md hover:bg-[#35373c] cursor-pointer transition group" @click="openSettings()">
                                    <div class="relative">
                                        <img :src="currentUserProfile?.avatar" class="w-8 h-8 rounded-full object-cover bg-[#1e1f22]">
                                        <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-[#23A559] border-2 border-[#2b2d31] rounded-full"></div>
                                    </div>
                                    <div class="ml-3 truncate flex-1">
                                        <div class="text-[15px] font-medium text-gray-300 group-hover:text-gray-100 truncate transition" x-text="currentUserProfile?.displayName + ' (You)'"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </template>

    <!-- Profile Popout Overlay -->
    <div x-show="showProfilePopout" style="display: none;" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity">
        <div class="bg-[#232428] rounded-xl shadow-2xl w-full max-w-sm overflow-hidden" @click.away="showProfilePopout = false">
            <div class="h-28 w-full relative" :style="'background-color: ' + (popoutUser?.bannerColor || '#5865F2')">
                <template x-if="popoutUser?.banner">
                    <img :src="popoutUser?.banner" class="absolute inset-0 w-full h-full object-cover">
                </template>
            </div>
            <div class="px-5 pb-6 relative flex flex-col h-[350px]">
                <!-- Absolute Avatar Overlay to prevent clipping -->
                <div class="absolute -top-12 left-5 bg-[#232428] rounded-full p-1.5 inline-block z-10">
                    <img :src="popoutUser?.avatar" class="w-20 h-20 rounded-full bg-[#1e1f22] object-cover shadow-sm">
                </div>
                
                <!-- Action Buttons right aligned below banner -->
                <div class="flex justify-end pt-3 mb-4 gap-2 h-12 relative z-20 flex-shrink-0">
                    <template x-if="popoutUser?.uid !== currentUserProfile?.uid">
                        <button @click="initiateDM(popoutUser?.uid)" class="w-9 h-9 rounded-full bg-[#313338] hover:bg-[#5865F2] text-gray-200 hover:text-white flex items-center justify-center transition shadow-lg border border-[#1e1f22]" title="Send Message">
                            <i class="ph-fill ph-chat-circle-dots text-lg"></i>
                        </button>
                    </template>
                    
                    <!-- Mutual Friend Request Logic -->
                    <template x-if="popoutUser?.uid !== currentUserProfile?.uid && !isFriend(popoutUser?.uid) && !isPendingOutgoing(popoutUser?.uid) && !isPendingIncoming(popoutUser?.uid)">
                        <button @click="addFriend(popoutUser?.uid)" class="w-9 h-9 rounded-full bg-[#23A559] hover:bg-[#1f8c4b] text-white flex items-center justify-center transition shadow-lg border border-[#1e1f22]" title="Add Friend">
                            <i class="ph-fill ph-user-plus text-lg"></i>
                        </button>
                    </template>
                    <template x-if="popoutUser?.uid !== currentUserProfile?.uid && isPendingOutgoing(popoutUser?.uid)">
                        <button @click="removeFriend(popoutUser?.uid)" class="w-9 h-9 rounded-full bg-gray-500 hover:bg-red-500 text-white flex items-center justify-center transition shadow-lg border border-[#1e1f22]" title="Cancel Request">
                            <i class="ph-fill ph-user-minus text-lg"></i>
                        </button>
                    </template>
                    <template x-if="popoutUser?.uid !== currentUserProfile?.uid && isPendingIncoming(popoutUser?.uid)">
                        <button @click="addFriend(popoutUser?.uid)" class="w-9 h-9 rounded-full bg-[#5865F2] hover:bg-[#4752C4] text-white flex items-center justify-center transition shadow-lg border border-[#1e1f22]" title="Accept Request">
                            <i class="ph-bold ph-check text-lg"></i>
                        </button>
                    </template>
                    <template x-if="popoutUser?.uid !== currentUserProfile?.uid && isFriend(popoutUser?.uid)">
                        <button @click="removeFriend(popoutUser?.uid)" class="w-9 h-9 rounded-full bg-[#313338] hover:bg-red-500 text-gray-300 hover:text-white flex items-center justify-center transition shadow-lg border border-[#1e1f22]" title="Remove Friend">
                            <i class="ph-fill ph-user-minus text-lg"></i>
                        </button>
                    </template>
                </div>
                
                <div class="flex-shrink-0">
                    <h3 class="text-2xl font-extrabold text-gray-100 leading-tight truncate pr-2" x-text="popoutUser?.displayName"></h3>
                    <p class="text-sm text-gray-400 font-medium mb-4" x-text="'@' + popoutUser?.username"></p>
                </div>

                <!-- Tabs -->
                <div class="flex gap-4 border-b border-[#313338] mb-3 flex-shrink-0">
                    <button @click="profileTab = 'info'" class="pb-2 text-xs font-bold uppercase tracking-wide transition border-b-2" :class="profileTab === 'info' ? 'text-gray-100 border-gray-100' : 'text-gray-400 border-transparent hover:text-gray-300'">User Info</button>
                    <button @click="profileTab = 'servers'" class="pb-2 text-xs font-bold uppercase tracking-wide transition border-b-2" :class="profileTab === 'servers' ? 'text-gray-100 border-gray-100' : 'text-gray-400 border-transparent hover:text-gray-300'">Mutual Servers</button>
                    <button @click="profileTab = 'friends'" class="pb-2 text-xs font-bold uppercase tracking-wide transition border-b-2" :class="profileTab === 'friends' ? 'text-gray-100 border-gray-100' : 'text-gray-400 border-transparent hover:text-gray-300'">Mutual Friends</button>
                </div>

                <!-- Tab Contents -->
                <div class="overflow-y-auto no-scrollbar flex-1 -mx-2 px-2 pb-2">
                    <template x-if="profileTab === 'info'">
                        <div>
                            <h4 class="text-[11px] font-bold text-gray-400 uppercase mb-2">About Me</h4>
                            <p class="text-sm text-gray-300 whitespace-pre-wrap break-words" x-text="popoutUser?.bio || 'No bio provided.'"></p>
                        </div>
                    </template>

                    <template x-if="profileTab === 'servers'">
                        <div class="space-y-1">
                            <template x-if="getMutualServers(popoutUser?.uid).length === 0">
                                <div class="text-gray-500 text-xs text-center py-4 font-medium">No mutual servers in common</div>
                            </template>
                            <template x-for="server in getMutualServers(popoutUser?.uid)" :key="server.id">
                                <div class="flex items-center gap-3 p-1.5 hover:bg-[#313338] rounded-md cursor-pointer transition group" @click="openServer(server.id); showProfilePopout = false">
                                    <template x-if="server.icon">
                                        <img :src="server.icon" class="w-8 h-8 rounded-lg object-cover">
                                    </template>
                                    <template x-if="!server.icon">
                                        <div class="w-8 h-8 rounded-lg bg-[#1e1f22] flex items-center justify-center text-xs font-bold text-white" x-text="server.name.substring(0,2).toUpperCase()"></div>
                                    </template>
                                    <span class="text-[15px] font-medium text-gray-300 group-hover:text-gray-100 transition" x-text="server.name"></span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template x-if="profileTab === 'friends'">
                        <div class="space-y-1">
                            <template x-if="getMutualFriends(popoutUser?.uid).length === 0">
                                <div class="text-gray-500 text-xs text-center py-4 font-medium">No mutual friends in common</div>
                            </template>
                            <template x-for="friend in getMutualFriends(popoutUser?.uid)" :key="friend.uid">
                                <div class="flex items-center gap-3 p-1.5 hover:bg-[#313338] rounded-md cursor-pointer transition group" @click="openProfilePopout(friend.uid)">
                                    <img :src="friend.avatar" class="w-8 h-8 rounded-full object-cover">
                                    <span class="text-[15px] font-medium text-gray-300 group-hover:text-gray-100 transition" x-text="friend.displayName"></span>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- User Settings Modal -->
    <div x-show="showSettingsModal" style="display: none;" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-[#313338] rounded-xl shadow-2xl w-full max-w-lg overflow-hidden" @click.away="showSettingsModal = false">
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-100 mb-6">User Settings</h2>
                
                <div class="flex flex-col gap-6 mb-6">

    <script type="module">
        import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/module.esm.js';

        const svgC = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%235865F2"/><stop offset="100%" stop-color="%234752C4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter></defs><rect width="100" height="100" fill="url(%23g)"/><text x="50" y="72" font-family="Arial, sans-serif" font-size="65" font-weight="900" fill="white" text-anchor="middle" filter="url(%23s)">C</text></svg>`;
        const svgPerson = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23313338"/><circle cx="50" cy="40" r="22" fill="%2380848E"/><path d="M15 100 C15 65, 85 65, 85 100 Z" fill="%2380848E"/></svg>`;
        const svgPen = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="f" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%23EAB308"/><stop offset="100%" stop-color="%23A16207"/></linearGradient></defs><rect width="100" height="100" fill="%231e1f22"/><path d="M50 15 L65 50 L50 85 L35 50 Z" fill="url(%23f)"/><circle cx="50" cy="55" r="4" fill="%231e1f22"/><path d="M50 55 v30" stroke="%231e1f22" stroke-width="2"/></svg>`;
        const svgHat = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23B91C1C"/><ellipse cx="50" cy="65" rx="45" ry="12" fill="%23111827"/><path d="M30 60 C30 25, 70 25, 70 60 Z" fill="%231f2937"/><rect x="30" y="52" width="40" height="8" fill="%23000"/></svg>`;

        const faviconNormal = 'favicon.ico';
        const faviconAlert = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%235865F2"/><circle cx="80" cy="20" r="18" fill="red"/></svg>`;

        window.nexusApp = () => ({
            isReady: false,
            authLoading: true,
            authMode: 'login',
            authUsername: '', authPassword: '', authDisplayName: '', authAvatar: svgC,
            defaultAvatars: [{ data: svgC }, { data: svgPerson }, { data: svgPen }, { data: svgHat }],
            
            logicalUid: null, 
            currentUserProfile: null,
            
            toast: { show: false, message: '', isError: false, timeout: null },
            zoomedImage: null,

            showSettingsModal: false, editProfile: {},
            showProfilePopout: false, popoutUser: null, profileTab: 'info',
            showCreateServerModal: false, newServerName: '', newServerIcon: null,
            showServerSettingsModal: false, serverSettingsTab: 'overview', editServer: {}, newChannelName: '', newChannelType: 'text',
            
            activeView: 'home',
            activeTarget: null, 
            activeChannelId: null, 
            activeRoomReadMarker: { roomId: null, timestamp: 0 },
            showMembersList: true,
            viewingVoice: false,
            friendsTab: 'online', 
            fullscreenVideoId: null,
            videoCount: 1, 
            
            newMessage: '', pendingImage: null, editingMessageId: null,
            showMentions: false, mentionQuery: '', filteredMentionUsers: [],
            directFriendRequestUsername: '',
            
            servers: [], dms: [], messages: [], filteredMessages: [], users: {}, globalPresence: [], _colorCache: {},
            
            get myServers() { return this.servers.filter(s => this.currentUserProfile?.joinedServers?.includes(s.id)); },
            get discoveryServers() { return this.servers.filter(s => s.isPublic && !this.currentUserProfile?.joinedServers?.includes(s.id)); },
            get currentChatId() { return this.activeView === 'server' ? this.activeChannelId : this.activeTarget; },
            
            get activePresence() {
                const now = Date.now();
                return this.globalPresence.filter(p => {
                    const elapsed = now - (p._localLastSeen || p.lastActive);
                    return elapsed < 600000 && p.status === 'online'; 
                });
            },

            get myFriendsList() {
                const myFriends = this.currentUserProfile?.friends || [];
                return Object.values(this.users).filter(u => myFriends.includes(u.uid) && u.friends?.includes(this.logicalUid));
            },
            get onlineFriendsList() {
                return this.myFriendsList.filter(f => this.isUserOnline(f.uid));
            },
            get activeNowGroups() {
                const groups = {};
                this.myFriendsList.forEach(f => {
                    const p = this.activePresence.find(x => x.uid === f.uid);
                    if (p && p.currentVoice) {
                        const key = `${p.currentServer || 'dm'}_${p.currentVoice}`;
                        if (!groups[key]) groups[key] = { key, serverId: p.currentServer, voiceId: p.currentVoice, users: [] };
                        groups[key].users.push(f);
                    }
                });
                return Object.values(groups);
            },
            get incomingFriendRequests() {
                const myFriends = this.currentUserProfile?.friends || [];
                return Object.values(this.users).filter(u => u.friends?.includes(this.logicalUid) && !myFriends.includes(u.uid));
            },
            get outgoingFriendRequests() {
                const myFriends = this.currentUserProfile?.friends || [];
                return Object.values(this.users).filter(u => myFriends.includes(u.uid) && !u.friends?.includes(this.logicalUid));
            },

            joinActiveCall(serverId, voiceId) {
                if (serverId && serverId !== 'dm') {
                    this.openServer(serverId);
                } else if (serverId === 'dm') {
                    this.openDM(voiceId);
                }
                setTimeout(() => {
                    this.handleVoiceChannelClick(voiceId);
                }, 100);
            },

            getMutualServers(targetUid) {
                if (!this.currentUserProfile || !targetUid) return [];
                const targetUser = this.getUser(targetUid);
                if (!targetUser) return [];
                return this.servers.filter(s => 
                    this.currentUserProfile.joinedServers?.includes(s.id) && 
                    targetUser.joinedServers?.includes(s.id)
                );
            },
            getMutualFriends(targetUid) {
                if (!this.currentUserProfile || !targetUid) return [];
                const targetUser = this.getUser(targetUid);
                if (!targetUser) return [];
                return this.myFriendsList.filter(f => targetUser.friends?.includes(f.uid));
            },

            get sortedDms() {
                return this.dms.slice().sort((a, b) => {
                    const lastA = this.getLastMessageTimestamp(a.id);
                    const lastB = this.getLastMessageTimestamp(b.id);
                    return lastB - lastA;
                });
            },
            getLastMessageTimestamp(roomId) {
                const msgs = this.messages.filter(m => m.roomId === roomId);
                if (msgs.length === 0) return 0;
                return msgs[msgs.length - 1].timestamp;
            },
            get totalUnreadDms() {
                return this.dms.reduce((sum, dm) => {
                    if (this.activeTarget !== dm.id) {
                        return sum + this.getUnreadCount(dm.id);
                    }
                    return sum;
                }, 0);
            },
            getUnreadCount(roomId) {
                if (!roomId || !this.messages || !this.currentUserProfile) return 0;
                const lastRead = this.currentUserProfile?.lastRead?.[roomId] || 0;
                return this.messages.filter(m => m.roomId === roomId && m.senderId !== this.logicalUid && m.timestamp > lastRead).length;
            },
            getMentionCount(roomId) {
                if (!roomId || !this.messages || !this.currentUserProfile) return 0;
                const lastRead = this.currentUserProfile?.lastRead?.[roomId] || 0;
                return this.messages.filter(m => m.roomId === roomId && m.senderId !== this.logicalUid && m.timestamp > lastRead && this.isMentioned(m.text)).length;
            },
            getServerMentionCount(serverId) {
                const s = this.servers.find(srv => srv.id === serverId);
                if(!s || !s.channels) return 0;
                return s.channels.reduce((sum, c) => sum + this.getMentionCount(c.id), 0);
            },
            hasUnread(roomId) {
                return this.getUnreadCount(roomId) > 0;
            },
            getServerUnreadState(serverId) {
                const s = this.servers.find(srv => srv.id === serverId);
                if(!s || !s.channels) return false;
                for(let c of s.channels) {
                    if (c.type === 'text' && this.hasUnread(c.id) && this.activeChannelId !== c.id) return true;
                }
                return false;
            },
            markRead(roomId) {
                if (!roomId || !this.logicalUid || !this.currentUserProfile) return;
                const lr = { ...(this.currentUserProfile.lastRead || {}) };
                lr[roomId] = Date.now();
                this.apiUpdate('users', this.logicalUid, { lastRead: lr });
                this.updateFavicon();
            },
            updateFavicon() {
                const link = document.getElementById('dynamic-favicon');
                if (link) { link.href = this.totalUnreadDms > 0 ? faviconAlert : faviconNormal; }
            },

            get groupedMessages() {
                if (!this.filteredMessages || this.filteredMessages.length === 0) return [];
                const groups = [];
                let currentGroup = null;
                let lastDateStr = null;
                let foundUnread = false;

                for (const msg of this.filteredMessages) {
                    const dateObj = new Date(msg.timestamp);
                    const dateStr = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                    let showDateSeparator = false;

                    if (dateStr !== lastDateStr) {
                        showDateSeparator = true;
                        lastDateStr = dateStr;
                        currentGroup = null; 
                    }
                    
                    let isFirstUnread = false;
                    if (!foundUnread && this.activeRoomReadMarker && msg.roomId === this.activeRoomReadMarker.roomId && msg.timestamp > this.activeRoomReadMarker.timestamp && msg.senderId !== this.logicalUid) {
                        isFirstUnread = true;
                        foundUnread = true;
                        currentGroup = null; 
                    }

                    if (!currentGroup || currentGroup.senderId !== msg.senderId || (msg.timestamp - currentGroup.lastTimestamp) > 300000) {
                        currentGroup = {
                            id: msg.id + '_grp',
                            senderId: msg.senderId,
                            timestamp: msg.timestamp,
                            lastTimestamp: msg.timestamp,
                            messages: [{...msg, isFirstUnread}],
                            dateSeparator: showDateSeparator ? dateStr : null
                        };
                        groups.push(currentGroup);
                    } else {
                        currentGroup.messages.push({...msg, isFirstUnread});
                        currentGroup.lastTimestamp = msg.timestamp;
                    }
                }
                return groups;
            },
            
            formatSidebarTime(ts) { 
                if(!ts) return '';
                const d = new Date(ts);
                const today = new Date();
                if (d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear()) {
                    return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                }
                return d.toLocaleDateString('en-US', {month: '2-digit', day: '2-digit', year: 'numeric'});
            },
            
            formatChatTime(ts) {
                if(!ts) return '';
                const d = new Date(ts);
                const today = new Date();
                const timeStr = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                if (d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear()) {
                    return `Today at ${timeStr}`;
                }
                
                const yesterday = new Date(today);

            extractProminentColor(base64) {
                return new Promise(resolve => {
                    if (!base64 || !base64.startsWith('data:image')) return resolve('#5865F2');
                    if (this._colorCache[base64]) return resolve(this._colorCache[base64]);
                    
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 64; canvas.height = 64;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 64, 64);
                        const data = ctx.getImageData(0,0,64,64).data;
                        
                        const colorCounts = {};
                        let maxCount = 0;
                        let prominentRGB = {r:88, g:101, b:242};

                        for (let i = 0; i < data.length; i += 16) {
                            if (data[i+3] < 128) continue; 
                            const r = Math.round(data[i] / 16) * 16;
                            const g = Math.round(data[i+1] / 16) * 16;
                            const b = Math.round(data[i+2] / 16) * 16;
                            
                            if (Math.abs(r-g) > 20 || Math.abs(g-b) > 20 || Math.abs(r-b) > 20) {
                                const key = `${r},${g},${b}`;
                                colorCounts[key] = (colorCounts[key] || 0) + 1;
                                if (colorCounts[key] > maxCount) {
                                    maxCount = colorCounts[key];
                                    prominentRGB = {r: data[i], g: data[i+1], b: data[i+2]};
                                }
                            }
                        }
                        if (maxCount === 0) return resolve('#5865F2'); 
                        const hex = `#${((1 << 24) + (prominentRGB.r << 16) + (prominentRGB.g << 8) + prominentRGB.b).toString(16).slice(1)}`;
                        this._colorCache[base64] = hex;
                        resolve(hex);
                    };
                    img.onerror = () => resolve('#5865F2');
                    img.src = base64;
                });
            },

            getAvatarColor(base64str) {
                if (this._colorCache[base64str]) return this._colorCache[base64str];
                return '#5865F2'; 
            },

            handleDbChange(event, row) {
                const c = row.collection_name;
                const id = row.document_id;
                const d = row.data;
                
                if (event === 'DELETE') {
                    if (c === 'messages') { this.messages = this.messages.filter(m => m.id !== id); this.filterMessages(); }
                    else if (c === 'servers') { this.servers = this.servers.filter(s => s.id !== id); }
                } else {
                    d.id = id; 
                    if (c === 'users') { this.cacheUser(d); if(id === this.logicalUid) { this.currentUserProfile = d; } }
                    else if (c === 'servers') { 
                        const idx = this.servers.findIndex(s=>s.id===id); 
                        if(idx>=0) this.servers.splice(idx, 1, d); else this.servers.push(d); 
                    }
                    else if (c === 'dms') {
                        if (d.participants && d.participants.includes(this.logicalUid)) {
                            const mapped = { id: id, partnerUid: d.participants.find(p => p !== this.logicalUid) };
                            const idx = this.dms.findIndex(x=>x.id===id); 
                            if(idx>=0) this.dms.splice(idx, 1, mapped); else this.dms.push(mapped);
                        }
                    }
                    else if (c === 'messages') { 
                        const idx = this.messages.findIndex(m=>m.id===id); 
                        if(idx>=0) this.messages.splice(idx, 1, d); else this.messages.push(d); 
                        this.filterMessages(); 
                    }
                    else if (c === 'presence') { 
                        d._localLastSeen = Date.now();
                        const idx = this.globalPresence.findIndex(p=>p.uid===id); 
                        if(idx>=0) {
                            if (d.lastActive < this.globalPresence[idx].lastActive) return; 
                            this.globalPresence.splice(idx, 1, d); 
                        } else {
                            this.globalPresence.push(d);
                        }
                        this.checkPresenceSideEffects(); 
                        this.updateVideoFallbacks(); 
                    }
                    else if (c === 'signaling') {
                        if (d.to === this.logicalUid && d.room === this.inVoiceRoom) {
                            this.handleIncomingSignal(d.from, d.signal);
                            this.apiDelete('signaling', id); 
                        }
                    }
                }
