
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le BaroChat™</title>
    
    <link id="dynamic-favicon" rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CRITICAL POLYFILLS FOR SIMPLE-PEER IN BROWSER -->
    <script>
        window.global = window;
        window.process = { env: { DEBUG: undefined } };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

    <script type="module" src="app.js"></script>
</head>
<body class="h-screen w-screen flex bg-[#1e1f22]" x-data="nexusApp()" x-cloak>

    <!-- Global Toast Notification -->
    <div x-show="toast.show" x-transition.opacity class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[1000] px-4 py-3 rounded-md shadow-2xl text-sm font-bold text-white transition-all flex items-center gap-3" :class="toast.isError ? 'bg-red-500' : 'bg-[#5865F2]'">
        <i class="ph-fill text-xl" :class="toast.isError ? 'ph-warning-circle' : 'ph-info'"></i>
        <span x-text="toast.message"></span>
    </div>

    <!-- Image Preview Overlay -->
    <div x-show="showImagePreview" class="image-preview-overlay" @click="closeImage()">
        <div class="relative">
            <img :src="previewImageUrl" @click.stop>
            <button @click="closeImage()" class="absolute -top-10 -right-10 text-white hover:text-red-500 transition">
                <i class="ph ph-x-circle text-4xl"></i>
            </button>
        </div>
    </div>

    <!-- Onboarding / Auth Overlay -->
    <div x-show="!isReady" class="fixed inset-0 z-50 flex items-center justify-center bg-[#1e1f22] overflow-y-auto py-10">
        <div x-show="authLoading" class="flex flex-col items-center text-gray-300">
            <i class="ph ph-spinner-gap animate-spin text-5xl mb-4 text-[#5865F2]"></i>
            <h1 class="text-xl font-bold tracking-tight">Connecting to Le BaroChat™...</h1>
        </div>

        <div x-show="!authLoading" class="flex flex-col md:flex-row gap-8 items-start max-w-5xl w-full px-6">
            <div class="bg-[#313338] p-8 rounded-xl shadow-2xl w-full max-w-md">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-100" x-text="authMode === 'login' ? 'Welcome Back!' : 'Create an Account'"></h2>
                    <p class="text-gray-400 mt-1 text-sm" x-text="authMode === 'login' ? 'Log in with your unique @username.' : 'Join Le BaroChat™ and connect with friends.'"></p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Username</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-gray-500 font-bold">@</span>
                            <input type="text" x-model="authUsername" placeholder="e.g. capybara" class="w-full pl-8 pr-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-[#5865F2] focus:ring-1 focus:ring-[#5865F2] text-gray-100 text-sm outline-none transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Password</label>
                        <input type="password" x-model="authPassword" @keydown.enter="processAuth()" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-[#5865F2] focus:ring-1 focus:ring-[#5865F2] text-gray-100 text-sm outline-none transition">
                    </div>

                    <template x-if="authMode === 'register'">
                        <div class="space-y-4 pt-2 border-t border-[#2b2d31] mt-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 mt-4">Display Name</label>
                                <input type="text" x-model="authDisplayName" placeholder="How you appear to others" maxlength="20" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-[#5865F2] focus:ring-1 focus:ring-[#5865F2] text-gray-100 text-sm outline-none transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Choose an Avatar</label>
                                <div class="grid grid-cols-4 gap-3 mb-3">
                                    <template x-for="(avatarObj, index) in defaultAvatars" :key="index">
                                        <button @click="authAvatar = avatarObj.data" class="aspect-square rounded-full overflow-hidden border-2 transition hover:opacity-80 bg-[#1e1f22]" :class="authAvatar === avatarObj.data ? 'border-[#5865F2] scale-105 shadow-lg' : 'border-transparent'">
                                            <img :src="avatarObj.data" class="w-full h-full object-cover">
                                        </button>
                                    </template>
                                </div>
                                <button @click="triggerImageUpload('setup')" class="w-full py-2 text-sm text-[#5865F2] font-medium bg-[#2b2d31] hover:bg-[#1e1f22] rounded-md transition border border-transparent hover:border-[#383a40]">
                                    Or upload custom image...
                                </button>
                            </div>
                        </div>
                    </template>

                    <button @click="processAuth()" :disabled="!authUsername || !authPassword || (authMode === 'register' && !authDisplayName)" class="w-full py-3 bg-[#5865F2] hover:bg-[#4752C4] disabled:opacity-50 text-white font-bold rounded-md shadow transition mt-6">
                        <span x-text="authMode === 'login' ? 'Log In' : 'Register'"></span>
                    </button>

                    <div class="text-sm text-gray-400 mt-4 text-center">
                        <span x-text="authMode === 'login' ? 'Need an account?' : 'Already have an account?'"></span>
                        <button @click="authMode = authMode === 'login' ? 'register' : 'login'" class="text-[#00A8FC] hover:underline ml-1 font-medium">
                            <span x-text="authMode === 'login' ? 'Register' : 'Log In'"></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Live Profile Preview -->
            <div class="w-full max-w-sm hidden md:block" x-show="authMode === 'register'">
                <div class="text-xs font-bold text-gray-500 uppercase mb-3 text-center">Live Profile Preview</div>
                <div class="bg-[#232428] rounded-xl shadow-2xl w-full overflow-hidden">
                    <div class="h-24 bg-[#5865F2] w-full"></div>
                    <div class="px-5 pb-6">
                        <div class="-mt-12 bg-[#232428] rounded-full p-1.5 inline-block relative z-10">
                            <img :src="authAvatar" class="w-20 h-20 rounded-full object-cover bg-[#1e1f22] shadow-sm">
                        </div>
                        <div class="pt-2">
                            <h3 class="text-xl font-extrabold text-gray-100 leading-tight truncate" x-text="authDisplayName || 'Your Name'"></h3>
                            <p class="text-sm text-gray-400 font-medium mb-4" x-text="'@' + (authUsername.replace(/[^a-zA-Z0-9_]/g, '').toLowerCase() || 'username')"></p>
                            <div class="w-full h-[1px] bg-[#313338] mb-4"></div>
                            <h4 class="text-[11px] font-bold text-gray-400 uppercase mb-2">About Me</h4>
                            <p class="text-sm text-gray-300">Ready to chat on Le BaroChat™!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Interface -->
    <template x-if="isReady && currentUserProfile">
        <div class="flex h-full w-full">
            
            <!-- Server List -->
            <div class="w-[72px] h-full bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0 z-30 overflow-y-auto no-scrollbar">
                <button @click="openHome()" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-gray-100 flex items-center justify-center transition-all duration-200 relative group" :class="{'rounded-[16px] bg-[#5865F2] text-white': activeView === 'home'}">
                    <i class="ph-fill ph-house text-2xl"></i>
                    <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeView === 'home' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                    <div x-show="totalUnreadDms > 0" class="absolute -top-1 -right-1 bg-red-500 rounded-full border-[3px] border-[#1e1f22] text-[10px] font-bold text-white flex items-center justify-center min-w-[20px] h-[20px] px-1" x-text="totalUnreadDms"></div>
                </button>

                <div class="w-8 h-[2px] bg-[#313338] rounded-full my-1"></div>

                <template x-for="server in myServers" :key="server.id">
                    <button @click="openServer(server.id)" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-gray-100 hover:text-white flex items-center justify-center transition-all duration-200 shadow relative group overflow-hidden" :class="{'rounded-[16px] bg-[#5865F2] text-white': activeTarget === server.id && activeView === 'server'}">
                        <template x-if="server.icon">
                            <img :src="server.icon" class="w-full h-full object-cover">
                        </template>
                        <template x-if="!server.icon">
                            <span x-text="server.name.substring(0,2).toUpperCase()" class="font-bold text-sm"></span>
                        </template>
                        <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeTarget === server.id && activeView === 'server' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                    </button>
                </template>

                <button @click="showCreateServerModal = true; newServerName = ''" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] hover:bg-[#23A559] text-[#23A559] hover:text-white flex items-center justify-center transition-all duration-200 mt-2 group relative" title="Add a Server">
                    <i class="ph ph-plus text-xl"></i>
                </button>
                <button @click="openDiscovery()" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] hover:bg-[#5865F2] text-gray-300 hover:text-white flex items-center justify-center transition-all duration-200 mt-2 relative group" :class="{'rounded-[16px] bg-[#5865F2] text-white': activeView === 'discovery'}" title="Discover Servers">
                    <i class="ph-fill ph-compass text-2xl"></i>
                    <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeView === 'discovery' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                </button>
            </div>

            <!-- Sidebar -->
            <div class="w-60 h-full bg-[#2b2d31] flex flex-col flex-shrink-0 z-20 relative">
                <template x-if="activeView === 'home' || activeView === 'discovery'">
                    <div class="flex flex-col h-full">
                        <div class="h-12 border-b border-[#1e1f22] shadow-sm flex items-center px-4">
                            <form @submit.prevent="sendDirectFriendRequest()" class="w-full relative">
                                <input type="text" x-model="directFriendRequestUsername" placeholder="Find or start a conversation" class="w-full bg-[#1e1f22] text-gray-200 text-sm py-1.5 px-3 pr-8 rounded focus:outline-none focus:ring-1 focus:ring-[#5865F2] transition placeholder-gray-500">
                                <button type="submit" class="absolute right-2 top-1.5 text-gray-400 hover:text-white">
                                    <i class="ph-bold ph-plus"></i>
                                </button>
                            </form>
                        </div>
                        <div class="flex-1 overflow-y-auto p-2 space-y-[2px]">
                            <button @click="activeTarget = null; activeView = 'home'" class="w-full flex items-center px-3 py-2 rounded-md transition mb-2" :class="!activeTarget && activeView === 'home' ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:text-gray-100 hover:bg-[#35373c]'">
                                <i class="ph-fill ph-users mr-3 text-lg"></i>
                                <div class="flex-1 text-left font-medium text-[15px]">Friends</div>
                                <template x-if="incomingFriendRequests.length > 0">
                                    <div class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full" x-text="incomingFriendRequests.length"></div>
                                </template>
                            </button>
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 py-2 mt-2">Direct Messages</div>
                            <template x-for="dm in sortedDms" :key="dm.id">
                                <button @click="openDM(dm.id)" class="w-full flex items-center px-2 py-1.5 rounded-md transition group" :class="activeTarget === dm.id && activeView === 'home' ? 'bg-[#3f4147] text-white' : 'hover:bg-[#35373c] text-gray-400 hover:text-gray-200'">
                                    <div class="relative flex-shrink-0 mr-3">
                                        <img :src="getUser(dm.partnerUid)?.avatar" class="w-8 h-8 rounded-full object-cover bg-[#1e1f22]">
                                        <div class="absolute bottom-0 right-0 w-3 h-3 border-2 border-[#2b2d31] rounded-full" :class="isUserOnline(dm.partnerUid) ? 'bg-[#23A559]' : 'bg-gray-500'"></div>
                                    </div>
                                    <div class="flex-1 text-left truncate">
                                        <div class="font-medium text-[15px] truncate" x-text="getUser(dm.partnerUid)?.displayName || 'Unknown'"></div>
                                    </div>
                                    <template x-if="hasUnread(dm.id) && activeTarget !== dm.id">
                                        <div class="w-2.5 h-2.5 bg-red-500 rounded-full flex-shrink-0 shadow"></div>
                                    </template>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>

                <template x-if="activeView === 'server'">
                    <div class="flex flex-col h-full">
                        <div class="h-12 border-b border-[#1e1f22] shadow-sm flex items-center px-4 font-bold text-gray-100 justify-between cursor-pointer hover:bg-[#35373c] transition group relative z-50">
                            <span class="truncate pr-2" x-text="getServer()?.name"></span>
                            <i class="ph ph-caret-down text-gray-400 group-hover:text-gray-200"></i>
                            <div class="absolute top-10 left-2 right-2 bg-[#111214] rounded-md shadow-2xl border border-[#1e1f22] p-2 hidden group-hover:block">
                                <button @click.stop="copyInviteLink()" class="w-full flex items-center justify-between px-2 py-1.5 text-[#5865F2] hover:bg-[#5865F2] hover:text-white rounded-md transition text-sm font-medium mb-1">
                                    <span>Invite People</span> <i class="ph ph-user-plus"></i>
                                </button>
                                <template x-if="getServer()?.owner === currentUserProfile?.uid">
                                    <button @click.stop="openServerSettingsModal()" class="w-full flex items-center justify-between px-2 py-1.5 text-gray-300 hover:bg-[#5865F2] hover:text-white rounded-md transition text-sm font-medium">
                                        <span>Server Settings</span> <i class="ph ph-gear"></i>
                                    </button>
                                </template>
                                <div class="h-px bg-[#2b2d31] my-1"></div>
                                <button @click.stop="leaveServer()" class="w-full flex items-center justify-between px-2 py-1.5 text-red-400 hover:bg-red-500 hover:text-white rounded-md transition text-sm font-medium">
                                    <span>Leave Server</span> <i class="ph ph-sign-out"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto p-2 space-y-[2px]">
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 py-2">Text Channels</div>
                            <template x-for="channel in (getServer()?.channels || []).filter(c => c.type === 'text')" :key="channel.id">
                                <button @click="activeChannelId = channel.id; viewingVoice = false; markRead(channel.id)" class="w-full flex items-center px-2 py-1.5 rounded-md transition" :class="activeChannelId === channel.id && !viewingVoice ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                    <i class="ph ph-hash mr-2 text-lg"></i>
                                    <span class="font-medium text-[15px] truncate flex-1 text-left" x-text="channel.name"></span>
                                    <template x-if="hasUnread(channel.id) && activeChannelId !== channel.id">
                                        <div class="w-1.5 h-1.5 bg-white rounded-full flex-shrink-0"></div>
                                    </template>
                                </button>
                            </template>
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 py-2 mt-4">Voice Channels</div>
                            <template x-for="channel in (getServer()?.channels || []).filter(c => c.type === 'voice')" :key="channel.id">
                                <div>
                                    <button @click="handleVoiceChannelClick(channel.id)" class="w-full flex items-center px-2 py-1.5 rounded-md transition" :class="inVoiceRoom === channel.id ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                        <i class="ph-fill mr-2 text-lg" :class="inVoiceRoom === channel.id ? 'ph-speaker-high text-[#23A559]' : 'ph-speaker-low'"></i>
                                        <span class="font-medium text-[15px] truncate flex-1 text-left" x-text="channel.name"></span>
                                    </button>
                                    <div class="pl-6 pt-1 space-y-1 ml-4 border-l border-[#3f4147]">
                                        <template x-for="p in getVoiceUsers(channel.id)" :key="p.uid">
                                            <div class="flex items-center gap-2 px-2 py-1 rounded hover:bg-[#35373c] cursor-pointer group" @click="openProfilePopout(p.uid)">
                                                <img :src="getUser(p.uid)?.avatar" class="w-6 h-6 rounded-full object-cover">
                                                <span class="text-sm font-medium text-gray-400 group-hover:text-gray-200 truncate flex-1" x-text="getUser(p.uid)?.displayName"></span>
                                                <div class="flex items-center gap-1">
                                                    <i x-show="p.isScreenSharing" class="ph-fill ph-screencast text-xs text-[#5865F2]"></i>
                                                    <i x-show="!p.isCameraOff" class="ph-fill ph-video-camera text-xs text-gray-400"></i>
                                                    <i x-show="p.isMuted" class="ph-fill ph-microphone-slash text-xs text-red-400"></i>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <div class="mt-auto flex flex-col w-full z-30">
                    <div x-show="inVoiceRoom" class="bg-[#111214] p-2 border-t border-[#1e1f22] flex flex-col gap-2 relative z-20">
                        <div class="flex items-center justify-between text-[#23A559] px-1">
                            <div class="flex flex-col cursor-pointer hover:underline" @click="viewingVoice = true">
                                <span class="font-bold text-xs uppercase tracking-wide flex items-center gap-1"><i class="ph-fill ph-check-circle"></i> Voice Connected</span>
                                <span class="text-[11px] text-gray-400 truncate w-32" x-text="getChannelName(inVoiceRoom)"></span>
                            </div>
                            <button @click="leaveVoiceRoom()" class="text-red-400 hover:text-red-500 transition p-1"><i class="ph-fill ph-phone-disconnect text-xl"></i></button>
                        </div>
                        <div class="flex gap-1 justify-between bg-[#2b2d31] p-1 rounded-md">
                            <button @click="rtcToggleVideo()" class="p-1.5 flex-1 rounded hover:bg-[#3f4147] transition flex justify-center items-center" :class="!rtcVideoOff ? 'text-white bg-[#3f4147]' : 'text-gray-400'"><i class="ph-fill text-lg" :class="rtcVideoOff ? 'ph-video-camera-slash' : 'ph-video-camera'"></i></button>
                            <button @click="rtcToggleScreenShare()" class="p-1.5 flex-1 rounded hover:bg-[#3f4147] transition flex justify-center items-center" :class="isScreenSharing ? 'text-[#5865F2] bg-[#3f4147]' : 'text-gray-400'"><i class="ph-fill ph-screencast text-lg"></i></button>
                        </div>
                    </div>

                    <div class="h-[52px] bg-[#232428] flex items-center px-2 justify-between w-full border-t border-[#1e1f22]">
                        <div class="flex items-center min-w-0 hover:bg-[#3f4147]/50 p-1 rounded-md cursor-pointer flex-1 mr-1" @click="openSettings()">
                            <div class="relative flex-shrink-0">
                                <img :src="currentUserProfile?.avatar" class="w-8 h-8 rounded-full object-cover bg-[#1e1f22]">
                                <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 border-2 border-[#232428] rounded-full" :class="isDeafened ? 'bg-red-500' : 'bg-[#23A559]'"></div>
                            </div>
                            <div class="ml-2 truncate pb-0.5">
                                <div class="text-[13px] font-bold text-gray-100 leading-none truncate" x-text="currentUserProfile?.displayName"></div>
                                <div class="text-[11px] text-gray-400 leading-none mt-1 truncate" x-text="'@' + currentUserProfile?.username"></div>
                            </div>
                        </div>
                        <div class="flex items-center gap-0.5 flex-shrink-0">
                            <button @click="toggleMute()" class="w-7 h-7 rounded-md flex items-center justify-center hover:bg-[#3f4147] transition" :class="isMuted ? 'text-red-400' : 'text-gray-400 hover:text-gray-200'"><i class="ph-fill text-lg" :class="isMuted ? 'ph-microphone-slash' : 'ph-microphone'"></i></button>
                            <button @click="toggleDeafen()" class="w-7 h-7 rounded-md flex items-center justify-center hover:bg-[#3f4147] transition" :class="isDeafened ? 'text-red-400' : 'text-gray-400 hover:text-gray-200'"><i class="ph-fill text-lg" :class="isDeafened ? 'ph-headphones-slash' : 'ph-headphones'"></i></button>
                            <button @click="openSettings()" class="w-7 h-7 rounded-md flex items-center justify-center hover:bg-[#3f4147] text-gray-400 hover:text-gray-200 transition"><i class="ph-fill ph-gear text-lg"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="flex-1 flex flex-col bg-[#313338] min-w-0 relative z-10 overflow-hidden">
                <div class="h-12 border-b border-[#1e1f22] shadow-sm flex items-center px-4 flex-shrink-0 justify-between bg-[#313338]">
                    <div class="flex items-center text-gray-100 font-bold text-[15px] truncate">
                        <template x-if="activeView === 'server'">
                            <i class="ph ph-hash mr-2 text-gray-400 text-xl"></i>
                        </template>
                        <template x-if="activeView === 'home' && activeTarget">
                            <i class="ph ph-at mr-2 text-gray-400 text-xl"></i>
                        </template>
                        <span x-text="viewingVoice ? getChannelName(inVoiceRoom) : (getChannelName(activeChannelId) || getChannelName(activeTarget) || 'Friends')"></span>
                    </div>
                    <div class="flex items-center gap-3">

                        <template x-if="activeView === 'home' && activeTarget">
                            <button @click="handleVoiceChannelClick(activeTarget)" class="p-1 text-gray-400 hover:text-gray-200 rounded-md transition" :class="inVoiceRoom === activeTarget ? 'text-[#23A559]' : ''"><i class="ph-fill ph-phone-call text-xl"></i></button>
                        </template>
                        <button @click="showMembersList = !showMembersList" class="p-1 text-gray-400 hover:text-gray-200 rounded-md transition"><i class="ph-fill ph-users text-xl"></i></button>
                    </div>
                </div>

                <div class="flex-1 flex overflow-hidden">
                    <div class="flex-1 flex flex-col relative min-w-0">
                        <!-- Video Grid -->
                        <div x-show="viewingVoice && inVoiceRoom" class="flex-1 bg-black relative overflow-hidden">
                            <div id="fullscreen-video-grid">
                                <div class="video-wrapper group" :class="fullscreenVideoId === 'local' ? 'video-fullscreen-mode' : ''" @click="toggleFullscreenVideo('local')">
                                    <video id="local-video" autoplay playsinline muted :class="rtcVideoOff ? 'opacity-0' : 'opacity-100'"></video>
                                    <div x-show="rtcVideoOff" class="absolute inset-0 flex items-center justify-center" :style="'background-color: ' + getAvatarColor(currentUserProfile?.avatar)">
                                        <img :src="currentUserProfile?.avatar" class="w-32 h-32 rounded-full object-cover">
                                    </div>
                                    <div class="absolute bottom-3 left-3 bg-black/60 px-2.5 py-1.5 rounded text-[13px] text-white font-bold backdrop-blur-sm z-10">
                                        <span x-text="currentUserProfile?.displayName + ' (You)'"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Chat -->
                        <div x-show="!viewingVoice && activeView !== 'discovery'" class="flex-1 overflow-y-auto flex flex-col p-4" id="chatContainer">
                            <template x-for="group in groupedMessages" :key="group.id">
                                <div class="message-group">
                                    <img :src="getUser(group.senderId)?.avatar" @click="openProfilePopout(group.senderId)" class="w-10 h-10 rounded-full object-cover mr-4 cursor-pointer">
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-baseline mb-1">
                                            <span class="font-medium text-gray-100 mr-2 hover:underline cursor-pointer" @click="openProfilePopout(group.senderId)" x-text="getUser(group.senderId)?.displayName"></span>
                                            <span class="text-[11px] text-gray-400" x-text="formatTime(group.timestamp)"></span>
                                        </div>
                                        <div class="space-y-0.5">
                                            <template x-for="msg in group.messages" :key="msg.id">
                                                <div class="message-item group/msg" :class="isMentioned(msg.text) ? 'bg-[#5865F2]/10 border-l-2 border-[#5865F2]' : ''">
                                                    <div class="flex-1 text-gray-300 break-words leading-snug text-[15px]">
                                                        <span x-html="formatMessage(msg.text)"></span>
                                                        <span x-show="msg.edited" class="text-[10px] text-gray-500 ml-1">(edited)</span>
                                                    </div>
                                                    <template x-if="msg.image">
                                                        <img :src="msg.image" class="mt-2 max-w-md w-full rounded-md cursor-pointer block" @click="openImage(msg.image)">
                                                    </template>
                                                    <div x-show="msg.senderId === logicalUid" class="absolute right-2 -top-3 bg-[#313338] border border-[#1e1f22] rounded shadow-md hidden group-hover/msg:flex">
                                                        <button @click="deleteMessage(msg.id)" class="p-1.5 text-red-400 hover:bg-red-500 hover:text-white transition"><i class="ph ph-trash"></i></button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Chat Input -->
                        <div class="p-4 pt-0 flex-shrink-0 bg-[#313338] relative" x-show="currentChatId && !viewingVoice && activeView !== 'discovery'">
                            <div x-show="showMentions" class="absolute bottom-full left-4 mb-2 bg-[#2b2d31] border border-[#1e1f22] rounded-md shadow-2xl w-64 max-h-48 overflow-y-auto z-50 py-1">
                                <template x-for="(user, index) in filteredMentionUsers" :key="user.uid">
                                    <button @click="insertMention(user.username)" class="w-full flex items-center px-3 py-1.5 hover:bg-[#3f4147] transition group text-left" :class="mentionIndex === index ? 'bg-[#3f4147]' : ''">
                                        <img :src="user.avatar" class="w-6 h-6 rounded-full mr-2 object-cover">
                                        <span class="text-sm font-medium text-gray-200 group-hover:text-white truncate" x-text="user.displayName"></span>
                                        <span class="text-xs text-gray-500 ml-2 truncate" x-text="'@' + user.username"></span>
                                    </button>
                                </template>
                            </div>
                            <div class="bg-[#383a40] rounded-lg flex items-center px-4 py-2.5 transition">
                                <button @click="triggerImageUpload('chat')" class="text-gray-400 hover:text-gray-200 p-1 mr-2 bg-[#2b2d31] rounded-full h-7 w-7 flex items-center justify-center hover:bg-[#5865F2] hover:text-white">
                                    <i class="ph-fill ph-plus font-bold"></i>
                                </button>
                                <input type="text" x-model="newMessage" x-ref="chatInput" @input="checkMentions()" @keydown="handleMentionKey($event)" @keydown.enter="sendMessage()" :placeholder="getChatPlaceholder()" class="flex-1 bg-transparent px-1 focus:outline-none text-gray-100 placeholder-gray-500 text-[15px]">
                                <button @click="sendMessage()" :disabled="!newMessage.trim() && !pendingImage" class="p-1.5 rounded-md text-gray-400 hover:text-[#5865F2] disabled:opacity-50 ml-2">
                                    <i class="ph-fill ph-paper-plane-right text-xl"></i>
                                </button>
                            </div>
                            <template x-if="pendingImage">
                                <div class="mt-3 relative inline-block bg-[#2b2d31] p-2 rounded-md border border-[#1e1f22] shadow-lg">
                                    <img :src="pendingImage" class="h-32 rounded object-cover">
                                    <button @click="pendingImage = null" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1"><i class="ph ph-x text-xs"></i></button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Right Sidebar -->
                    <div class="bg-[#2b2d31] flex flex-col flex-shrink-0 transition-all duration-300 overflow-hidden" :class="showMembersList && !viewingVoice ? 'w-60' : 'w-0'">
                        <div class="p-4 w-60 overflow-y-auto">
                            <template x-if="activeView === 'server'">
                                <div>
                                    <div class="text-[11px] font-bold text-gray-400 uppercase mb-3">Online — <span x-text="getServerMembers('online').length"></span></div>
                                    <template x-for="p in getServerMembers('online')" :key="p.uid">
                                        <div @click="openProfilePopout(p.uid)" class="flex items-center px-2 py-1.5 rounded-md hover:bg-[#35373c] cursor-pointer group">
                                            <div class="relative">
                                                <img :src="p.avatar" class="w-8 h-8 rounded-full object-cover">
                                                <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-[#23A559] border-2 border-[#2b2d31] rounded-full"></div>
                                            </div>
                                            <div class="ml-3 truncate flex-1 flex justify-between items-center">
                                                <div class="text-[15px] font-medium text-gray-300 group-hover:text-gray-100 truncate" x-text="p.displayName"></div>
                                                <i x-show="getServer()?.owner === p.uid" class="ph-fill ph-crown text-[#F1C40F] ml-1"></i>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Profile Popout -->
    <div x-show="showProfilePopout" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm">
        <div class="bg-[#232428] rounded-xl shadow-2xl w-full max-w-sm overflow-hidden" @click.away="showProfilePopout = false">
            <div class="h-28 w-full relative" :style="'background-color: ' + (popoutUser?.bannerColor || '#5865F2')">
                <template x-if="popoutUser?.banner"><img :src="popoutUser?.banner" class="absolute inset-0 w-full h-full object-cover"></template>
            </div>
            <div class="px-5 pb-6 relative">
                <div class="absolute -top-12 left-5 bg-[#232428] rounded-full p-1.5 z-10">
                    <img :src="popoutUser?.avatar" class="w-20 h-20 rounded-full object-cover shadow-sm bg-[#1e1f22]">
                </div>
                <div class="flex justify-end pt-3 mb-4 h-12 gap-2">
                    <template x-if="popoutUser?.uid !== logicalUid">
                        <button @click="initiateDM(popoutUser?.uid)" class="w-9 h-9 rounded-full bg-[#313338] hover:bg-[#5865F2] text-gray-200 hover:text-white flex items-center justify-center transition"><i class="ph-fill ph-chat-circle-dots"></i></button>
                    </template>
                </div>
                <div>
                    <h3 class="text-2xl font-extrabold text-gray-100 truncate" x-text="popoutUser?.displayName"></h3>
                    <p class="text-sm text-gray-400 font-medium mb-4" x-text="'@' + popoutUser?.username"></p>
                    <div class="w-full h-[1px] bg-[#313338] mb-4"></div>
                    <h4 class="text-[11px] font-bold text-gray-400 uppercase mb-2">About Me</h4>
                    <p class="text-sm text-gray-300" x-text="popoutUser?.bio || 'No bio.'"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- User Settings -->
    <div x-show="showSettingsModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-[#313338] rounded-xl shadow-2xl w-full max-w-lg overflow-hidden" @click.away="showSettingsModal = false">
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-100 mb-6">Settings</h2>
                <div class="space-y-4">
                    <div @click="triggerImageUpload('banner')" class="h-32 rounded-lg bg-[#5865F2] cursor-pointer overflow-hidden relative group">
                        <template x-if="editProfile.banner"><img :src="editProfile.banner" class="w-full h-full object-cover"></template>
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition"><i class="ph ph-camera text-3xl"></i></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div @click="triggerImageUpload('edit')" class="w-20 h-20 rounded-full bg-[#1e1f22] cursor-pointer overflow-hidden relative group">
                            <img :src="editProfile.avatar" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition"><i class="ph ph-camera text-xl"></i></div>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Display Name</label>
                            <input type="text" x-model="editProfile.displayName" class="w-full bg-[#1e1f22] px-3 py-2 rounded text-gray-100 text-sm focus:outline-none focus:ring-1 focus:ring-[#5865F2]">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Bio</label>
                        <textarea x-model="editProfile.bio" rows="3" class="w-full bg-[#1e1f22] px-3 py-2 rounded text-gray-100 text-sm resize-none focus:outline-none focus:ring-1 focus:ring-[#5865F2]"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-between border-t border-[#2b2d31] pt-4">
                    <button @click="logout()" class="text-red-500 font-bold hover:underline">Log Out</button>
                    <div class="flex gap-2">
                        <button @click="showSettingsModal = false" class="px-4 py-2 text-gray-400 hover:text-white">Cancel</button>
                        <button @click="saveProfileSettings()" class="px-4 py-2 bg-[#5865F2] text-white font-bold rounded hover:bg-[#4752C4]">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Server Modal -->
    <div x-show="showCreateServerModal" style="display: none;" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-[#313338] rounded-xl shadow-2xl w-full max-w-md overflow-hidden text-center" @click.away="showCreateServerModal = false">
            <div class="p-8">
                <h2 class="text-2xl font-bold text-gray-100 mb-2">Create your server</h2>
                <div class="flex justify-center mb-6">
                    <div class="relative group cursor-pointer w-24 h-24" @click="triggerImageUpload('server')">
                        <img x-show="newServerIcon" :src="newServerIcon" class="w-full h-full rounded-2xl object-cover border-2 border-dashed border-[#5865F2]">
                        <div x-show="!newServerIcon" class="w-full h-full rounded-2xl border-2 border-dashed border-gray-500 flex flex-col items-center justify-center text-gray-400 hover:border-[#5865F2] hover:text-[#5865F2] transition bg-[#1e1f22]">
                            <i class="ph-fill ph-camera text-2xl mb-1"></i>
                            <span class="text-[10px] font-bold uppercase">Upload</span>
                        </div>
                    </div>
                </div>
                <div class="text-left">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Server Name</label>
                    <input type="text" x-model="newServerName" @keydown.enter="createServer()" class="w-full px-3 py-2 bg-[#1e1f22] rounded-md text-gray-100 focus:outline-none focus:ring-1 focus:ring-[#5865F2] text-sm">
                </div>
            </div>
            <div class="bg-[#2b2d31] p-4 flex justify-between items-center">
                <button @click="showCreateServerModal = false" class="text-sm font-medium text-gray-300 hover:text-white transition">Back</button>
                <button @click="createServer()" :disabled="!newServerName.trim()" class="px-6 py-2 text-sm font-bold text-white bg-[#5865F2] hover:bg-[#4752C4] rounded-md shadow transition">Create</button>
            </div>
        </div>
    </div>

    <!-- Server Settings Modal -->
    <div x-show="showServerSettingsModal" style="display: none;" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-[#313338] rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex h-[500px]" @click.away="showServerSettingsModal = false">
            <div class="w-48 bg-[#2b2d31] p-4 flex flex-col gap-1 border-r border-[#1e1f22]">
                <h3 class="text-xs font-bold text-gray-400 uppercase px-2 mb-2 truncate" x-text="editServer.name"></h3>
                <button @click="serverSettingsTab = 'overview'" class="text-left px-2 py-1.5 rounded-md text-sm font-medium transition" :class="serverSettingsTab === 'overview' ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">Overview</button>
                <button @click="serverSettingsTab = 'channels'" class="text-left px-2 py-1.5 rounded-md text-sm font-medium transition" :class="serverSettingsTab === 'channels' ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">Channels</button>
            </div>
            <div class="flex-1 p-6 overflow-y-auto relative">
                <div x-show="serverSettingsTab === 'overview'">
                    <h2 class="text-xl font-bold text-gray-100 mb-6">Server Overview</h2>
                    <div class="space-y-6">
                        <div @click="triggerImageUpload('serverBannerEdit')" class="h-32 rounded-lg bg-[#5865F2] cursor-pointer overflow-hidden relative group">
                            <template x-if="editServer.banner"><img :src="editServer.banner" class="w-full h-full object-cover"></template>
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition"><i class="ph ph-camera text-3xl"></i></div>
                        </div>
                        <div class="flex gap-6">
                            <div @click="triggerImageUpload('serverEdit')" class="w-24 h-24 rounded-2xl bg-[#1e1f22] cursor-pointer overflow-hidden relative group border-2 border-dashed border-gray-600">
                                <template x-if="editServer.icon"><img :src="editServer.icon" class="w-full h-full object-cover"></template>
                                <div x-show="!editServer.icon" class="absolute inset-0 flex items-center justify-center text-gray-400"><i class="ph ph-camera text-2xl"></i></div>
                            </div>
                            <div class="flex-1 space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Server Name</label>
                                    <input type="text" x-model="editServer.name" class="w-full bg-[#1e1f22] px-3 py-2 rounded text-gray-100 text-sm focus:outline-none focus:ring-1 focus:ring-[#5865F2]">
                                </div>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" x-model="editServer.isPublic" class="w-4 h-4 accent-[#5865F2]">
                                    <span class="text-sm text-gray-200">Public Server (Discovery)</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Server Bio</label>
                            <textarea x-model="editServer.bio" rows="3" class="w-full bg-[#1e1f22] px-3 py-2 rounded text-gray-100 text-sm resize-none focus:outline-none focus:ring-1 focus:ring-[#5865F2]"></textarea>
                        </div>
                    </div>
                    <div class="mt-6 pt-4 border-t border-[#2b2d31] flex justify-end">
                        <button @click="saveServerSettings()" class="px-4 py-2 bg-[#23A559] text-white font-bold rounded hover:bg-[#1f8c4b]">Save Changes</button>
                    </div>
                </div>
                <div x-show="serverSettingsTab === 'channels'">
                    <h2 class="text-xl font-bold text-gray-100 mb-6">Channels</h2>
                    <div class="space-y-4">
                        <div class="flex gap-2 bg-[#1e1f22] p-3 rounded">
                            <input type="text" x-model="newChannelName" placeholder="New channel name" class="flex-1 bg-[#2b2d31] px-3 py-2 rounded text-sm text-gray-100 focus:outline-none">
                            <select x-model="newChannelType" class="bg-[#2b2d31] px-2 py-2 rounded text-sm text-gray-100">
                                <option value="text">Text</option>
                                <option value="voice">Voice</option>
                            </select>
                            <button @click="addChannel()" class="bg-[#5865F2] px-4 py-2 rounded text-white font-bold text-sm">Add</button>
                        </div>
                        <div class="space-y-2">
                            <template x-for="ch in editServer.channels" :key="ch.id">
                                <div class="flex items-center justify-between bg-[#2b2d31] p-3 rounded border border-[#1e1f22]">
                                    <div class="flex items-center text-gray-200">
                                        <i class="mr-2 text-lg text-gray-400" :class="ch.type === 'text' ? 'ph ph-hash' : 'ph ph-speaker-high'"></i>
                                        <span x-text="ch.name"></span>
                                    </div>
                                    <button @click="removeChannel(ch.id)" class="text-red-400 hover:text-red-500"><i class="ph ph-trash"></i></button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
            <button @click="showServerSettingsModal = false" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="ph ph-x text-2xl"></i></button>
        </div>
    </div>


    <!-- Hidden Copy Textarea -->
    <textarea id="hiddenCopyTextarea" style="position: absolute; left: -9999px;"></textarea>
</body>
</html>
