            getVoiceUsers(channelId) { return this.activePresence.filter(p => p.currentVoice === channelId); },

            openHome() {
                this.activeView = 'home'; this.activeTarget = null; this.activeChannelId = null;
                if (this.inVoiceRoom && !this.inVoiceRoom.includes('_')) { this.viewingVoice = false; }
                this.updatePresence();
            },
            openDiscovery() {
                this.activeView = 'discovery'; this.activeTarget = null; this.activeChannelId = null;
                this.viewingVoice = false; this.updatePresence();
            },
            selectChannel(channelId) {
                const lastRead = this.currentUserProfile?.lastRead?.[channelId] || 0;
                this.activeRoomReadMarker = { roomId: channelId, timestamp: lastRead };
                
                this.activeChannelId = channelId;
                this.viewingVoice = false;
                this.markRead(channelId);
                
                if (!this.currentUserProfile.lastChannel) this.currentUserProfile.lastChannel = {};
                this.currentUserProfile.lastChannel[this.activeTarget] = channelId;
                this.apiUpdate('users', this.logicalUid, { lastChannel: this.currentUserProfile.lastChannel });
            },
            openServer(id) {
                this.activeView = 'server'; this.activeTarget = id;
                const s = this.servers.find(server => server.id === id);
                
                let targetCid = this.currentUserProfile?.lastChannel?.[id];
                if (!targetCid || !s?.channels?.some(c => c.id === targetCid)) {
                    const texts = s?.channels?.filter(c => c.type === 'text') || [];
                    targetCid = texts.length > 0 ? texts[0].id : null;
                }
                
                if (targetCid && this.activeChannelId !== targetCid) {
                    const lastRead = this.currentUserProfile?.lastRead?.[targetCid] || 0;
                    this.activeRoomReadMarker = { roomId: targetCid, timestamp: lastRead };
                    this.activeChannelId = targetCid;
                    this.markRead(targetCid);
                } else if (!targetCid) {
                    this.activeChannelId = null;
                }
                
                const voiceChannels = s?.channels?.filter(c => c.type === 'voice').map(c=>c.id) || [];
                if(!voiceChannels.includes(this.inVoiceRoom)) this.viewingVoice = false;
                this.updatePresence();
            },

            getDmPartner(dmId) { 
                const dm = this.dms.find(d => d.id === dmId); 
                if (dm) return dm.partnerUid;
                if (dmId && dmId.startsWith('user_')) {
                    const parts = dmId.split('_user_');
                    if (parts.length === 2) {
                        const u1 = parts[0];
                        const u2 = 'user_' + parts[1];
                        return u1 === this.logicalUid ? u2 : u1;
                    }
                }
                return null; 
            },
            openDM(id) {
                const lastRead = this.currentUserProfile?.lastRead?.[id] || 0;
                this.activeRoomReadMarker = { roomId: id, timestamp: lastRead };
                
                this.activeView = 'home'; this.activeTarget = id; this.activeChannelId = null;
                this.viewingVoice = (this.inVoiceRoom === id);
                this.markRead(id);
            },
            async initiateDM(targetUid) {
                if (targetUid === this.logicalUid) return;
                const sorted = [this.logicalUid, targetUid].sort();
                const dmId = sorted.join('_');
                
                const existingDm = this.dms.find(d => d.id === dmId);
                if (!existingDm) { 
                    this.dms.push({ id: dmId, partnerUid: targetUid });
                    await this.apiSet('dms', dmId, { participants: sorted }); 
                }
                this.showProfilePopout = false;
                this.openDM(dmId);
            },
            
            isFriend(uid) { return this.currentUserProfile?.friends?.includes(uid) && this.getUser(uid)?.friends?.includes(this.logicalUid); },
            isPendingOutgoing(uid) { return this.currentUserProfile?.friends?.includes(uid) && !this.getUser(uid)?.friends?.includes(this.logicalUid); },
            isPendingIncoming(uid) { return !this.currentUserProfile?.friends?.includes(uid) && this.getUser(uid)?.friends?.includes(this.logicalUid); },
            
            async addFriend(uid) {
                if(uid === this.logicalUid || this.isFriend(uid)) return;
                const newFriends = [...(this.currentUserProfile.friends || []), uid];
                await this.apiUpdate('users', this.logicalUid, { friends: newFriends });
                this.showToast(this.isPendingIncoming(uid) ? "Friend request accepted!" : "Friend request sent!");
            },
            async removeFriend(uid) {
                const newFriends = (this.currentUserProfile.friends || []).filter(id => id !== uid);
                await this.apiUpdate('users', this.logicalUid, { friends: newFriends });
            },
            
            sendDirectFriendRequest() {
                const targetUname = this.directFriendRequestUsername.replace('@', '').toLowerCase();
                const targetUser = Object.values(this.users).find(u => u.username === targetUname);
                if (targetUser) {
                    this.addFriend(targetUser.uid);
                    this.directFriendRequestUsername = '';
                } else {
                    this.showToast("User not found.", true);
                }
            },

            openProfilePopout(uid) {
                this.popoutUser = this.getUser(uid);
                this.profileTab = 'info';
                if(this.popoutUser) this.showProfilePopout = true;
            },

            getChatPlaceholder() {
                if (this.activeView === 'home' && this.activeTarget) return `Message @${this.getUser(this.getDmPartner(this.activeTarget))?.username || 'User'}`;
                return `Message #${this.getChannelName(this.activeChannelId) || 'channel'}`;
            },

            startEditMessage(msg) {

                this.newMessage = msg.text;
                this.$refs.chatInput.focus();
            },
            cancelEditMessage() {
                this.editingMessageId = null;

            },
            async deleteMessage(msgId) { await this.apiDelete('messages', msgId); },

            async sendMessage() {
                if (!this.currentChatId || (!this.newMessage.trim() && !this.pendingImage)) return;
                
                if (this.editingMessageId) {
                    await this.apiUpdate('messages', this.editingMessageId, { text: this.newMessage.trim(), edited: true });
                    this.cancelEditMessage();
                } else {
                    const payload = { roomId: this.currentChatId, senderId: this.logicalUid, text: this.newMessage.trim(), image: this.pendingImage, timestamp: Date.now() };
                    this.newMessage = ''; this.pendingImage = null; this.showMentions = false;
                    await this.apiAdd('messages', payload);
                    this.markRead(this.currentChatId); 
                }
            },

            async createServer() {
                if(!this.newServerName.trim()) return;
                const payload = {
                    name: this.newServerName.trim(), icon: this.newServerIcon, owner: this.logicalUid, isPublic: false, bio: '',
                    banner: null, bannerColor: '#5865F2',

            async joinServer(serverId) {

            async leaveServer() {

            async deleteServer() {

                    await this.apiDelete('servers', this.activeTarget);

            openSettings() {
                if (!this.currentUserProfile) return;

            },

            openServerSettingsModal(tab = 'overview') {

                this.editServer = JSON.parse(JSON.stringify(s)); 
                if(!this.editServer.channels) this.editServer.channels = [];

            },

            async saveServerSettings() {

            async addChannel() {

            async saveProfileSettings() {
                await this.apiUpdate('users', this.logicalUid, { displayName: this.editProfile.displayName, bio: this.editProfile.bio, avatar: this.editProfile.avatar, banner: this.editProfile.banner });

            },

            triggerImageUpload(context) {
                const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
                input.onchange = (e) => this.processImage(e.target.files[0], context); input.click();
            },
            processImage(file, context) {
                if (!file) return; const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let MAX_W = 256; let MAX_H = 256;
                        
                        if (context === 'chat') { MAX_W = 800; MAX_H = 800; }
                        else if (context === 'banner' || context === 'serverBannerEdit') { MAX_W = 600; MAX_H = 300; }

                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; } } else { if (h > MAX_H) { w *= MAX_H / h; h = MAX_H; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        
                        if (context === 'chat') this.pendingImage = dataUrl;
                        else if (context === 'setup') this.authAvatar = dataUrl;
                        else if (context === 'edit') this.editProfile.avatar = dataUrl;
                        else if (context === 'banner') this.editProfile.banner = dataUrl;
                        else if (context === 'server') this.newServerIcon = dataUrl;
                        else if (context === 'serverEdit') this.editServer.icon = dataUrl;
                        else if (context === 'serverBannerEdit') this.editServer.banner = dataUrl;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            formatTime(ts) { return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); },

            handleVoiceChannelClick(channelId) {
                if (!channelId) return;
                if (this.inVoiceRoom === channelId) {
                    this.viewingVoice = true; 
                } else {
                    this.joinVoiceRoom(channelId);
                }
            },

            toggleFullscreenVideo(id) {
                if (this.fullscreenVideoId === id) {
                    this.fullscreenVideoId = null;
                } else {
                    this.fullscreenVideoId = id;
                }
            },

            async joinVoiceRoom(channelId) {
                if (this.inVoiceRoom) this.leaveVoiceRoom();
                try {
                    // Highly Optimized bandwidth request for aggressive NAT/School Firewalls
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: false, 
                        audio: { echoCancellation: true, noiseSuppression: true } 
                    });
                    const micTrack = stream.getAudioTracks()[0];
                    micTrack.enabled = !this.isMuted;
                    
                    const canvas = document.createElement('canvas'); 
                    canvas.width = 640; canvas.height = 360;
                    const ctx = canvas.getContext('2d'); 
                    ctx.fillStyle = '#000000'; ctx.fillRect(0,0,640,360); 
                    // Lower frame rate drastically reduces bandwidth overhead during network jitter
                    const dummyStream = canvas.captureStream(15);
                    const dummyVideo = dummyStream.getVideoTracks()[0];
                    
                    if (this.dummyCanvasInterval) clearInterval(this.dummyCanvasInterval);
                    this.dummyCanvasInterval = setInterval(() => {
                        if(ctx) { ctx.fillStyle = ctx.fillStyle === '#000000' ? '#000001' : '#000000'; ctx.fillRect(0,0,640,360); }
                    }, 100);
                    
                    this.localStream = new MediaStream([dummyVideo, micTrack]);
                    
                    this.inVoiceRoom = channelId; this.rtcVideoOff = true; this.isScreenSharing = false; this.viewingVoice = true; 
                    
                    this.updatePresence();
                    this.updateVideoCount();

                    setTimeout(() => {
                        const localVid = document.getElementById('local-video');
                        if (localVid) {
                            localVid.srcObject = this.localStream;
                            localVid.style.opacity = '0';
                        }
                    }, 500);
                    
                } catch(e) { this.showToast("Mic access denied or failed.", true); }
            },

            leaveVoiceRoom() {
                if (this.localStream) this.localStream.getTracks().forEach(t => t.stop());
                if (this.screenStream) this.stopScreenShare();
                if (this.dummyCanvasInterval) { clearInterval(this.dummyCanvasInterval); this.dummyCanvasInterval = null; }
                
                Object.values(this.simplePeers).forEach(p => p.destroy());
                this.simplePeers = {}; this.voicePeers = {}; 
                
                const grid = document.getElementById('fullscreen-video-grid');
                if(grid) {
                    Array.from(grid.children).forEach(child => {
                        if(child.className.includes('video-wrapper') && !child.innerHTML.includes('local-video')) child.remove();
                    });
                }
                
                this.inVoiceRoom = null; this.localStream = null; this.viewingVoice = false; this.fullscreenVideoId = null;
                this.updateVideoCount();
                
                this.apiUpdate('presence', this.logicalUid, { status: 'online', currentVoice: null, isScreenSharing: false, isCameraOff: true, lastActive: Date.now() });
            },

            toggleMute() {
                this.isMuted = !this.isMuted;
                if(this.localStream) {
                    this.localStream.getAudioTracks().forEach(t => t.enabled = !this.isMuted);
                }
                this.updatePresence();
            },
            
            toggleDeafen() {
                this.isDeafened = !this.isDeafened;
                if (this.isDeafened && !this.isMuted) this.toggleMute();
                document.querySelectorAll('.remote-vid').forEach(v => { v.muted = this.isDeafened; });
            },

            async rtcToggleVideo() {
                if (!this.localStream) return;
                
                if (this.rtcVideoOff) {
                    try {
                        // Highly Optimized bandwidth request for aggressive NAT/School Firewalls
                        const vidStream = await navigator.mediaDevices.getUserMedia({ 
                            video: { aspectRatio: 16/9, width: { ideal: 640, max: 1280 }, height: { ideal: 360, max: 720 }, frameRate: { ideal: 15, max: 24 } } 
                        });
                        const vidTrack = vidStream.getVideoTracks()[0];
                        const oldTrack = this.localStream.getVideoTracks()[0];
                        
                        this.localStream.removeTrack(oldTrack);
                        this.localStream.addTrack(vidTrack);
                        
                        Object.values(this.simplePeers).forEach(p => {
                            try { p.replaceTrack(oldTrack, vidTrack, this.localStream); } catch(e){}
                        });
                        
                        this.rtcVideoOff = false; this.viewingVoice = true; 
                        this.updatePresence();

                        const localVid = document.getElementById('local-video');
                        if (localVid) { 
                            localVid.srcObject = null; localVid.srcObject = this.localStream; 
                            localVid.style.opacity = '1';
                        }
                    } catch(e) { this.showToast("Camera access denied.", true); }
                } else {
                    const vidTrack = this.localStream.getVideoTracks()[0];
                    if (vidTrack) {
                        vidTrack.stop();
                        
                        const canvas = document.createElement('canvas'); 
                        canvas.width = 640; canvas.height = 360;
                        const ctx = canvas.getContext('2d'); 
                        ctx.fillStyle = '#000000'; ctx.fillRect(0,0,640,360);
                        const dummyStream = canvas.captureStream(15);
                        const dummyVideo = dummyStream.getVideoTracks()[0];
                        
                        if (this.dummyCanvasInterval) clearInterval(this.dummyCanvasInterval);
                        this.dummyCanvasInterval = setInterval(() => {
                            if(ctx) { ctx.fillStyle = ctx.fillStyle === '#000000' ? '#000001' : '#000000'; ctx.fillRect(0,0,640,360); }
                        }, 100);
                        
                        this.localStream.removeTrack(vidTrack);
                        this.localStream.addTrack(dummyVideo);
                        
                        Object.values(this.simplePeers).forEach(p => {
                            try { p.replaceTrack(vidTrack, dummyVideo, this.localStream); } catch(e){}
                        });
                        
                        this.rtcVideoOff = true;
                        this.updatePresence();

                        const localVid = document.getElementById('local-video');
                        if (localVid) { 
                            localVid.srcObject = null; localVid.srcObject = this.localStream; 
                            localVid.style.opacity = '0';
                        }
                    }
                }
            },

            async rtcToggleScreenShare() {
                if (!this.localStream) return;
                if (!this.isScreenSharing) {
                    try {
                        this.screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                        
                        Object.values(this.simplePeers).forEach(p => { try { p.addStream(this.screenStream); } catch(e){} });
                        this.isScreenSharing = true; this.viewingVoice = true;
                        this.updatePresence();

                        const grid = document.getElementById('fullscreen-video-grid');
                        const screenId = `local_screen`;
                        
                        let wrapper = document.createElement('div');
                        wrapper.id = `vid_wrap_${screenId}`; 
                        wrapper.className = "video-wrapper group";
                        wrapper.setAttribute('x-bind:class', `fullscreenVideoId === '${screenId}' ? 'video-fullscreen-mode' : ''`);
                        wrapper.onclick = () => this.toggleFullscreenVideo(screenId);
                        
                        const v = document.createElement('video');
                        v.autoplay = true; v.playsInline = true; v.muted = true;
                        v.srcObject = this.screenStream;
                        v.className = "w-full h-full bg-black object-contain";
                        
                        const overlay = document.createElement('div');
                        overlay.className = "absolute bottom-3 left-3 bg-black/60 px-2.5 py-1.5 rounded text-[13px] text-white font-bold backdrop-blur-sm flex items-center gap-2 z-10";
                        overlay.innerHTML = `<i class="ph-fill ph-screencast text-[#5865F2]"></i> <span>${this.currentUserProfile.displayName} (Screen)</span>`;
                        
                        wrapper.appendChild(v); wrapper.appendChild(overlay); grid.appendChild(wrapper);

                        this.screenStream.getVideoTracks()[0].onended = () => { this.stopScreenShare(); };
                        this.updateVideoCount();
                    } catch(e) { this.showToast("Screen share cancelled.", true); }
                } else {
                    this.stopScreenShare();
                }
            },
            
            stopScreenShare() {
                if (this.screenStream) {
                    this.screenStream.getTracks().forEach(t => t.stop());
                    Object.values(this.simplePeers).forEach(p => { try { p.removeStream(this.screenStream); } catch(e){} });
                    this.screenStream = null;
                }
                this.isScreenSharing = false;
                if(this.fullscreenVideoId === 'local_screen') this.fullscreenVideoId = null;
                this.updatePresence();
                const w = document.getElementById('vid_wrap_local_screen'); if(w) w.remove();
                this.updateVideoCount();
            },

            createPeer(targetUid, initiator) {
                // Brutally purge any ghost DOM elements before creating a new peer to fix "Fake Screenshare" overlaps
                document.querySelectorAll('.video-wrapper').forEach(w => {
                    if (w.id.startsWith(`vid_wrap_${targetUid}_`)) w.remove();
                });
                
                const peer = new SimplePeer({
                    initiator: initiator, 
                    trickle: true, 
                    stream: this.localStream,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'turn:openrelay.metered.ca:80?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
                            { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
                        ]
                    }
                });
                
                if(this.isScreenSharing && this.screenStream) {
                    try { peer.addStream(this.screenStream); } catch(e){}
                }

                peer.on('signal', data => {
                    this.apiAdd('signaling', {
                        to: targetUid, from: this.logicalUid, room: this.inVoiceRoom, signal: JSON.stringify(data)
                    });
                });
                
                peer.on('error', err => { 
                    this.removePeer(targetUid, false); 
                    setTimeout(() => this.checkPresenceSideEffects(), 2500);
                });
                peer.on('close', () => { 
                    this.removePeer(targetUid, false); 
                    setTimeout(() => this.checkPresenceSideEffects(), 2500); 
                });

                peer.on('stream', stream => {
                    this.voicePeers[targetUid] = true;
                    setTimeout(() => {
                        const grid = document.getElementById('fullscreen-video-grid'); if(!grid) return;
                        
                        // Mathematically certain way to tell if it's a screenshare instead of relying on DOM presence
                        let isScreen = false;
                        if (peer._remoteStreams && peer._remoteStreams.length > 1 && stream === peer._remoteStreams[1]) {
                            isScreen = true;
                        }
                        
                        const vId = isScreen ? `${targetUid}_screenshare` : `${targetUid}_cam`;
                        const wrapperId = `vid_wrap_${vId}`;
                        let wrapper = document.getElementById(wrapperId);
                        
                        if (!wrapper) {
                            wrapper = document.createElement('div');
                            wrapper.id = wrapperId; 
                            wrapper.className = "video-wrapper group";
                            wrapper.setAttribute('x-bind:class', `fullscreenVideoId === '${vId}' ? 'video-fullscreen-mode' : ''`);
                            wrapper.onclick = () => this.toggleFullscreenVideo(vId);
                            
                            const v = document.createElement('video');
                            v.id = `vid_${vId}`; v.autoplay = true; v.playsInline = true; 
                            v.className = "remote-vid w-full h-full bg-black object-cover"; v.muted = this.isDeafened;
                            
                            v.onloadedmetadata = () => { v.play().catch(e=>console.warn("Autoplay blocked:", e)); };
                            
                            const overlay = document.createElement('div');
                            overlay.className = "absolute bottom-3 left-3 bg-black/60 px-2.5 py-1.5 rounded text-[13px] text-white font-bold backdrop-blur-sm z-10";
                            overlay.innerText = this.getUser(targetUid).displayName + (isScreen ? " (Screen)" : "");

                            if (!isScreen) {
                                const fallback = document.createElement('div');
                                fallback.id = `fallback_${targetUid}_cam`;
                                fallback.className = "absolute inset-0 flex items-center justify-center transition-opacity duration-300 z-0";
                                fallback.style.backgroundColor = this.getUser(targetUid).dominantColor || '#5865F2';
                                
                                const currentStatus = this.activePresence.find(p => p.uid === targetUid)?.isCameraOff;
                                fallback.style.opacity = currentStatus ? '1' : '0';
                                fallback.style.pointerEvents = currentStatus ? 'auto' : 'none';
                                
                                const img = document.createElement('img');
                                img.src = this.getUser(targetUid).avatar;
                                img.className = "w-32 h-32 rounded-full object-cover shadow-2xl bg-[#1e1f22]";
                                fallback.appendChild(img);

                                const reconnect = document.createElement('div');
                                reconnect.id = `reconnect_${targetUid}_cam`;
                                reconnect.className = "absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-20 transition-opacity duration-300 opacity-0 pointer-events-none";
                                reconnect.innerHTML = `<i class="ph ph-spinner-gap animate-spin text-3xl text-[#5865F2] mb-2"></i><span class="text-xs font-bold text-gray-300">Reconnecting...</span>`;

                                wrapper.appendChild(fallback);
                                wrapper.appendChild(reconnect);
                            }

                            wrapper.appendChild(v); 
                            wrapper.appendChild(overlay); 
                            grid.appendChild(wrapper);
                            this.updateVideoCount();
                        }
                        
                        const reconnectUI = document.getElementById(`reconnect_${targetUid}_cam`);
                        if(reconnectUI) reconnectUI.style.opacity = '0';
                        
                        const vElem = document.getElementById(`vid_${vId}`);
                        if (vElem) {
                            vElem.srcObject = null;
                            vElem.srcObject = stream;
                            vElem.play().catch(e=>{});
                        }
                    }, 200);
                });

                this.simplePeers[targetUid] = peer;
            },

            handleIncomingSignal(fromUid, signalStr) {
                if (!this.inVoiceRoom) return;
                let peer = this.simplePeers[fromUid];
                if (!peer) { this.createPeer(fromUid, false); peer = this.simplePeers[fromUid]; }
                peer.signal(JSON.parse(signalStr));
            },

            removePeer(uid, permanent = true) {
                if (this.simplePeers[uid]) { this.simplePeers[uid].destroy(); delete this.simplePeers[uid]; }
                if (permanent) {
                    document.querySelectorAll('.video-wrapper').forEach(w => {
                        const match = w.id.match(/^vid_wrap_(.+)_(cam|screenshare)$/);
                        if (match && match[1] === uid) {
                            if(this.fullscreenVideoId === `${uid}_${match[2]}`) this.fullscreenVideoId = null;
                            w.remove();
                        }
                    });
                    this.updateVideoCount();
                } else {
                    const reconnectUI = document.getElementById(`reconnect_${uid}_cam`);
                    if(reconnectUI) reconnectUI.style.opacity = '1';
                }
            }
        });

        Alpine.data('nexusApp', window.nexusApp);
        Alpine.start();
    </script>
</body>
</html>
