<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le BaroChat™</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CRITICAL POLYFILLS FOR SIMPLE-PEER IN BROWSER -->
    <script>
        window.global = window;
        window.process = { env: { DEBUG: undefined } };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #1e1f22; color: #dbdee1; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2b2d31; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #fullscreen-video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            width: 100%;
            height: 100%;
            align-content: center;
            justify-content: center;
        }
        #fullscreen-video-grid video {
            width: 100%;
            height: 100%;
            max-height: 40vh;
            border-radius: 0.5rem;
            background-color: #000;
            object-fit: cover;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.5);
            border: 1px solid #2b2d31;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex bg-[#1e1f22]" x-data="nexusApp()" x-cloak>

    <!-- Global Toast -->
    <div x-show="toast.show" x-transition.opacity class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] px-4 py-3 rounded-md shadow-2xl text-sm font-bold text-white transition-all flex items-center gap-3" :class="toast.isError ? 'bg-red-500' : 'bg-blue-600'" style="display: none;">
        <i class="ph-fill text-xl" :class="toast.isError ? 'ph-warning-circle' : 'ph-info'"></i>
        <span x-text="toast.message"></span>
    </div>

    <!-- Auth / Onboarding Screen -->
    <div x-show="!isReady" class="fixed inset-0 z-50 flex items-center justify-center bg-[#1e1f22] overflow-y-auto py-10" style="display: none;">
        
        <!-- Loading State -->
        <div x-show="authLoading" class="flex flex-col items-center text-gray-300">
            <i class="ph ph-spinner-gap animate-spin text-5xl mb-4 text-blue-500"></i>
            <h1 class="text-xl font-bold tracking-tight">Connecting to Le BaroChat™...</h1>
        </div>

        <!-- Auth Forms -->
        <div x-show="!authLoading" class="flex flex-col md:flex-row gap-8 items-center max-w-4xl w-full px-6">
            
            <div class="bg-[#313338] p-8 rounded-xl shadow-2xl w-full max-w-md border border-[#2b2d31]">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-100" x-text="authMode === 'login' ? 'Welcome Back!' : 'Create an Account'"></h2>
                    <p class="text-gray-400 mt-1 text-sm" x-text="authMode === 'login' ? 'We\'re so excited to see you again!' : 'Join Le BaroChat™ today.'"></p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Email</label>
                        <input type="email" x-model="authEmail" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-100 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Password</label>
                        <input type="password" x-model="authPassword" @keydown.enter="processAuth()" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-100 text-sm">
                    </div>

                    <template x-if="authMode === 'register'">
                        <div class="space-y-4 pt-2">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Display Name</label>
                                <input type="text" x-model="authDisplayName" maxlength="20" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-100 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Choose an Avatar</label>
                                <div class="grid grid-cols-4 gap-3 mb-3">
                                    <template x-for="(avatarObj, index) in defaultAvatars" :key="index">
                                        <button @click="authAvatar = avatarObj.data" class="aspect-square rounded-full overflow-hidden border-2 transition hover:opacity-80 bg-[#1e1f22]" :class="authAvatar === avatarObj.data ? 'border-blue-500 scale-105' : 'border-transparent'">
                                            <img :src="avatarObj.data" class="w-full h-full object-cover">
                                        </button>
                                    </template>
                                </div>
                                <button @click="triggerAvatarUpload('setup')" class="w-full py-2 text-sm text-blue-400 font-medium bg-[#2b2d31] hover:bg-[#1e1f22] rounded-md transition border border-transparent hover:border-[#383a40]">
                                    Or upload custom image...
                                </button>
                            </div>
                        </div>
                    </template>

                    <button @click="processAuth()" :disabled="!authEmail || !authPassword || (authMode === 'register' && !authDisplayName)" class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold rounded-md shadow transition mt-4">
                        <span x-text="authMode === 'login' ? 'Log In' : 'Register'"></span>
                    </button>

                    <div class="text-sm text-gray-400 mt-4">
                        <span x-text="authMode === 'login' ? 'Need an account?' : 'Already have an account?'"></span>
                        <button @click="authMode = authMode === 'login' ? 'register' : 'login'" class="text-blue-400 hover:underline ml-1 font-medium">
                            <span x-text="authMode === 'login' ? 'Register' : 'Log In'"></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Live Preview Card (Only on Register) -->
            <div class="w-full max-w-sm hidden md:block" x-show="authMode === 'register'">
                <div class="text-xs font-bold text-gray-500 uppercase mb-3 text-center">Live Preview</div>
                <div class="bg-[#313338] rounded-xl shadow-2xl w-full overflow-hidden border border-[#2b2d31]">
                    <div class="h-24 bg-blue-600 w-full"></div>
                    <div class="px-5 pb-6 relative">
                        <img :src="authAvatar" class="w-24 h-24 rounded-full border-[6px] border-[#313338] absolute -top-12 left-5 bg-[#1e1f22] object-cover transition-all duration-300">
                        <div class="pt-14">
                            <h3 class="text-2xl font-extrabold text-gray-100 leading-tight truncate" x-text="authDisplayName || 'Your Name'"></h3>
                            <p class="text-sm text-gray-400 font-medium mb-4" x-text="(authDisplayName || 'YourName') + '#1234'"></p>
                            <div class="bg-[#2b2d31] rounded-lg p-3 border border-[#1e1f22]">
                                <h4 class="text-xs font-bold text-gray-400 uppercase mb-1.5">About Me</h4>
                                <p class="text-sm text-gray-300">Ready to chat on Le BaroChat™!</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <template x-if="isReady && currentUserProfile">
        <div class="flex h-full w-full">
            
            <!-- Server List Sidebar (Far Left) -->
            <div class="w-[72px] h-full bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0 z-20">
                <button @click="openHome()" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-gray-100 flex items-center justify-center transition-all duration-200 relative group" :class="{'rounded-[16px] bg-blue-600 text-white': activeView === 'home'}">
                    <i class="ph-fill ph-house text-2xl"></i>
                    <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeView === 'home' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                </button>

                <div class="w-8 h-[2px] bg-[#313338] rounded-full my-1"></div>

                <!-- Server List -->
                <div class="flex-1 w-full overflow-y-auto no-scrollbar flex flex-col items-center space-y-2">
                    <template x-for="server in myServers" :key="server.id">
                        <button @click="openServer(server.id)" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-gray-100 hover:text-white flex items-center justify-center transition-all duration-200 shadow relative group overflow-hidden" :class="{'rounded-[16px] bg-blue-600 text-white': activeTarget === server.id && activeView !== 'home' && activeView !== 'discovery'}">
                            <template x-if="server.icon">
                                <img :src="server.icon" class="w-full h-full object-cover">
                            </template>
                            <template x-if="!server.icon">
                                <span x-text="server.name.substring(0,2).toUpperCase()" class="font-bold text-sm"></span>
                            </template>
                            <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeTarget === server.id && activeView !== 'home' && activeView !== 'discovery' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                        </button>
                    </template>

                    <!-- Add Server & Discovery -->
                    <button @click="showCreateServerModal = true; newServerName = ''" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] hover:bg-green-600 text-green-500 hover:text-white flex items-center justify-center transition-all duration-200 mt-2">
                        <i class="ph ph-plus text-xl"></i>
                    </button>
                    <button @click="activeView = 'discovery'; activeTarget = null;" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] hover:bg-blue-600 text-gray-300 hover:text-white flex items-center justify-center transition-all duration-200 mt-2 relative group" :class="{'rounded-[16px] bg-blue-600 text-white': activeView === 'discovery'}">
                        <i class="ph-fill ph-compass text-2xl"></i>
                        <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeView === 'discovery' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                    </button>
                </div>
            </div>

            <!-- Secondary Sidebar (Channels / DMs) -->
            <div class="w-60 h-full bg-[#2b2d31] flex flex-col flex-shrink-0 z-10 relative">
                
                <!-- Home Sidebar (DMs) -->
                <template x-if="activeView === 'home'">
                    <div class="flex flex-col h-full">
                        <div class="h-12 border-b border-[#1e1f22] flex items-center px-4 font-bold text-gray-100 shadow-sm bg-[#2b2d31]">Direct Messages</div>
                        <div class="flex-1 overflow-y-auto p-2 space-y-[2px]">
                            <button @click="showAddFriendModal = true" class="w-full flex items-center px-3 py-2 text-gray-400 hover:text-gray-100 hover:bg-[#3f4147] rounded-md transition mb-2">
                                <i class="ph ph-user-plus mr-3 text-lg"></i>
                                <span class="font-medium text-sm">Add Friend</span>
                            </button>
                            <div class="text-xs font-bold text-gray-500 uppercase tracking-wider px-3 py-2 mt-2">Conversations</div>
                            <template x-for="dm in dms" :key="dm.id">
                                <button @click="openDM(dm.id)" class="w-full flex items-center px-2 py-1.5 rounded-md transition group" :class="activeTarget === dm.id ? 'bg-[#3f4147] text-white' : 'hover:bg-[#35373c] text-gray-300'">
                                    <img :src="getUser(dm.partnerUid)?.avatar" class="w-8 h-8 rounded-full mr-3 object-cover shadow-sm bg-[#1e1f22]">
                                    <div class="flex-1 text-left truncate">
                                        <div class="font-medium text-sm truncate" x-text="getUser(dm.partnerUid)?.displayName || 'Unknown'"></div>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
                
                <!-- Server Sidebar (Channels) -->
                <template x-if="activeView === 'server'">
                    <div class="flex flex-col h-full">
                        <div class="h-12 border-b border-[#1e1f22] flex items-center px-4 font-bold text-gray-100 shadow-sm bg-[#2b2d31] justify-between cursor-pointer hover:bg-[#35373c] transition group relative">
                            <span class="truncate pr-2" x-text="getServer()?.name || 'Server'"></span>
                            <i class="ph ph-caret-down text-gray-400 group-hover:text-gray-200"></i>
                            
                            <div class="absolute top-12 left-2 right-2 bg-[#111214] rounded-md shadow-2xl border border-[#1e1f22] p-2 hidden group-hover:block z-50">
                                <button @click.stop="copyInviteLink()" class="w-full flex items-center px-2 py-1.5 text-blue-400 hover:bg-blue-600 hover:text-white rounded-md transition text-sm font-medium mb-1">
                                    <i class="ph ph-user-plus mr-2"></i> Copy Invite Link
                                </button>
                                <template x-if="getServer()?.owner === currentUser?.uid">
                                    <button @click.stop="openServerSettings()" class="w-full flex items-center px-2 py-1.5 text-gray-300 hover:bg-[#3f4147] hover:text-white rounded-md transition text-sm font-medium">
                                        <i class="ph ph-gear mr-2"></i> Server Settings
                                    </button>
                                </template>
                                <div class="h-px bg-[#2b2d31] my-1"></div>
                                <button @click.stop="leaveServer()" class="w-full flex items-center px-2 py-1.5 text-red-400 hover:bg-red-500 hover:text-white rounded-md transition text-sm font-medium">
                                    <i class="ph ph-sign-out mr-2"></i> Leave Server
                                </button>
                            </div>
                        </div>
                        
                        <div class="flex-1 overflow-y-auto p-2 space-y-[2px]">
                            <!-- Text Channels -->
                            <div class="text-xs font-bold text-gray-500 uppercase tracking-wider px-3 py-2 mt-2 flex justify-between items-center">
                                <span>Text Channels</span>
                            </div>
                            <template x-for="channel in (getServer()?.channels || []).filter(c => c.type === 'text')" :key="channel.id">
                                <button @click="activeChannelId = channel.id; viewingVoice = false;" class="w-full flex items-center px-2 py-1.5 rounded-md transition" :class="activeChannelId === channel.id && !viewingVoice ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                    <i class="ph ph-hash mr-2 text-lg"></i>
                                    <span class="font-medium text-sm truncate" x-text="channel.name"></span>
                                </button>
                            </template>

                            <!-- Voice Channels -->
                            <div class="text-xs font-bold text-gray-500 uppercase tracking-wider px-3 py-2 mt-4 flex justify-between items-center">
                                <span>Voice Channels</span>
                            </div>
                            <template x-for="channel in (getServer()?.channels || []).filter(c => c.type === 'voice')" :key="channel.id">
                                <div>
                                    <button @click="handleVoiceChannelClick(channel.id)" class="w-full flex items-center px-2 py-1.5 rounded-md transition" :class="inVoiceRoom === channel.id && viewingVoice ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                        <i class="ph ph-speaker-high mr-2 text-lg" :class="inVoiceRoom === channel.id ? 'text-green-500' : ''"></i>
                                        <span class="font-medium text-sm truncate" x-text="channel.name"></span>
                                    </button>
                                    
                                    <!-- Display Users currently in this voice channel -->
                                    <template x-for="p in (globalPresence || []).filter(gp => gp.currentVoice === channel.id)" :key="p.uid">
                                        <div class="flex items-center gap-2 px-2 py-1 ml-4 mt-0.5 rounded-md hover:bg-[#35373c] cursor-pointer" @click="openProfilePopout(p.uid)">
                                            <img :src="getUser(p.uid)?.avatar" class="w-6 h-6 rounded-full object-cover bg-[#1e1f22]">
                                            <span class="text-xs font-medium text-gray-300 truncate" x-text="getUser(p.uid)?.displayName"></span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <!-- Active Voice Connection Controls (Pinned to bottom of sidebar) -->
                        <div x-show="inVoiceRoom" class="bg-[#111214] p-3 border-t border-[#1e1f22] flex flex-col gap-2 relative z-20" style="display: none;">
                            <div class="flex items-center justify-between text-green-500 font-bold text-xs uppercase tracking-wide">
                                <span>Voice Connected</span>
                                <i class="ph-fill ph-check-circle"></i>
                            </div>
                            <div class="flex gap-1 justify-between">
                                <button @click="rtcToggleVideo()" class="p-2 flex-1 rounded hover:bg-[#3f4147] transition flex justify-center items-center" :class="rtcVideoOff ? 'text-gray-400' : 'text-white bg-[#3f4147]'" title="Toggle Camera">
                                    <i class="ph-fill text-lg" :class="rtcVideoOff ? 'ph-video-camera-slash' : 'ph-video-camera'"></i>
                                </button>
                                <button @click="rtcToggleScreenShare()" class="p-2 flex-1 rounded hover:bg-[#3f4147] transition flex justify-center items-center" :class="isScreenSharing ? 'text-white bg-[#3f4147]' : 'text-gray-400'" title="Share Screen">
                                    <i class="ph-fill ph-screencast text-lg"></i>
                                </button>
                                <button @click="leaveVoiceRoom()" class="p-2 flex-1 rounded hover:bg-red-500/20 text-red-400 transition flex justify-center items-center" title="Disconnect">
                                    <i class="ph-fill ph-phone-disconnect text-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Current User Profile Bar -->
                <div class="h-[60px] bg-[#232428] flex items-center px-2 justify-between flex-shrink-0 relative z-20">
                    <div class="flex items-center flex-1 min-w-0 hover:bg-[#3f4147]/50 p-1.5 rounded-md cursor-pointer transition" @click="openSettings()">
                        <div class="relative">
                            <img :src="currentUserProfile?.avatar" class="w-8 h-8 rounded-full object-cover flex-shrink-0 bg-[#1e1f22]">
                            <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#232428] rounded-full"></div>
                        </div>
                        <div class="ml-2 truncate">
                            <div class="text-sm font-bold text-gray-100 leading-tight truncate" x-text="currentUserProfile?.displayName"></div>
                            <div class="text-[11px] text-gray-400 leading-tight" x-text="'#' + currentUserProfile?.tag"></div>
                        </div>
                    </div>
                    <button @click="openSettings()" class="w-8 h-8 rounded-md flex items-center justify-center hover:bg-[#3f4147] text-gray-400 hover:text-gray-200 transition flex-shrink-0">
                        <i class="ph-fill ph-gear text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Main Central Area -->
            <div class="flex-1 flex flex-col bg-[#313338] min-w-0 relative z-0">
                
                <!-- Header -->
                <div class="h-12 border-b border-[#1e1f22] flex items-center px-4 flex-shrink-0 shadow-sm relative z-10 justify-between bg-[#313338]">
                    <div class="flex items-center text-gray-100 font-bold">
                        <template x-if="activeView === 'home' && activeTarget">
                            <div class="flex items-center">
                                <i class="ph ph-at mr-2 text-gray-400 text-xl"></i>
                                <span x-text="getUser(getDmPartner(activeTarget))?.displayName || 'Direct Message'"></span>
                            </div>
                        </template>
                        <template x-if="activeView === 'server' && !viewingVoice">
                            <div class="flex items-center">
                                <i class="ph ph-hash mr-2 text-gray-400 text-xl"></i>
                                <span x-text="getChannelName(activeChannelId)"></span>
                            </div>
                        </template>
                        <template x-if="activeView === 'server' && viewingVoice">
                            <div class="flex items-center text-green-400">
                                <i class="ph ph-speaker-high mr-2 text-xl"></i>
                                <span>Voice Connected</span>
                            </div>
                        </template>
                    </div>
                    
                    <template x-if="activeView === 'server' && !viewingVoice || (activeView === 'home' && activeTarget)">
                        <button @click="showMembersList = !showMembersList" class="p-1 text-gray-400 hover:text-gray-200 hover:bg-[#3f4147] rounded-md transition">
                            <i class="ph-fill ph-users text-xl"></i>
                        </button>
                    </template>
                </div>

                <!-- Fullscreen Voice Grid -->
                <div x-show="viewingVoice && inVoiceRoom" class="flex-1 bg-[#000000] p-4 flex flex-col relative" style="display: none;">
                    <div id="fullscreen-video-grid">
                        <!-- Local Video -->
                        <div class="relative rounded-lg overflow-hidden bg-[#1e1f22] flex items-center justify-center border border-[#2b2d31]">
                            <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
                            <div class="absolute bottom-3 left-3 bg-black/60 px-2 py-1 rounded text-xs text-white font-bold backdrop-blur-sm flex items-center gap-2">
                                <span x-text="currentUserProfile?.displayName + ' (You)'"></span>
                                <i class="ph-fill text-red-500" x-show="rtcVideoOff && !isScreenSharing" class="ph-video-camera-slash"></i>
                            </div>
                            <img x-show="rtcVideoOff && !isScreenSharing" :src="currentUserProfile?.avatar" class="absolute w-24 h-24 rounded-full object-cover shadow-2xl">
                        </div>
                        <!-- Remote Videos injected via JS will go here -->
                    </div>
                </div>

                <!-- Chat History -->
                <div x-show="!viewingVoice && activeView !== 'discovery'" class="flex-1 overflow-y-auto flex flex-col p-4 space-y-4" id="chatContainer">
                    <template x-if="!currentChatId">
                        <div class="flex flex-col items-center justify-center h-full text-gray-500">
                            <i class="ph-fill ph-chat-circle-dots text-6xl mb-4 text-[#3f4147]"></i>
                            <p class="text-gray-400 font-medium">Select a channel or friend to start chatting.</p>
                        </div>
                    </template>

                    <template x-for="msg in (filteredMessages || [])" :key="msg.id">
                        <div class="flex group hover:bg-[#2b2d31] p-1 rounded-md transition -mx-2 px-2 mt-4">
                            <img :src="getUser(msg.senderId)?.avatar" @click="openProfilePopout(msg.senderId)" class="w-10 h-10 rounded-full mt-0.5 object-cover cursor-pointer flex-shrink-0 bg-[#1e1f22]">
                            <div class="ml-4 flex-1 min-w-0">
                                <div class="flex items-baseline">
                                    <span class="font-bold text-gray-100 mr-2 cursor-pointer hover:underline text-[15px]" @click="openProfilePopout(msg.senderId)" x-text="getUser(msg.senderId)?.displayName || 'Unknown'"></span>
                                    <span class="text-xs text-gray-400 font-medium" x-text="formatTime(msg.timestamp)"></span>
                                </div>
                                <div class="text-gray-200 whitespace-pre-wrap break-words mt-0.5 leading-snug text-[15px]" x-text="msg.text"></div>
                                <template x-if="msg.image">
                                    <img :src="msg.image" class="mt-2 max-w-md w-full rounded-md object-contain border border-[#1e1f22] bg-[#2b2d31]">
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Message Input -->
                <div class="p-4 pt-0 flex-shrink-0 bg-[#313338]" x-show="currentChatId && !viewingVoice && activeView !== 'discovery'" style="display: none;">
                    <div class="bg-[#383a40] rounded-lg flex items-center px-4 py-2.5 transition">
                        <button @click="triggerImageUpload()" class="text-gray-400 hover:text-gray-200 p-1 flex-shrink-0 transition">
                            <i class="ph-fill ph-plus-circle text-2xl"></i>
                        </button>

    <!-- Modals (Profile Popout, Settings, Create Server, etc) -->

    <div x-show="showProfilePopout" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">

    <!-- Hidden Textarea for copying -->

    <script type="module">
        import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/module.esm.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Modern UI SVGs
        const svgC = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%233b82f6"/><stop offset="100%" stop-color="%231d4ed8"/></linearGradient></defs><rect width="100" height="100" fill="white"/><text x="50" y="72" font-family="Arial, sans-serif" font-size="65" font-weight="900" fill="url(%23g)" text-anchor="middle">C</text></svg>`;
        const svgPerson = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="p" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%2310b981"/><stop offset="100%" stop-color="%23047857"/></linearGradient></defs><rect width="100" height="100" fill="url(%23p)"/><circle cx="50" cy="35" r="20" fill="white"/><path d="M15 95 C15 65, 85 65, 85 95 Z" fill="white"/></svg>`;
        const svgPen = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="f" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%23f59e0b"/><stop offset="100%" stop-color="%23b45309"/></linearGradient></defs><rect width="100" height="100" fill="url(%23f)"/><path d="M50 15L65 50L50 85L35 50Z" fill="white"/><circle cx="50" cy="55" r="4" fill="url(%23f)"/><path d="M50 55v30" stroke="url(%23f)" stroke-width="2"/></svg>`;
        const svgHat = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="h" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%238b5cf6"/><stop offset="100%" stop-color="%235b21b6"/></linearGradient></defs><rect width="100" height="100" fill="url(%23h)"/><ellipse cx="50" cy="65" rx="40" ry="12" fill="%23111827"/><path d="M35 60 C35 30, 65 30, 65 60 Z" fill="%231f2937"/><rect x="35" y="52" width="30" height="8" fill="%23000"/></svg>`;

        window.nexusApp = () => ({
            isReady: false,
            authLoading: true,
            authMode: 'login', // login | register
            authEmail: '',
            authPassword: '',
            authDisplayName: '',
            authAvatar: svgC,
            currentUser: null,
            currentUserProfile: null,
            defaultAvatars: [{ data: svgC }, { data: svgPerson }, { data: svgPen }, { data: svgHat }],
            
            toast: { show: false, message: '', isError: false, timeout: null },

            // Modals
            showSettingsModal: false, editProfile: {},
            showProfilePopout: false, popoutUser: null,
            showAddFriendModal: false, friendAddInput: '',
            showCreateServerModal: false, newServerName: '',
            showServerSettingsModal: false, serverSettingsTab: 'overview', editServer: {}, newChannelName: '', newChannelType: 'text',
            
            // Navigation
            activeView: 'home', // home, server, discovery
            activeTarget: null, 
            activeChannelId: null, 
            showMembersList: true,
            viewingVoice: false, // Switches center pane to full screen video grid
            
            // Data
            servers: [], dms: [], messages: [], filteredMessages: [], users: {}, globalPresence: [],
            
            get myServers() { return this.servers.filter(s => this.currentUserProfile?.joinedServers?.includes(s.id)); },
            get discoveryServers() { return this.servers.filter(s => s.isPublic && !this.currentUserProfile?.joinedServers?.includes(s.id)); },
            get currentChatId() { return this.activeView === 'server' ? this.activeChannelId : this.activeTarget; },

            newMessage: '', pendingImage: null,

            // WebRTC
            inVoiceRoom: null, voicePeers: {}, rtcVideoOff: true, isScreenSharing: false,
            localStream: null, screenStream: null, simplePeers: {},

            db: null, auth: null, publicDataPath: '', usersRef: null, heartbeatInterval: null,

            async init() {
                try {
                    const defaultCfg = { apiKey: "AIzaSyDUoYS6MwDIVe8coZOM9A0ZCYaZTeDSloo", authDomain: "babjeu-85d3e.firebaseapp.com", databaseURL: "https://babjeu-85d3e-default-rtdb.firebaseio.com", projectId: "babjeu-85d3e", storageBucket: "babjeu-85d3e.firebasestorage.app", messagingSenderId: "306959176803", appId: "1:306959176803:web:2be00da38dbb37e777d456" };
                    const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultCfg;
                    const app = initializeApp(config);
                    this.db = getFirestore(app);
                    this.auth = getAuth(app);
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'le-barochat';
                    this.publicDataPath = `artifacts/${appId}/public/data`;
                    this.usersRef = collection(this.db, `${this.publicDataPath}/users`);

                    const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    if (token) { 
                        await signInWithCustomToken(this.auth, token); 
                        this.finishInit();
                    } else {
                        // Hook into persistent auth state
                        onAuthStateChanged(this.auth, (user) => {
                            if (user) this.finishInit();
                            else {
                                this.authLoading = false;
                                this.isReady = false;
                            }
                        });
                    }

                    this.$watch('filteredMessages', () => {
                        this.$nextTick(() => {
                            const c = document.getElementById('chatContainer');
                            if(c) c.scrollTop = c.scrollHeight;
                        });
                    });
                    this.$watch('currentChatId', () => { this.filterMessages(); });
                    
                    window.addEventListener('beforeunload', () => {
                        if(this.currentUser) setDoc(doc(this.db, `${this.publicDataPath}/presence`, this.currentUser.uid), { status: 'offline' }, { merge: true });
                    });

                } catch (e) { console.error("Init Error:", e); }
            },

            async processAuth() {
                this.authLoading = true;
                try {
                    if (this.authMode === 'login') {
                        await signInWithEmailAndPassword(this.auth, this.authEmail, this.authPassword);
                    } else {
                        const res = await createUserWithEmailAndPassword(this.auth, this.authEmail, this.authPassword);
                        const tag = Math.floor(1000 + Math.random() * 9000).toString();
                        const profile = {
                            uid: res.user.uid,
                            displayName: this.authDisplayName.trim(),
                            avatar: this.authAvatar,
                            tag: tag,
                            bio: "Ready to chat on Le BaroChat™!",
                            joinedServers: []
                        };
                        await setDoc(doc(this.usersRef, res.user.uid), profile);
                    }
                    // onAuthStateChanged will catch this and call finishInit
                } catch(e) {
                    this.showToast(e.message, true);
                    this.authLoading = false;
                }
            },

            async finishInit() {
                this.currentUser = this.auth.currentUser;
                const pSnap = await getDoc(doc(this.usersRef, this.currentUser.uid));
                
                if (pSnap.exists()) {
                    this.currentUserProfile = pSnap.data();
                    if (!this.currentUserProfile.joinedServers) this.currentUserProfile.joinedServers = [];
                    this.cacheUser(this.currentUserProfile);
                    this.startGlobalListeners();
                    this.isReady = true;
                    this.authLoading = false;
                    
                    // Presence Heartbeat
                    this.updatePresence();
                    this.heartbeatInterval = setInterval(() => this.updatePresence(), 15000);
                } else {
                    // Force register if profile missing for some reason
                    this.authMode = 'register';
                    this.authLoading = false;
                }
            },

            updatePresence() {
                if(!this.currentUser) return;
                setDoc(doc(this.db, `${this.publicDataPath}/presence`, this.currentUser.uid), {
                    uid: this.currentUser.uid,
                    status: 'online',
                    currentServer: this.activeView === 'server' ? this.activeTarget : null,
                    currentVoice: this.inVoiceRoom,
                    lastActive: Date.now()
                }, { merge: true });
            },

            showToast(msg, isError = false) {
                this.toast.message = msg; this.toast.isError = isError; this.toast.show = true;
                if(this.toast.timeout) clearTimeout(this.toast.timeout);
                this.toast.timeout = setTimeout(() => { this.toast.show = false; }, 4000);
            },

            copyToClipboard(text) {
                try {
                    const el = document.getElementById('hiddenCopyTextarea');
                    el.value = text; el.select(); document.execCommand('copy');
                    this.showToast("Copied to clipboard!");
                } catch(e) { this.showToast("Failed to copy.", true); }
            },

            copyInviteLink() {
                if (!this.activeTarget) return;
                const url = window.location.href.split('?')[0] + '?join=' + this.activeTarget;
                this.copyToClipboard(url);
            },

            startGlobalListeners() {
                onSnapshot(this.usersRef, (snap) => snap.forEach(d => this.cacheUser(d.data())), (e) => console.error(e));
                onSnapshot(collection(this.db, `${this.publicDataPath}/servers`), (snap) => {
                    const s = []; snap.forEach(d => s.push({id: d.id, ...d.data()})); this.servers = s;
                }, (e) => console.error(e));
                
                onSnapshot(collection(this.db, `${this.publicDataPath}/dms`), (snap) => {
                    const ds = []; 
                    snap.forEach(d => {
                        const data = d.data();
                        if (data.participants && data.participants.includes(this.currentUser.uid)) {
                            ds.push({ id: d.id, partnerUid: data.participants.find(p => p !== this.currentUser.uid) });
                        }
                    });
                    this.dms = ds;
                }, (e) => console.error(e));

                onSnapshot(collection(this.db, `${this.publicDataPath}/messages`), (snap) => {
                    const m = []; snap.forEach(d => m.push({id: d.id, ...d.data()}));
                    this.messages = m; this.filterMessages();
                }, (e) => console.error(e));

                // Presence tracking (only users active in last 60s)
                onSnapshot(collection(this.db, `${this.publicDataPath}/presence`), (snap) => {
                    const pres = [];
                    const now = Date.now();
                    snap.forEach(d => {
                        const data = d.data();
                        if (now - data.lastActive < 60000 && data.status === 'online') {
                            pres.push(data);
                            // WebRTC discovery
                            if (this.inVoiceRoom && data.currentVoice === this.inVoiceRoom && data.uid !== this.currentUser.uid && !this.simplePeers[data.uid]) {
                                this.createPeer(data.uid, this.currentUser.uid < data.uid);
                            }
                        }
                    });
                    this.globalPresence = pres;
                    
                    if(this.inVoiceRoom) {
                        const currentVoiceUsers = pres.filter(p => p.currentVoice === this.inVoiceRoom).map(p => p.uid);
                        Object.keys(this.simplePeers).forEach(uid => {
                            if (!currentVoiceUsers.includes(uid)) this.removePeer(uid);
                        });
                    }
                });

                onSnapshot(collection(this.db, `${this.publicDataPath}/signaling`), (snap) => {
                    snap.docChanges().forEach(change => {
                        if (change.type === 'added') {
                            const data = change.doc.data();
                            if (data.to === this.currentUser.uid && data.room === this.inVoiceRoom) {
                                this.handleIncomingSignal(data.from, data.signal);
                                deleteDoc(change.doc.ref); 
                            }
                        }
                    });
                });
            },

            filterMessages() {
                if (!this.currentChatId) { this.filteredMessages = []; return; }
                this.filteredMessages = this.messages.filter(m => m.roomId === this.currentChatId).sort((a, b) => a.timestamp - b.timestamp);
            },

            cacheUser(data) { if(data && data.uid) this.users[data.uid] = data; },
            getUser(uid) { return this.users[uid] || { displayName: 'Loading...', avatar: svgPerson }; },
            getServer() { return this.servers.find(s => s.id === this.activeTarget); },
            getChannelName(cid) {
                const s = this.getServer(); if(!s || !s.channels) return '';
                const c = s.channels.find(ch => ch.id === cid); return c ? c.name : '';
            },

            openHome() {
                this.activeView = 'home';
                this.activeTarget = null;
                this.activeChannelId = null;
                this.viewingVoice = false;
                this.updatePresence();
            },
            openServer(id) {
                this.activeView = 'server';
                this.activeTarget = id;
                const s = this.getServer();
                if (s && s.channels) {
                    const texts = s.channels.filter(c => c.type === 'text');
                    this.activeChannelId = texts.length > 0 ? texts[0].id : null;
                }
                this.viewingVoice = false;
                this.updatePresence();
            },

            // DMs
            getDmPartner(dmId) { const dm = this.dms.find(d => d.id === dmId); return dm ? dm.partnerUid : null; },
            openDM(id) {
                this.activeView = 'home'; this.activeTarget = id; this.activeChannelId = null;
            },
            async initiateDM(targetUid) {
                if (targetUid === this.currentUser.uid) return;
                const sorted = [this.currentUser.uid, targetUid].sort();
                const dmId = sorted.join('_');
                const dmRef = doc(this.db, `${this.publicDataPath}/dms`, dmId);
                const dmSnap = await getDoc(dmRef);
                if (!dmSnap.exists()) {
                    await setDoc(dmRef, { participants: sorted });
                }
                this.showProfilePopout = false;
                this.openDM(dmId);
            },

            openProfilePopout(uid) {
                this.popoutUser = this.getUser(uid);
                if(this.popoutUser) this.showProfilePopout = true;
            },

            getChatPlaceholder() {
                if (this.activeView === 'home') return `Message @${this.getUser(this.getDmPartner(this.activeTarget))?.displayName || 'User'}`;
                return `Message #${this.getChannelName(this.activeChannelId) || 'channel'}`;
            },

            async sendMessage() {
                if (!this.currentChatId || (!this.newMessage.trim() && !this.pendingImage)) return;
                const payload = { roomId: this.currentChatId, senderId: this.currentUser.uid, text: this.newMessage.trim(), image: this.pendingImage, timestamp: Date.now() };
                this.newMessage = ''; this.pendingImage = null;
                await addDoc(collection(this.db, `${this.publicDataPath}/messages`), payload);
            },

            // Image processing (Canvas Downsampling to bypass limits)
            triggerImageUpload() {
                const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
                input.onchange = (e) => this.processImage(e.target.files[0], 'chat'); input.click();
            },
            triggerAvatarUpload(context) {
                const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
                input.onchange = (e) => this.processImage(e.target.files[0], context); input.click();
            },
            processImage(file, context) {
                if (!file) return; const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_W = context === 'chat' ? 800 : 256;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; } } else { if (h > MAX_W) { w *= MAX_W / h; h = MAX_W; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        if (context === 'chat') this.pendingImage = dataUrl;
                        else if (context === 'setup') this.authAvatar = dataUrl;
                        else if (context === 'edit') this.editProfile.avatar = dataUrl;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            formatTime(ts) { return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); },

            // WebRTC Fullscreen & Screen Share
            handleVoiceChannelClick(channelId) {
                if (this.inVoiceRoom === channelId) {
                    this.viewingVoice = !this.viewingVoice; // Toggle view
                } else {
                    this.joinVoiceRoom(channelId);
                    this.viewingVoice = true;
                }
            },

            async joinVoiceRoom(channelId) {
                if (this.inVoiceRoom) this.leaveVoiceRoom();
                try {
                    // Try getting dummy stream first to connect immediately
                    const canvas = document.createElement('canvas');
                    canvas.width = 1; canvas.height = 1;
                    const dummyVideo = canvas.captureStream().getVideoTracks()[0];
                    const dummyAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const dummyAudio = dummyAudioCtx.createMediaStreamDestination().stream.getAudioTracks()[0];
                    this.localStream = new MediaStream([dummyVideo, dummyAudio]);
                    
                    this.inVoiceRoom = channelId;
                    this.rtcVideoOff = true;
                    this.isScreenSharing = false;
                    
                    this.updatePresence();

                    // Actually request Mic
                    navigator.mediaDevices.getUserMedia({ video: false, audio: true }).then(stream => {
                        const micTrack = stream.getAudioTracks()[0];
                        this.localStream.removeTrack(this.localStream.getAudioTracks()[0]);
                        this.localStream.addTrack(micTrack);
                        Object.values(this.simplePeers).forEach(p => p.replaceTrack(dummyAudio, micTrack, this.localStream));
                    }).catch(() => this.showToast("Mic access denied.", true));

                    setTimeout(() => {
                        const localVid = document.getElementById('local-video');
                        if (localVid) localVid.srcObject = this.localStream;
                    }, 500);
                    
                } catch(e) { this.showToast("Failed to initialize voice.", true); }
            },

            leaveVoiceRoom() {
                if (this.localStream) this.localStream.getTracks().forEach(t => t.stop());
                if (this.screenStream) this.screenStream.getTracks().forEach(t => t.stop());
                
                Object.values(this.simplePeers).forEach(p => p.destroy());
                this.simplePeers = {}; this.voicePeers = {}; 
                
                // Cleanup remote videos safely
                const grid = document.getElementById('fullscreen-video-grid');
                if(grid) {
                    Array.from(grid.children).forEach(child => {
                        if(child.id !== 'local-video' && !child.id.includes('local-video')) child.remove();
                    });
                }
                
                this.inVoiceRoom = null; this.localStream = null; this.screenStream = null;
                this.viewingVoice = false;
                this.updatePresence();
            },

            async rtcToggleVideo() {
                if (!this.localStream || this.isScreenSharing) return;
                
                if (this.rtcVideoOff) {
                    try {
                        const vidStream = await navigator.mediaDevices.getUserMedia({ video: true });
                        const vidTrack = vidStream.getVideoTracks()[0];
                        const oldTrack = this.localStream.getVideoTracks()[0];
                        
                        this.localStream.removeTrack(oldTrack);
                        this.localStream.addTrack(vidTrack);
                        Object.values(this.simplePeers).forEach(p => p.replaceTrack(oldTrack, vidTrack, this.localStream));
                        
                        this.rtcVideoOff = false;
                    } catch(e) { this.showToast("Camera access denied.", true); }
                } else {
                    const vidTrack = this.localStream.getVideoTracks()[0];
                    if (vidTrack) {
                        vidTrack.stop();
                        // Replace with dummy
                        const canvas = document.createElement('canvas'); canvas.width = 1; canvas.height = 1;
                        const dummyVideo = canvas.captureStream().getVideoTracks()[0];
                        this.localStream.removeTrack(vidTrack);
                        this.localStream.addTrack(dummyVideo);
                        Object.values(this.simplePeers).forEach(p => p.replaceTrack(vidTrack, dummyVideo, this.localStream));
                        this.rtcVideoOff = true;
                    }
                }
            },

            async rtcToggleScreenShare() {
                if (!this.localStream) return;

                if (!this.isScreenSharing) {
                    try {
                        this.screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                        const screenTrack = this.screenStream.getVideoTracks()[0];
                        const oldTrack = this.localStream.getVideoTracks()[0];

                        this.localStream.removeTrack(oldTrack);
                        this.localStream.addTrack(screenTrack);
                        Object.values(this.simplePeers).forEach(p => p.replaceTrack(oldTrack, screenTrack, this.localStream));

                        this.isScreenSharing = true;
                        this.rtcVideoOff = true; // Visually disable camera button

                        screenTrack.onended = () => { this.rtcToggleScreenShare(); };
                        const localVid = document.getElementById('local-video');
                        if (localVid) localVid.srcObject = this.screenStream;

                    } catch(e) { this.showToast("Screen share cancelled.", true); }
                } else {
                    if (this.screenStream) this.screenStream.getTracks().forEach(t => t.stop());
                    this.screenStream = null;
                    this.isScreenSharing = false;
                    
                    const oldTrack = this.localStream.getVideoTracks()[0];
                    const canvas = document.createElement('canvas'); canvas.width = 1; canvas.height = 1;
                    const dummyVideo = canvas.captureStream().getVideoTracks()[0];
                    this.localStream.removeTrack(oldTrack);
                    this.localStream.addTrack(dummyVideo);
                    Object.values(this.simplePeers).forEach(p => p.replaceTrack(oldTrack, dummyVideo, this.localStream));
                    
                    const localVid = document.getElementById('local-video');
                    if (localVid) localVid.srcObject = this.localStream;
                }
            },

            createPeer(targetUid, initiator) {
                const peer = new SimplePeer({
                    initiator: initiator, trickle: true, stream: this.localStream,
                    config: {
                        iceServers: [
                            { urls: 'stun:openrelay.metered.ca:80' },
                            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                        ]
                    }
                });

                peer.on('signal', data => {
                    addDoc(collection(this.db, `${this.publicDataPath}/signaling`), {
                        to: targetUid, from: this.currentUser.uid, room: this.inVoiceRoom, signal: JSON.stringify(data)
                    });
                });
                
                peer.on('error', err => { this.removePeer(targetUid); });
                peer.on('close', () => { this.removePeer(targetUid); });

                peer.on('stream', stream => {
                    this.voicePeers[targetUid] = true;
                    setTimeout(() => {
                        const grid = document.getElementById('fullscreen-video-grid');
                        if(!grid) return;
                        let wrapper = document.getElementById(`vid_wrap_${targetUid}`);
                        if (!wrapper) {
                            wrapper = document.createElement('div');
                            wrapper.id = `vid_wrap_${targetUid}`;
                            wrapper.className = "relative rounded-lg overflow-hidden bg-[#1e1f22] flex items-center justify-center border border-[#2b2d31]";
                            
                            const v = document.createElement('video');
                            v.id = `vid_${targetUid}`; v.autoplay = true; v.playsInline = true; v.className = "w-full h-full object-cover";
                            
                            const overlay = document.createElement('div');
                            overlay.className = "absolute bottom-3 left-3 bg-black/60 px-2 py-1 rounded text-xs text-white font-bold backdrop-blur-sm";
                            overlay.innerText = this.getUser(targetUid).displayName;
                            
                            wrapper.appendChild(v); wrapper.appendChild(overlay); grid.appendChild(wrapper);
                        }
                        document.getElementById(`vid_${targetUid}`).srcObject = stream;
                    }, 200);
                });

                this.simplePeers[targetUid] = peer;
            },

            handleIncomingSignal(fromUid, signalStr) {
                if (!this.inVoiceRoom) return;
                let peer = this.simplePeers[fromUid];
                if (!peer) { this.createPeer(fromUid, false); peer = this.simplePeers[fromUid]; }
                peer.signal(JSON.parse(signalStr));
            },

            removePeer(uid) {
                if (this.simplePeers[uid]) { this.simplePeers[uid].destroy(); delete this.simplePeers[uid]; }
                const v = document.getElementById(`vid_wrap_${uid}`); if (v) v.remove();
            }
        });

        Alpine.data('nexusApp', window.nexusApp);
        Alpine.start();
    </script>
</body>
</html>
