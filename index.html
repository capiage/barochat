<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le BaroChat™</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CRITICAL POLYFILLS FOR SIMPLE-PEER IN BROWSER -->
    <script>
        window.global = window;
        window.process = { env: { DEBUG: undefined } };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #1e1f22; color: #dbdee1; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #111214; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Fullscreen WebRTC Video Grid */
        #fullscreen-video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1rem;
            width: 100%;
            height: 100%;
            align-content: center;
            justify-content: center;
            padding: 1rem;
        }
        #fullscreen-video-grid video {
            width: 100%;
            height: 100%;
            max-height: 45vh;
            border-radius: 0.5rem;
            background-color: #000;
            object-fit: cover;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.5);
            border: 2px solid #1e1f22;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen flex bg-[#1e1f22]" x-data="nexusApp()" x-cloak>

    <div x-show="toast.show" x-transition.opacity class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] px-4 py-3 rounded-md shadow-2xl text-sm font-bold text-white transition-all flex items-center gap-3" :class="toast.isError ? 'bg-red-500' : 'bg-[#5865F2]'" style="display: none;">
        <i class="ph-fill text-xl" :class="toast.isError ? 'ph-warning-circle' : 'ph-info'"></i>
        <span x-text="toast.message"></span>
    </div>

    <div x-show="!isReady" class="fixed inset-0 z-50 flex items-center justify-center bg-[#1e1f22] overflow-y-auto py-10" style="display: none;">
        
        <div x-show="authLoading" class="flex flex-col items-center text-gray-300">
            <i class="ph ph-spinner-gap animate-spin text-5xl mb-4 text-[#5865F2]"></i>
            <h1 class="text-xl font-bold tracking-tight">Connecting to Le BaroChat™...</h1>
        </div>

        <div x-show="!authLoading" class="flex flex-col md:flex-row gap-8 items-start max-w-5xl w-full px-6">
            
            <div class="bg-[#313338] p-8 rounded-xl shadow-2xl w-full max-w-md">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-100" x-text="authMode === 'login' ? 'Welcome Back!' : 'Create an Account'"></h2>
                    <p class="text-gray-400 mt-1 text-sm" x-text="authMode === 'login' ? 'We\'re so excited to see you again!' : 'Join Le BaroChat™ and connect with friends.'"></p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Email Address</label>
                        <input type="email" x-model="authEmail" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-[#5865F2] focus:ring-1 focus:ring-[#5865F2] text-gray-100 text-sm outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Password</label>
                        <input type="password" x-model="authPassword" @keydown.enter="processAuth()" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-[#5865F2] focus:ring-1 focus:ring-[#5865F2] text-gray-100 text-sm outline-none transition">
                    </div>

                    <template x-if="authMode === 'register'">
                        <div class="space-y-4 pt-2 border-t border-[#2b2d31] mt-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 mt-4">Display Name</label>
                                <input type="text" x-model="authDisplayName" maxlength="20" class="w-full px-4 py-3 bg-[#1e1f22] border border-transparent rounded-md focus:border-[#5865F2] focus:ring-1 focus:ring-[#5865F2] text-gray-100 text-sm outline-none transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Choose an Avatar</label>
                                <div class="grid grid-cols-4 gap-3 mb-3">
                                    <template x-for="(avatarObj, index) in defaultAvatars" :key="index">
                                        <button @click="authAvatar = avatarObj.data" class="aspect-square rounded-full overflow-hidden border-2 transition hover:opacity-80 bg-[#1e1f22]" :class="authAvatar === avatarObj.data ? 'border-[#5865F2] scale-105 shadow-lg' : 'border-transparent'">
                                            <img :src="avatarObj.data" class="w-full h-full object-cover">
                                        </button>
                                    </template>
                                </div>
                                <button @click="triggerImageUpload('setup')" class="w-full py-2 text-sm text-[#5865F2] font-medium bg-[#2b2d31] hover:bg-[#1e1f22] rounded-md transition border border-transparent hover:border-[#383a40]">
                                    Or upload custom image...
                                </button>
                            </div>
                        </div>
                    </template>

                    <button @click="processAuth()" :disabled="!authEmail || !authPassword || (authMode === 'register' && !authDisplayName)" class="w-full py-3 bg-[#5865F2] hover:bg-[#4752C4] disabled:opacity-50 text-white font-bold rounded-md shadow transition mt-6">
                        <span x-text="authMode === 'login' ? 'Log In' : 'Register'"></span>
                    </button>

                    <div class="text-sm text-gray-400 mt-4">
                        <span x-text="authMode === 'login' ? 'Need an account?' : 'Already have an account?'"></span>
                        <button @click="authMode = authMode === 'login' ? 'register' : 'login'" class="text-[#00A8FC] hover:underline ml-1 font-medium">
                            <span x-text="authMode === 'login' ? 'Register' : 'Log In'"></span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-full max-w-sm hidden md:block" x-show="authMode === 'register'">
                <div class="text-xs font-bold text-gray-500 uppercase mb-3 text-center">Live Profile Preview</div>
                <div class="bg-[#232428] rounded-xl shadow-2xl w-full overflow-hidden">
                    <div class="h-24 bg-[#5865F2] w-full"></div>
                    <div class="px-5 pb-6">
                        <!-- Fix for the overlapping issue: Using standard flow with negative margin -->
                        <div class="flex justify-between items-end -mt-12 mb-3">
                            <img :src="authAvatar" class="w-24 h-24 rounded-full border-[6px] border-[#232428] bg-[#1e1f22] object-cover shadow-sm">
                        </div>
                        <div>
                            <h3 class="text-xl font-extrabold text-gray-100 leading-tight truncate" x-text="authDisplayName || 'Your Name'"></h3>
                            <p class="text-sm text-gray-400 font-medium mb-4" x-text="(authDisplayName || 'YourName').replace(/\s+/g, '').toLowerCase() + '#1234'"></p>
                            
                            <div class="w-full h-[1px] bg-[#313338] mb-4"></div>
                            
                            <h4 class="text-[11px] font-bold text-gray-400 uppercase mb-2">About Me</h4>
                            <p class="text-sm text-gray-300">Ready to chat on Le BaroChat™!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template x-if="isReady && currentUserProfile">
        <div class="flex h-full w-full">
            
            <!-- Far Left Sidebar (Server List) -->
            <div class="w-[72px] h-full bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0 z-30 overflow-y-auto no-scrollbar">
                
                <!-- Home Button -->
                <button @click="openHome()" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-gray-100 flex items-center justify-center transition-all duration-200 relative group" :class="{'rounded-[16px] bg-[#5865F2] text-white': activeView === 'home'}">
                    <i class="ph-fill ph-house text-2xl"></i>
                    <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeView === 'home' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                </button>

                <div class="w-8 h-[2px] bg-[#313338] rounded-full my-1"></div>

                <!-- Mapped Servers -->
                <template x-for="server in myServers" :key="server.id">
                    <button @click="openServer(server.id)" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-gray-100 hover:text-white flex items-center justify-center transition-all duration-200 shadow relative group overflow-hidden" :class="{'rounded-[16px] bg-[#5865F2] text-white': activeTarget === server.id && activeView === 'server'}">
                        <template x-if="server.icon">
                            <img :src="server.icon" class="w-full h-full object-cover">
                        </template>
                        <template x-if="!server.icon">
                            <span x-text="server.name.substring(0,2).toUpperCase()" class="font-bold text-sm"></span>
                        </template>
                        <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeTarget === server.id && activeView === 'server' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                    </button>
                </template>

                <!-- Actions -->
                <button @click="showCreateServerModal = true; newServerName = ''" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] hover:bg-[#23A559] text-[#23A559] hover:text-white flex items-center justify-center transition-all duration-200 mt-2 group relative" title="Add a Server">
                    <i class="ph ph-plus text-xl"></i>
                </button>
                <button @click="openDiscovery()" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] hover:bg-[#5865F2] text-gray-300 hover:text-white flex items-center justify-center transition-all duration-200 mt-2 relative group" :class="{'rounded-[16px] bg-[#5865F2] text-white': activeView === 'discovery'}" title="Discover Servers">
                    <i class="ph-fill ph-compass text-2xl"></i>
                    <div class="absolute -left-3 w-1 bg-white rounded-r-md transition-all duration-200" :class="activeView === 'discovery' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                </button>
            </div>

            <div class="w-60 h-full bg-[#2b2d31] flex flex-col flex-shrink-0 z-20 relative">
                
                <!-- Home Sidebar (Friends & DMs) -->
                <template x-if="activeView === 'home' || activeView === 'discovery'">
                    <div class="flex flex-col h-full">
                        <div class="h-12 border-b border-[#1e1f22] shadow-sm flex items-center px-4">
                            <button class="w-full bg-[#1e1f22] text-gray-400 text-sm py-1.5 px-3 rounded text-left hover:text-gray-200 transition">Find or start a conversation</button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-2 space-y-[2px]">
                            <button @click="activeTarget = null; activeView = 'home'" class="w-full flex items-center px-3 py-2 rounded-md transition mb-2" :class="!activeTarget && activeView === 'home' ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:text-gray-100 hover:bg-[#35373c]'">
                                <i class="ph-fill ph-users mr-3 text-lg"></i>
                                <span class="font-medium text-[15px]">Friends</span>
                            </button>
                            
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 py-2 mt-2 flex justify-between items-center hover:text-gray-300 cursor-pointer">
                                <span>Direct Messages</span>
                                <i class="ph ph-plus"></i>
                            </div>
                            
                            <!-- DM List -->
                            <template x-for="dm in dms" :key="dm.id">
                                <button @click="openDM(dm.id)" class="w-full flex items-center px-2 py-1.5 rounded-md transition group" :class="activeTarget === dm.id ? 'bg-[#3f4147] text-white' : 'hover:bg-[#35373c] text-gray-400 hover:text-gray-200'">
                                    <div class="relative">
                                        <img :src="getUser(dm.partnerUid)?.avatar" class="w-8 h-8 rounded-full mr-3 object-cover bg-[#1e1f22]">
                                        <div class="absolute bottom-0 right-3 w-3 h-3 border-2 border-[#2b2d31] rounded-full" :class="isUserOnline(dm.partnerUid) ? 'bg-[#23A559]' : 'bg-gray-500'"></div>
                                    </div>
                                    <div class="flex-1 text-left truncate">
                                        <div class="font-medium text-[15px] truncate" x-text="getUser(dm.partnerUid)?.displayName || 'Unknown'"></div>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
                
                <!-- Server Sidebar (Channels) -->
                <template x-if="activeView === 'server'">
                    <div class="flex flex-col h-full">
                        <!-- Server Header w/ Dropdown -->
                        <div class="h-12 border-b border-[#1e1f22] shadow-sm flex items-center px-4 font-bold text-gray-100 justify-between cursor-pointer hover:bg-[#35373c] transition group relative z-50">
                            <span class="truncate pr-2" x-text="getServer()?.name || 'Server'"></span>
                            <i class="ph ph-caret-down text-gray-400 group-hover:text-gray-200 transition-transform"></i>
                            
                            <!-- Dropdown Menu -->
                            <div class="absolute top-10 left-2 right-2 bg-[#111214] rounded-md shadow-2xl border border-[#1e1f22] p-2 hidden group-hover:block">
                                <button @click.stop="copyInviteLink()" class="w-full flex items-center justify-between px-2 py-1.5 text-[#5865F2] hover:bg-[#5865F2] hover:text-white rounded-md transition text-sm font-medium mb-1">
                                    <span>Invite People</span>
                                    <i class="ph ph-user-plus"></i>
                                </button>
                                <template x-if="getServer()?.owner === currentUserProfile?.uid">
                                    <button @click.stop="openServerSettingsModal()" class="w-full flex items-center justify-between px-2 py-1.5 text-gray-300 hover:bg-[#5865F2] hover:text-white rounded-md transition text-sm font-medium">
                                        <span>Server Settings</span>
                                        <i class="ph ph-gear"></i>
                                    </button>
                                </template>
                                <div class="h-px bg-[#2b2d31] my-1"></div>
                                <button @click.stop="leaveServer()" class="w-full flex items-center justify-between px-2 py-1.5 text-red-400 hover:bg-red-500 hover:text-white rounded-md transition text-sm font-medium">
                                    <span>Leave Server</span>
                                    <i class="ph ph-sign-out"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="flex-1 overflow-y-auto p-2 space-y-[2px]">
                            <!-- Text Channels -->
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 py-2 flex justify-between items-center group">
                                <span>Text Channels</span>
                                <template x-if="getServer()?.owner === currentUserProfile?.uid">
                                    <button @click="openServerSettingsModal('channels')" class="hidden group-hover:block hover:text-gray-200"><i class="ph ph-plus"></i></button>
                                </template>
                            </div>
                            <template x-for="channel in (getServer()?.channels || []).filter(c => c.type === 'text')" :key="channel.id">
                                <button @click="activeChannelId = channel.id; viewingVoice = false;" class="w-full flex items-center px-2 py-1.5 rounded-md transition" :class="activeChannelId === channel.id && !viewingVoice ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                    <i class="ph ph-hash mr-2 text-lg"></i>
                                    <span class="font-medium text-[15px] truncate" x-text="channel.name"></span>
                                </button>
                            </template>

                            <!-- Voice Channels -->
                            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-3 py-2 mt-4 flex justify-between items-center group">
                                <span>Voice Channels</span>
                                <template x-if="getServer()?.owner === currentUserProfile?.uid">
                                    <button @click="openServerSettingsModal('channels')" class="hidden group-hover:block hover:text-gray-200"><i class="ph ph-plus"></i></button>
                                </template>
                            </div>
                            <template x-for="channel in (getServer()?.channels || []).filter(c => c.type === 'voice')" :key="channel.id">
                                <div class="mb-1">
                                    <button @click="handleVoiceChannelClick(channel.id)" class="w-full flex items-center px-2 py-1.5 rounded-md transition" :class="inVoiceRoom === channel.id ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                        <i class="ph ph-speaker-high mr-2 text-lg" :class="inVoiceRoom === channel.id ? 'text-[#23A559]' : ''"></i>
                                        <span class="font-medium text-[15px] truncate" x-text="channel.name"></span>
                                    </button>
                                    
                                    <!-- Display Users currently in this voice channel -->
                                    <div class="pl-6 pt-1 space-y-1">
                                        <template x-for="p in getVoiceUsers(channel.id)" :key="p.uid">
                                            <div class="flex items-center gap-2 px-2 py-1 rounded hover:bg-[#35373c] cursor-pointer transition" @click="openProfilePopout(p.uid)">
                                                <img :src="getUser(p.uid)?.avatar" class="w-6 h-6 rounded-full object-cover bg-[#1e1f22]">
                                                <span class="text-sm font-medium text-gray-300 hover:text-gray-100 truncate" x-text="getUser(p.uid)?.displayName"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div x-show="inVoiceRoom" class="bg-[#111214] p-2 border-t border-[#1e1f22] flex flex-col gap-2 relative z-20" style="display: none;">
                            <div class="flex items-center justify-between text-[#23A559] px-1 pt-1">
                                <div class="flex flex-col cursor-pointer hover:underline" @click="viewingVoice = true">
                                    <span class="font-bold text-xs uppercase tracking-wide">Voice Connected</span>
                                    <span class="text-[11px] text-gray-400 truncate" x-text="getChannelName(inVoiceRoom) + ' / ' + (getServer()?.name || 'Server')"></span>
                                </div>
                                <button @click="leaveVoiceRoom()" class="text-red-400 hover:text-red-500 transition p-1" title="Disconnect">
                                    <i class="ph-fill ph-phone-disconnect text-xl"></i>
                                </button>
                            </div>
                            <div class="flex gap-1 justify-between bg-[#2b2d31] p-1 rounded-md">
                                <button @click="rtcToggleVideo()" class="p-1.5 flex-1 rounded hover:bg-[#3f4147] transition flex justify-center items-center" :class="!rtcVideoOff ? 'text-white bg-[#3f4147]' : 'text-gray-400'" title="Toggle Camera">
                                    <i class="ph-fill text-lg" :class="rtcVideoOff ? 'ph-video-camera-slash' : 'ph-video-camera'"></i>
                                </button>
                                <button @click="rtcToggleScreenShare()" class="p-1.5 flex-1 rounded hover:bg-[#3f4147] transition flex justify-center items-center" :class="isScreenSharing ? 'text-white bg-[#3f4147]' : 'text-gray-400'" title="Share Screen">
                                    <i class="ph-fill ph-screencast text-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Current User Profile Strip (Bottom Left) -->
                <div class="h-[52px] bg-[#232428] flex items-center px-2 justify-between flex-shrink-0 relative z-30 w-full">
                    <div class="flex items-center flex-1 min-w-0 hover:bg-[#3f4147]/50 p-1 rounded-md cursor-pointer transition" @click="openSettingsModal()">
                        <div class="relative">
                            <img :src="currentUserProfile?.avatar" class="w-8 h-8 rounded-full object-cover flex-shrink-0 bg-[#1e1f22]">
                            <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[#23A559] border-2 border-[#232428] rounded-full"></div>
                        </div>
                        <div class="ml-2 truncate pb-0.5">
                            <div class="text-[13px] font-bold text-gray-100 leading-none truncate" x-text="currentUserProfile?.displayName"></div>
                            <div class="text-[11px] text-gray-400 leading-none mt-1 truncate" x-text="'#' + currentUserProfile?.tag"></div>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <button @click="openSettingsModal()" class="w-8 h-8 rounded-md flex items-center justify-center hover:bg-[#3f4147] text-gray-400 hover:text-gray-200 transition flex-shrink-0" title="User Settings">
                            <i class="ph-fill ph-gear text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col bg-[#313338] min-w-0 relative z-10">
                
                <!-- Main Header -->
                <div class="h-12 border-b border-[#1e1f22] shadow-sm flex items-center px-4 flex-shrink-0 justify-between bg-[#313338]">
                    <div class="flex items-center text-gray-100 font-bold text-[15px]">
                        <template x-if="activeView === 'home' && !activeTarget">
                            <div class="flex items-center"><i class="ph-fill ph-users mr-2 text-gray-400 text-xl"></i> Friends</div>
                        </template>
                        <template x-if="activeView === 'discovery'">
                            <div class="flex items-center"><i class="ph-fill ph-compass mr-2 text-gray-400 text-xl"></i> Discover Servers</div>
                        </template>
                        <template x-if="activeView === 'home' && activeTarget">
                            <div class="flex items-center">
                                <i class="ph ph-at mr-2 text-gray-400 text-xl"></i>
                                <span x-text="getUser(getDmPartner(activeTarget))?.displayName || 'Direct Message'"></span>
                            </div>
                        </template>
                        <template x-if="activeView === 'server' && !viewingVoice">
                            <div class="flex items-center">
                                <i class="ph ph-hash mr-2 text-gray-400 text-xl"></i>
                                <span x-text="getChannelName(activeChannelId)"></span>
                            </div>
                        </template>
                        <template x-if="activeView === 'server' && viewingVoice">
                            <div class="flex items-center text-gray-100">
                                <i class="ph-fill ph-speaker-high mr-2 text-xl text-[#23A559]"></i>
                                <span x-text="getChannelName(inVoiceRoom)"></span>
                            </div>
                        </template>
                    </div>
                    
                    <template x-if="activeView === 'server' && !viewingVoice || (activeView === 'home' && activeTarget)">
                        <button @click="showMembersList = !showMembersList" class="p-1 text-gray-400 hover:text-gray-200 hover:bg-[#3f4147] rounded-md transition" title="Toggle Member List">
                            <i class="ph-fill ph-users text-xl"></i>
                        </button>
                    </template>
                </div>

                <div x-show="activeView === 'home' && !activeTarget" class="flex-1 p-6 overflow-y-auto" style="display: none;">
                    <h2 class="text-gray-100 font-bold mb-4 uppercase text-xs tracking-wide border-b border-[#3f4147] pb-2">All Friends - <span x-text="(currentUserProfile?.friends || []).length"></span></h2>
                    
                    <template x-if="!(currentUserProfile?.friends?.length)">
                        <div class="flex flex-col items-center justify-center h-64 text-gray-500">
                            <i class="ph-fill ph-user-plus text-6xl mb-4 text-[#3f4147]"></i>
                            <p class="text-gray-400 font-medium">You don't have any friends yet.</p>
                            <p class="text-gray-500 text-sm mt-2">Find people in servers and click their avatar to add them!</p>
                        </div>
                    </template>

                    <div class="space-y-2">
                        <template x-for="friendId in (currentUserProfile?.friends || [])" :key="friendId">

    <script type="module">
        import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/module.esm.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Modern UI SVGs (Handcrafted, Gradients, Shadows)
        const svgC = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%235865F2"/><stop offset="100%" stop-color="%234752C4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/></filter></defs><rect width="100" height="100" fill="url(%23g)"/><text x="50" y="72" font-family="Arial, sans-serif" font-size="65" font-weight="900" fill="white" text-anchor="middle" filter="url(%23s)">C</text></svg>`;
        const svgPerson = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23313338"/><circle cx="50" cy="40" r="22" fill="%2380848E"/><path d="M15 100 C15 65, 85 65, 85 100 Z" fill="%2380848E"/></svg>`;
        const svgPen = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="f" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%23EAB308"/><stop offset="100%" stop-color="%23A16207"/></linearGradient></defs><rect width="100" height="100" fill="%231e1f22"/><path d="M50 15 L65 50 L50 85 L35 50 Z" fill="url(%23f)"/><circle cx="50" cy="55" r="4" fill="%231e1f22"/><path d="M50 55 v30" stroke="%231e1f22" stroke-width="2"/></svg>`;
        const svgHat = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23B91C1C"/><ellipse cx="50" cy="65" rx="45" ry="12" fill="%23111827"/><path d="M30 60 C30 25, 70 25, 70 60 Z" fill="%231f2937"/><rect x="30" y="52" width="40" height="8" fill="%23000"/></svg>`;

        window.nexusApp = () => ({
            isReady: false,
            authLoading: true,
            authMode: 'login', // login | register
            authEmail: '', authPassword: '', authDisplayName: '', authAvatar: svgC,
            defaultAvatars: [{ data: svgC }, { data: svgPerson }, { data: svgPen }, { data: svgHat }],
            
            // Custom Auth Layer
            logicalUid: null, 
            currentUserProfile: null,
            
            toast: { show: false, message: '', isError: false, timeout: null },

            // Modals
            showSettingsModal: false, editProfile: {},
            showProfilePopout: false, popoutUser: null,
            showCreateServerModal: false, newServerName: '', newServerIcon: null,
            showServerSettingsModal: false, serverSettingsTab: 'overview', editServer: {}, newChannelName: '', newChannelType: 'text',
            
            // Navigation & UI
            activeView: 'home', // home, server, discovery
            activeTarget: null, 
            activeChannelId: null, 
            showMembersList: true,
            viewingVoice: false, // Toggles center pane to video grid
            
            // Data
            servers: [], dms: [], messages: [], filteredMessages: [], users: {}, globalPresence: [],
            
            get myServers() { return this.servers.filter(s => this.currentUserProfile?.joinedServers?.includes(s.id)); },
            get discoveryServers() { return this.servers.filter(s => s.isPublic && !this.currentUserProfile?.joinedServers?.includes(s.id)); },
            get currentChatId() { return this.activeView === 'server' ? this.activeChannelId : this.activeTarget; },

            newMessage: '', pendingImage: null,

            // WebRTC State
            inVoiceRoom: null, voicePeers: {}, rtcVideoOff: true, isScreenSharing: false,
            localStream: null, screenStream: null, simplePeers: {},

            db: null, auth: null, publicDataPath: '', usersRef: null, accountsRef: null, heartbeatInterval: null,

            async init() {
                try {
                    const defaultCfg = { apiKey: "AIzaSyDUoYS6MwDIVe8coZOM9A0ZCYaZTeDSloo", authDomain: "babjeu-85d3e.firebaseapp.com", databaseURL: "https://babjeu-85d3e-default-rtdb.firebaseio.com", projectId: "babjeu-85d3e", storageBucket: "babjeu-85d3e.firebasestorage.app", messagingSenderId: "306959176803", appId: "1:306959176803:web:2be00da38dbb37e777d456" };
                    const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultCfg;
                    const app = initializeApp(config);
                    this.db = getFirestore(app);
                    this.auth = getAuth(app);
                    
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'le-barochat';
                    this.publicDataPath = `artifacts/${appId}/public/data`;
                    this.usersRef = collection(this.db, `${this.publicDataPath}/users`);
                    this.accountsRef = collection(this.db, `${this.publicDataPath}/accounts`);

                    // 1. Authenticate anonymously with Firebase to satisfy security rules
                    await signInAnonymously(this.auth);

                    // 2. Check for our Custom "Logical" Session in localStorage
                    const savedSession = localStorage.getItem('lebarochat_session');
                    
                    if (savedSession) {
                        this.logicalUid = savedSession;
                        await this.loadLogicalProfile();
                    } else {
                        // Show Auth Screen
                        this.authLoading = false;
                        this.isReady = false;
                    }

                    // Setup Chat Scroll Watcher
                    this.$watch('filteredMessages', () => {
                        this.$nextTick(() => {
                            const c = document.getElementById('chatContainer');
                            if(c) c.scrollTop = c.scrollHeight;
                        });
                    });
                    this.$watch('currentChatId', () => { this.filterMessages(); });
                    
                    window.addEventListener('beforeunload', () => {
                        if(this.logicalUid) setDoc(doc(this.db, `${this.publicDataPath}/presence`, this.logicalUid), { status: 'offline' }, { merge: true });
                    });

                    // Handle Join links (e.g. ?join=serverId)
                    const urlParams = new URLSearchParams(window.location.search);
                    const joinId = urlParams.get('join');
                    if (joinId) {
                        // Strip parameter so it doesn't loop
                        window.history.replaceState({}, document.title, window.location.pathname);
                        // Once ready, it will try to join
                        this._pendingJoinId = joinId;
                    }

                } catch (e) { 
                    console.error("Init Error:", e); 
                    this.showToast("Failed to connect to servers.", true);
                }
            },

            async processAuth() {
                this.authLoading = true;
                try {
                    const emailNormalized = this.authEmail.trim().toLowerCase();
                    
                    if (this.authMode === 'login') {
                        // Custom Login Query (Bypassing Firebase Auth restrictions)
                        // Note: Using client-side filtering to adhere to strict "No complex queries" rule
                        const snap = await getDocs(this.accountsRef);
                        let foundAccount = null;
                        snap.forEach(doc => {
                            const data = doc.data();
                            if(data.email === emailNormalized && data.password === this.authPassword) {
                                foundAccount = data;
                            }
                        });

                        if (foundAccount) {
                            this.logicalUid = foundAccount.profileId;
                            localStorage.setItem('lebarochat_session', this.logicalUid);
                            await this.loadLogicalProfile();
                        } else {
                            throw new Error("Invalid email or password.");
                        }

                    } else {
                        // Custom Register Flow
                        // Check if email exists
                        const snap = await getDocs(this.accountsRef);
                        let emailExists = false;
                        snap.forEach(d => { if(d.data().email === emailNormalized) emailExists = true; });
                        
                        if(emailExists) throw new Error("Email already in use.");

                        // Generate UUID for Profile
                        const newProfileId = "user_" + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
                        
                        // Save Credentials
                        await setDoc(doc(this.accountsRef, newProfileId), {
                            email: emailNormalized,
                            password: this.authPassword, // Stored plain for custom implementation constraint
                            profileId: newProfileId
                        });

                        // Create Profile
                        const tag = Math.floor(1000 + Math.random() * 9000).toString();
                        const profile = {
                            uid: newProfileId,
                            displayName: this.authDisplayName.trim(),
                            avatar: this.authAvatar,
                            tag: tag,
                            bio: "Ready to chat on Le BaroChat™!",
                            joinedServers: [],
                            friends: []
                        };
                        await setDoc(doc(this.usersRef, newProfileId), profile);

                        this.logicalUid = newProfileId;
                        localStorage.setItem('lebarochat_session', this.logicalUid);
                        await this.loadLogicalProfile();
                    }
                } catch(e) {
                    this.showToast(e.message, true);
                    this.authLoading = false;
                }
            },

            async loadLogicalProfile() {
                if(!this.logicalUid) return;
                
                // Realtime listener for our profile
                onSnapshot(doc(this.usersRef, this.logicalUid), (docSnap) => {
                    if (docSnap.exists()) {
                        this.currentUserProfile = docSnap.data();
                        if (!this.currentUserProfile.joinedServers) this.currentUserProfile.joinedServers = [];
                        if (!this.currentUserProfile.friends) this.currentUserProfile.friends = [];
                        this.cacheUser(this.currentUserProfile);
                        
                        if(!this.isReady) {
                            this.startGlobalListeners();
                            this.isReady = true;
                            this.authLoading = false;
                            
                            // Process pending join
                            if (this._pendingJoinId) {
                                this.joinServer(this._pendingJoinId);
                                this._pendingJoinId = null;
                            }
                            
                            // Presence Heartbeat
                            this.updatePresence();
                            this.heartbeatInterval = setInterval(() => this.updatePresence(), 15000);
                        }
                    } else {
                        // Session invalid
                        localStorage.removeItem('lebarochat_session');
                        this.logicalUid = null;
                        this.authMode = 'login';
                        this.authLoading = false;
                        this.isReady = false;
                    }
                });
            },

            startGlobalListeners() {
                // Users Dictionary
                onSnapshot(this.usersRef, (snap) => snap.forEach(d => this.cacheUser(d.data())), (e) => console.error(e));
                
                // Servers
                onSnapshot(collection(this.db, `${this.publicDataPath}/servers`), (snap) => {
                    const s = []; snap.forEach(d => s.push({id: d.id, ...d.data()})); this.servers = s;
                }, (e) => console.error(e));
                
                // DMs (Filter client-side to satisfy constraints)
                onSnapshot(collection(this.db, `${this.publicDataPath}/dms`), (snap) => {
                    const ds = []; 
                    snap.forEach(d => {
                        const data = d.data();
                        if (data.participants && data.participants.includes(this.logicalUid)) {
                            ds.push({ id: d.id, partnerUid: data.participants.find(p => p !== this.logicalUid) });
                        }
                    });
                    this.dms = ds;
                }, (e) => console.error(e));

                // Messages
                onSnapshot(collection(this.db, `${this.publicDataPath}/messages`), (snap) => {
                    const m = []; snap.forEach(d => m.push({id: d.id, ...d.data()}));
                    this.messages = m; this.filterMessages();
                }, (e) => console.error(e));

                // Presence tracking (only users active in last 60s)
                onSnapshot(collection(this.db, `${this.publicDataPath}/presence`), (snap) => {
                    const pres = [];
                    const now = Date.now();
                    snap.forEach(d => {
                        const data = d.data();
                        if (now - data.lastActive < 60000 && data.status === 'online') {
                            pres.push(data);
                            // WebRTC discovery (Initiator)
                            if (this.inVoiceRoom && data.currentVoice === this.inVoiceRoom && data.uid !== this.logicalUid && !this.simplePeers[data.uid]) {
                                // Deterministic initiator: The UID that is alphabetically smaller initiates
                                this.createPeer(data.uid, this.logicalUid < data.uid);
                            }
                        }
                    });
                    this.globalPresence = pres;
                    
                    if(this.inVoiceRoom) {
                        const currentVoiceUsers = pres.filter(p => p.currentVoice === this.inVoiceRoom).map(p => p.uid);
                        Object.keys(this.simplePeers).forEach(uid => {
                            if (!currentVoiceUsers.includes(uid)) this.removePeer(uid);
                        });
                    }
                });

                // WebRTC Signaling
                onSnapshot(collection(this.db, `${this.publicDataPath}/signaling`), (snap) => {
                    snap.docChanges().forEach(change => {
                        if (change.type === 'added') {
                            const data = change.doc.data();
                            if (data.to === this.logicalUid && data.room === this.inVoiceRoom) {
                                this.handleIncomingSignal(data.from, data.signal);
                                deleteDoc(change.doc.ref); 
                            }
                        }
                    });
                });
            },

            updatePresence() {
                if(!this.logicalUid) return;
                setDoc(doc(this.db, `${this.publicDataPath}/presence`, this.logicalUid), {
                    uid: this.logicalUid,
                    status: 'online',
                    currentServer: this.activeView === 'server' ? this.activeTarget : null,
                    currentVoice: this.inVoiceRoom,
                    lastActive: Date.now()
                }, { merge: true });
            },

            showToast(msg, isError = false) {
                this.toast.message = msg; this.toast.isError = isError; this.toast.show = true;
                if(this.toast.timeout) clearTimeout(this.toast.timeout);
                this.toast.timeout = setTimeout(() => { this.toast.show = false; }, 4000);
            },

            copyToClipboard(text) {
                try {
                    const el = document.getElementById('hiddenCopyTextarea');
                    el.value = text; el.select(); document.execCommand('copy');
                    this.showToast("Copied to clipboard!");
                } catch(e) { this.showToast("Failed to copy.", true); }
            },

            copyInviteLink() {
                if (!this.activeTarget) return;
                const url = window.location.href.split('?')[0] + '?join=' + this.activeTarget;
                this.copyToClipboard(url);
            },

            filterMessages() {
                if (!this.currentChatId) { this.filteredMessages = []; return; }
                this.filteredMessages = this.messages
                    .filter(m => m.roomId === this.currentChatId)
                    .sort((a, b) => a.timestamp - b.timestamp); // Chronological Order
            },

            cacheUser(data) { if(data && data.uid) this.users[data.uid] = data; },
            getUser(uid) { return this.users[uid] || { displayName: 'Loading...', avatar: svgPerson, tag: '0000' }; },
            getServer() { return this.servers.find(s => s.id === this.activeTarget); },
            getChannelName(cid) {
                const s = this.getServer(); if(!s || !s.channels) return '';
                const c = s.channels.find(ch => ch.id === cid); return c ? c.name : '';
            },

            isUserOnline(uid) {
                return this.globalPresence.some(p => p.uid === uid);
            },
            getServerMembers(status) {
                // Returns members of current server filtered by status ('online' or 'offline')
                if(!this.activeTarget || this.activeView !== 'server') return [];
                const s = this.getServer();
                if(!s) return [];
                
                // Get all users who have this server in their joinedServers list
                const members = Object.values(this.users).filter(u => u.joinedServers && u.joinedServers.includes(this.activeTarget));
                
                if (status === 'online') {
                    return members.filter(m => this.isUserOnline(m.uid));
                } else {
                    return members.filter(m => !this.isUserOnline(m.uid));
                }
            },
            getVoiceUsers(channelId) {
                return this.globalPresence.filter(p => p.currentVoice === channelId);
            },

            openHome() {
                this.activeView = 'home'; this.activeTarget = null; this.activeChannelId = null;
                this.viewingVoice = false; this.updatePresence();
            },
            openDiscovery() {
                this.activeView = 'discovery'; this.activeTarget = null; this.activeChannelId = null;
                this.viewingVoice = false; this.updatePresence();
            },
            openServer(id) {
                this.activeView = 'server'; this.activeTarget = id;
                const s = this.servers.find(server => server.id === id);
                if (s && s.channels) {
                    const texts = s.channels.filter(c => c.type === 'text');
                    this.activeChannelId = texts.length > 0 ? texts[0].id : null;
                }
                // If they are in a voice room in THIS server, keep viewingVoice state, else false
                const voiceChannels = s?.channels?.filter(c => c.type === 'voice').map(c=>c.id) || [];
                if(!voiceChannels.includes(this.inVoiceRoom)) {
                    this.viewingVoice = false;
                }
                this.updatePresence();
            },

            // DMs and Friends
            getDmPartner(dmId) { const dm = this.dms.find(d => d.id === dmId); return dm ? dm.partnerUid : null; },
            openDM(id) {
                this.activeView = 'home'; this.activeTarget = id; this.activeChannelId = null;
                this.viewingVoice = false;
            },
            async initiateDM(targetUid) {
                if (targetUid === this.logicalUid) return;
                const sorted = [this.logicalUid, targetUid].sort();
                const dmId = sorted.join('_');
                const dmRef = doc(this.db, `${this.publicDataPath}/dms`, dmId);
                const dmSnap = await getDoc(dmRef);
                if (!dmSnap.exists()) {
                    await setDoc(dmRef, { participants: sorted });
                }
                this.showProfilePopout = false;
                this.openDM(dmId);
            },
            
            isFriend(uid) {
                return this.currentUserProfile?.friends?.includes(uid);
            },
            async addFriend(uid) {
                if(uid === this.logicalUid || this.isFriend(uid)) return;
                const newFriends = [...(this.currentUserProfile.friends || []), uid];
                await updateDoc(doc(this.usersRef, this.logicalUid), { friends: newFriends });
                this.showToast("Friend added!");
            },
            async removeFriend(uid) {
                const newFriends = (this.currentUserProfile.friends || []).filter(id => id !== uid);
                await updateDoc(doc(this.usersRef, this.logicalUid), { friends: newFriends });
                this.showToast("Friend removed.");
            },

            openProfilePopout(uid) {
                this.popoutUser = this.getUser(uid);
                if(this.popoutUser) this.showProfilePopout = true;
            },

            getChatPlaceholder() {
                if (this.activeView === 'home') return `Message @${this.getUser(this.getDmPartner(this.activeTarget))?.displayName || 'User'}`;
                return `Message #${this.getChannelName(this.activeChannelId) || 'channel'}`;
            },

            async sendMessage() {
                if (!this.currentChatId || (!this.newMessage.trim() && !this.pendingImage)) return;
                const payload = { roomId: this.currentChatId, senderId: this.logicalUid, text: this.newMessage.trim(), image: this.pendingImage, timestamp: Date.now() };
                this.newMessage = ''; this.pendingImage = null;
                await addDoc(collection(this.db, `${this.publicDataPath}/messages`), payload);
            },

            async createServer() {
                if(!this.newServerName.trim()) return;
                const newServerRef = doc(collection(this.db, `${this.publicDataPath}/servers`));
                const payload = {
                    name: this.newServerName.trim(),
                    icon: this.newServerIcon,
                    owner: this.logicalUid,
                    isPublic: false,
                    channels: [
                        { id: 'c1_' + Date.now(), name: 'general', type: 'text' },
                        { id: 'c2_' + Date.now(), name: 'General Voice', type: 'voice' }
                    ]
                };
                await setDoc(newServerRef, payload);
                
                // Join it
                const joined = [...(this.currentUserProfile.joinedServers || []), newServerRef.id];
                await updateDoc(doc(this.usersRef, this.logicalUid), { joinedServers: joined });
                
                this.showCreateServerModal = false;
                this.openServer(newServerRef.id);
            },

            async joinServer(serverId) {
                if(this.currentUserProfile?.joinedServers?.includes(serverId)) {
                    this.openServer(serverId);
                    return;
                }
                const joined = [...(this.currentUserProfile.joinedServers || []), serverId];
                await updateDoc(doc(this.usersRef, this.logicalUid), { joinedServers: joined });
                this.showToast("Joined Server!");
                this.openServer(serverId);
            },

            async leaveServer() {
                if(!this.activeTarget || this.activeView !== 'server') return;
                const joined = (this.currentUserProfile.joinedServers || []).filter(id => id !== this.activeTarget);
                await updateDoc(doc(this.usersRef, this.logicalUid), { joinedServers: joined });
                this.openHome();
            },

            openServerSettingsModal(tab = 'overview') {
                const s = this.getServer();
                if(!s) return;
                this.editServer = JSON.parse(JSON.stringify(s)); // Deep clone
                if(!this.editServer.channels) this.editServer.channels = [];
                this.serverSettingsTab = tab;
                this.showServerSettingsModal = true;
            },

            async saveServerSettings() {
                await updateDoc(doc(this.db, `${this.publicDataPath}/servers`, this.editServer.id), {
                    name: this.editServer.name,
                    icon: this.editServer.icon,
                    isPublic: this.editServer.isPublic,
                    channels: this.editServer.channels
                });
                this.showToast("Server updated.");
            },

            async addChannel() {
                if(!this.newChannelName.trim()) return;
                const newId = 'c_' + Date.now() + Math.random().toString(36).substr(2, 5);
                this.editServer.channels.push({ id: newId, name: this.newChannelName.trim().toLowerCase().replace(/\s+/g, '-'), type: this.newChannelType });
                this.newChannelName = '';
                await this.saveServerSettings();
            },
            
            async removeChannel(cid) {
                this.editServer.channels = this.editServer.channels.filter(c => c.id !== cid);
                await this.saveServerSettings();
            },

            openSettingsModal() {
                this.editProfile = JSON.parse(JSON.stringify(this.currentUserProfile));
                this.showSettingsModal = true;
            },

            async saveProfileSettings() {
                await updateDoc(doc(this.usersRef, this.logicalUid), {
                    displayName: this.editProfile.displayName,
                    bio: this.editProfile.bio,
                    avatar: this.editProfile.avatar
                });
                this.showSettingsModal = false;
                this.showToast("Profile updated.");
            },

            // Image Downsampling
            triggerImageUpload(context) {
                const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
                input.onchange = (e) => this.processImage(e.target.files[0], context); input.click();
            },
            processImage(file, context) {
                if (!file) return; const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_W = context === 'chat' ? 800 : 256;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; } } else { if (h > MAX_W) { w *= MAX_W / h; h = MAX_W; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        
                        if (context === 'chat') this.pendingImage = dataUrl;
                        else if (context === 'setup') this.authAvatar = dataUrl;
                        else if (context === 'edit') this.editProfile.avatar = dataUrl;
                        else if (context === 'server') this.newServerIcon = dataUrl;
                        else if (context === 'serverEdit') this.editServer.icon = dataUrl;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            formatTime(ts) { return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); },

            handleVoiceChannelClick(channelId) {
                if (this.inVoiceRoom === channelId) {
                    this.viewingVoice = !this.viewingVoice; // Toggle Video Grid View
                } else {
                    this.joinVoiceRoom(channelId);
                }
            },

            async joinVoiceRoom(channelId) {
                if (this.inVoiceRoom) this.leaveVoiceRoom();
                try {
                    // Create dummy stream for immediate connection logic
                    const canvas = document.createElement('canvas'); canvas.width = 1; canvas.height = 1;
                    const dummyVideo = canvas.captureStream().getVideoTracks()[0];
                    const dummyAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const dummyAudio = dummyAudioCtx.createMediaStreamDestination().stream.getAudioTracks()[0];
                    this.localStream = new MediaStream([dummyVideo, dummyAudio]);
                    
                    this.inVoiceRoom = channelId;
                    this.rtcVideoOff = true;
                    this.isScreenSharing = false;
                    this.viewingVoice = true; // Switch to grid view
                    
                    this.updatePresence();

                    // Request real Microphone
                    navigator.mediaDevices.getUserMedia({ video: false, audio: true }).then(stream => {
                        const micTrack = stream.getAudioTracks()[0];
                        this.localStream.removeTrack(this.localStream.getAudioTracks()[0]);
                        this.localStream.addTrack(micTrack);
                        Object.values(this.simplePeers).forEach(p => p.replaceTrack(dummyAudio, micTrack, this.localStream));
                    }).catch(() => this.showToast("Mic access denied.", true));

                    setTimeout(() => {
                        const localVid = document.getElementById('local-video');
                        if (localVid) localVid.srcObject = this.localStream;
                    }, 500);
                    
                } catch(e) { this.showToast("Failed to initialize voice.", true); }
            },

            leaveVoiceRoom() {
                if (this.localStream) this.localStream.getTracks().forEach(t => t.stop());
                if (this.screenStream) this.screenStream.getTracks().forEach(t => t.stop());
                
                Object.values(this.simplePeers).forEach(p => p.destroy());
                this.simplePeers = {}; this.voicePeers = {}; 
                
                // Cleanup remote videos safely
                const grid = document.getElementById('fullscreen-video-grid');
                if(grid) {
                    Array.from(grid.children).forEach(child => {
                        if(child.id !== 'local-video' && !child.id.includes('local-video')) child.remove();
                    });
                }
                
                this.inVoiceRoom = null; this.localStream = null; this.screenStream = null;
                this.viewingVoice = false;
                this.updatePresence();
            },

            async rtcToggleVideo() {
                if (!this.localStream || this.isScreenSharing) return;
                
                if (this.rtcVideoOff) {
                    try {
                        const vidStream = await navigator.mediaDevices.getUserMedia({ video: true });
                        const vidTrack = vidStream.getVideoTracks()[0];
                        const oldTrack = this.localStream.getVideoTracks()[0];
                        
                        this.localStream.removeTrack(oldTrack);
                        this.localStream.addTrack(vidTrack);
                        Object.values(this.simplePeers).forEach(p => p.replaceTrack(oldTrack, vidTrack, this.localStream));
                        
                        this.rtcVideoOff = false;
                        this.viewingVoice = true; // Ensure they see the grid
                    } catch(e) { this.showToast("Camera access denied.", true); }
                } else {
                    const vidTrack = this.localStream.getVideoTracks()[0];
                    if (vidTrack) {
                        vidTrack.stop();
                        const canvas = document.createElement('canvas'); canvas.width = 1; canvas.height = 1;
                        const dummyVideo = canvas.captureStream().getVideoTracks()[0];
                        this.localStream.removeTrack(vidTrack);
                        this.localStream.addTrack(dummyVideo);
                        Object.values(this.simplePeers).forEach(p => p.replaceTrack(vidTrack, dummyVideo, this.localStream));
                        this.rtcVideoOff = true;
                    }
                }
            },

            async rtcToggleScreenShare() {
                if (!this.localStream) return;

                if (!this.isScreenSharing) {
                    try {
                        this.screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                        const screenTrack = this.screenStream.getVideoTracks()[0];
                        const oldTrack = this.localStream.getVideoTracks()[0];

                        this.localStream.removeTrack(oldTrack);
                        this.localStream.addTrack(screenTrack);
                        Object.values(this.simplePeers).forEach(p => p.replaceTrack(oldTrack, screenTrack, this.localStream));

                        this.isScreenSharing = true;
                        this.rtcVideoOff = true; // Visually disable camera button
                        this.viewingVoice = true;

                        screenTrack.onended = () => { this.rtcToggleScreenShare(); };
                        const localVid = document.getElementById('local-video');
                        if (localVid) localVid.srcObject = this.screenStream;

                    } catch(e) { this.showToast("Screen share cancelled.", true); }
                } else {
                    if (this.screenStream) this.screenStream.getTracks().forEach(t => t.stop());
                    this.screenStream = null;
                    this.isScreenSharing = false;
                    
                    const oldTrack = this.localStream.getVideoTracks()[0];
                    const canvas = document.createElement('canvas'); canvas.width = 1; canvas.height = 1;
                    const dummyVideo = canvas.captureStream().getVideoTracks()[0];
                    this.localStream.removeTrack(oldTrack);
                    this.localStream.addTrack(dummyVideo);
                    Object.values(this.simplePeers).forEach(p => p.replaceTrack(oldTrack, dummyVideo, this.localStream));
                    
                    const localVid = document.getElementById('local-video');
                    if (localVid) localVid.srcObject = this.localStream;
                }
            },

            createPeer(targetUid, initiator) {
                const peer = new SimplePeer({
                    initiator: initiator, trickle: true, stream: this.localStream,
                    config: {
                        iceServers: [
                            { urls: 'stun:openrelay.metered.ca:80' },
                            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                        ]
                    }
                });

                peer.on('signal', data => {
                    addDoc(collection(this.db, `${this.publicDataPath}/signaling`), {
                        to: targetUid, from: this.logicalUid, room: this.inVoiceRoom, signal: JSON.stringify(data)
                    });
                });
                
                peer.on('error', err => { this.removePeer(targetUid); });
                peer.on('close', () => { this.removePeer(targetUid); });

                peer.on('stream', stream => {
                    this.voicePeers[targetUid] = true;
                    setTimeout(() => {
                        const grid = document.getElementById('fullscreen-video-grid');
                        if(!grid) return;
                        let wrapper = document.getElementById(`vid_wrap_${targetUid}`);
                        if (!wrapper) {
                            wrapper = document.createElement('div');
                            wrapper.id = `vid_wrap_${targetUid}`;
                            wrapper.className = "relative rounded-lg overflow-hidden bg-[#1e1f22] flex items-center justify-center border border-[#2b2d31]";
                            
                            const v = document.createElement('video');
                            v.id = `vid_${targetUid}`; v.autoplay = true; v.playsInline = true; v.className = "w-full h-full object-cover";
                            
                            const overlay = document.createElement('div');
                            overlay.className = "absolute bottom-3 left-3 bg-black/60 px-2.5 py-1.5 rounded text-[13px] text-white font-bold backdrop-blur-sm";
                            overlay.innerText = this.getUser(targetUid).displayName;
                            
                            wrapper.appendChild(v); wrapper.appendChild(overlay); grid.appendChild(wrapper);
                        }
                        document.getElementById(`vid_${targetUid}`).srcObject = stream;
                    }, 200);
                });

                this.simplePeers[targetUid] = peer;
            },

            handleIncomingSignal(fromUid, signalStr) {
                if (!this.inVoiceRoom) return;
                let peer = this.simplePeers[fromUid];
                if (!peer) { this.createPeer(fromUid, false); peer = this.simplePeers[fromUid]; }
                peer.signal(JSON.parse(signalStr));
            },

            removePeer(uid) {
                if (this.simplePeers[uid]) { this.simplePeers[uid].destroy(); delete this.simplePeers[uid]; }
                const v = document.getElementById(`vid_wrap_${uid}`); if (v) v.remove();
            }
        });

        Alpine.data('nexusApp', window.nexusApp);
        Alpine.start();
    </script>
</body>
</html>
