<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le BaroChat™</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Polyfills Required for simple-peer in modern browsers -->
    <script>
        window.global = window;
        var process = { env: { DEBUG: undefined }, browser: true };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #1e1f22; color: #dbdee1; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2b2d31; }

        .discord-input { background-color: #1e1f22; color: #dbdee1; border: none; border-radius: 3px; padding: 10px; width: 100%; outline: none; }
        .discord-input:focus { background-color: #1e1f22; }
        .discord-btn { background-color: #5865F2; color: white; border-radius: 3px; padding: 10px 16px; font-weight: 500; transition: background-color 0.2s; }
        .discord-btn:hover { background-color: #4752C4; }
        
        .message-group { margin-top: 1.0625rem; }
        .message-content p { margin: 0; line-height: 1.375rem; word-wrap: break-word; }
        
        /* WebRTC Grid Formatting */
        .video-grid-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 1rem;
            width: 100%;
            height: 100%;
            padding: 1rem;
        }
        
        .video-tile {
            position: relative;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            flex: 1 1 calc(33.333% - 1rem); /* Base sizing */
            max-width: calc(50% - 0.5rem);  /* Don't let 3rd item stretch full width */
            max-height: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* If there's only 1 item, let it be big */
        .video-grid-container:has(> :nth-child(1):last-child) .video-tile {
            flex: 1 1 100%;
            max-width: 100%;
        }

        /* If there are 2 items */
        .video-grid-container:has(> :nth-child(2):last-child) .video-tile {
            flex: 1 1 calc(50% - 0.5rem);
            max-width: calc(50% - 0.5rem);
        }

        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Prevents squishing/stretching */
            background-color: #000;
        }

        .video-tile.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            z-index: 100;
            border-radius: 0;
        }

        .speaking-border { box-shadow: inset 0 0 0 3px #23a559; }
    </style>
</head>
<body class="h-screen w-screen flex antialiased select-none" x-data="nexusApp()">

    <!-- INITIAL LOADING SCREEN -->
    <div x-show="isConnecting" class="fixed inset-0 z-[100] bg-[#1e1f22] flex flex-col items-center justify-center">
        <i class="ph-fill ph-circle-notch animate-spin text-[#5865F2] text-6xl mb-4"></i>
        <h2 class="text-white text-xl font-bold">Connecting to Le BaroChat™...</h2>
        <p class="text-gray-400 text-sm mt-2">Establishing secure peer-to-peer connection</p>
    </div>

    <!-- ONBOARDING / LOGIN SCREEN -->
    <div x-show="!isConnecting && !hasSetupProfile" style="display: none;" class="fixed inset-0 z-[90] flex items-center justify-center bg-black/60 backdrop-blur-md p-4">
        <div class="bg-[#313338] rounded-xl shadow-2xl flex max-w-4xl w-full h-[600px] overflow-hidden relative">
            
            <!-- Left Side: Form -->
            <div class="w-1/2 p-8 flex flex-col justify-center border-r border-[#1e1f22] bg-[#313338] z-10 relative">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-white mb-2" x-text="onboardingMode === 'register' ? 'Create an Account' : 'Welcome Back!'"></h2>
                    <p class="text-gray-400 text-sm">Join Le BaroChat™ and connect with friends.</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-2">Username (Email format supported)</label>
                        <input type="text" x-model="setupData.email" @input="setupData.email = setupData.email.toLowerCase().replace(/\s/g, '')" class="discord-input" placeholder="e.g. @eric">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-2">Password</label>
                        <input type="password" x-model="setupData.password" class="discord-input" placeholder="••••••••">
                    </div>

                    <template x-if="onboardingMode === 'register'">
                        <div>
                            <div>
                                <label class="block text-[11px] font-bold text-gray-400 uppercase mb-2 mt-4">Display Name</label>
                                <input type="text" x-model="setupData.displayName" class="discord-input" placeholder="How should we call you?">
                            </div>
                            
                            <div class="mt-4">
                                <label class="block text-[11px] font-bold text-gray-400 uppercase mb-2">Choose an Avatar</label>
                                <div class="flex gap-3 justify-center mb-3">
                                    <template x-for="pfp in defaultPfps">
                                        <img :src="pfp" @click="setupData.avatar = pfp" class="w-14 h-14 rounded-full cursor-pointer hover:scale-105 transition border-2" :class="setupData.avatar === pfp ? 'border-[#5865F2]' : 'border-transparent'">
                                    </template>
                                </div>
                                <div class="relative">
                                    <input type="file" accept="image/*" @change="handleFileUpload($event, 'setupAvatar')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                    <div class="discord-input text-center text-sm text-[#5865F2] hover:underline cursor-pointer bg-[#2b2d31]">Or upload custom image...</div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <button @click="processAuth()" class="discord-btn w-full mt-6" :disabled="isProcessingAuth">
                        <span x-show="!isProcessingAuth" x-text="onboardingMode === 'register' ? 'Register' : 'Log In'"></span>
                        <i x-show="isProcessingAuth" class="ph-fill ph-circle-notch animate-spin"></i>
                    </button>
                    
                    <div class="text-sm text-gray-400 mt-4 text-center">
                        <span x-text="onboardingMode === 'register' ? 'Already have an account?' : 'Need an account?'"></span>
                        <button @click="onboardingMode = onboardingMode === 'register' ? 'login' : 'register'; errorMsg=''" class="text-[#00A8FC] hover:underline ml-1" x-text="onboardingMode === 'register' ? 'Log In' : 'Register'"></button>
                    </div>
                    <div x-show="errorMsg" class="text-red-400 text-sm mt-2 text-center" x-text="errorMsg"></div>
                </div>
            </div>

            <!-- Right Side: Preview (Only on Register) -->
            <div class="w-1/2 bg-[#2b2d31] p-8 flex flex-col items-center justify-center relative">
                <template x-if="onboardingMode === 'register'">
                    <div class="w-full max-w-[300px]">
                        <h3 class="text-xs font-bold text-gray-400 uppercase text-center mb-4">Live Profile Preview</h3>
                        <!-- Profile Card -->
                        <div class="bg-[#111214] rounded-lg shadow-xl overflow-hidden relative">
                            <!-- Banner -->
                            <div class="h-24 bg-[#5865F2] w-full" :style="setupData.banner ? `background-image: url(${setupData.banner}); background-size: cover; background-position: center;` : ''">
                                <div class="absolute top-2 right-2 relative group cursor-pointer z-20">
                                    <input type="file" accept="image/*" @change="handleFileUpload($event, 'setupBanner')" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-30">
                                    <div class="bg-black/50 p-1.5 rounded-full opacity-0 group-hover:opacity-100 transition"><i class="ph ph-pencil-simple text-white text-xs"></i></div>
                                </div>
                            </div>
                            <!-- Content -->
                            <div class="px-4 pb-4 relative z-10">
                                <!-- Avatar overlaps banner using negative margin -->
                                <div class="w-20 h-20 rounded-full border-4 border-[#111214] bg-[#313338] -mt-10 relative inline-block">
                                    <img :src="setupData.avatar || defaultPfps[0]" class="w-full h-full rounded-full object-cover">
                                </div>
                                
                                <div class="mt-2 bg-[#111214]">
                                    <h2 class="text-xl font-bold text-white leading-none truncate" x-text="setupData.displayName || 'Display Name'"></h2>
                                    <p class="text-sm text-gray-400 mt-1 truncate" x-text="setupData.email ? setupData.email : '@username'"></p>
                                </div>

                                <div class="mt-4 pt-4 border-t border-[#1e1f22]">
                                    <h3 class="text-[11px] font-bold text-gray-400 uppercase mb-1">About Me</h3>
                                    <p class="text-sm text-gray-300 line-clamp-3">Ready to chat on Le BaroChat™!</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                <template x-if="onboardingMode === 'login'">
                    <div class="text-center opacity-50">
                        <i class="ph-fill ph-lock-key text-6xl text-gray-500 mb-4"></i>
                        <p class="text-lg font-medium text-gray-400">Log in to restore your session</p>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- MAIN APP STRUCTURE -->
    <template x-if="!isConnecting && hasSetupProfile">
        <div class="flex h-full w-full">
            
            <!-- FAR LEFT: Server Navigation Sidebar -->
            <div class="w-[72px] bg-[#1e1f22] shrink-0 flex flex-col items-center py-3 gap-2 overflow-y-auto z-20">
                <!-- Home Button -->
                <div @click="openHome()" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all duration-200 flex items-center justify-center cursor-pointer group relative" :class="currentView === 'home' || currentView === 'dm' ? 'bg-[#5865F2] text-white rounded-[16px]' : 'bg-[#313338] text-gray-200 hover:bg-[#5865F2] hover:text-white'">
                    <i class="ph-fill ph-house text-2xl"></i>
                    <!-- Active Indicator -->
                    <div class="absolute -left-3 w-2 bg-white rounded-r-md transition-all duration-200" :class="currentView === 'home' || currentView === 'dm' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                </div>

                <div class="w-8 h-[2px] bg-[#313338] rounded-full mx-auto my-1"></div>

                <!-- Server List -->
                <template x-for="server in servers" :key="server.id">
                    <div @click="openServer(server.id)" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all duration-200 flex items-center justify-center cursor-pointer group relative bg-[#313338] overflow-hidden" :class="currentServerId === server.id && currentView === 'server' ? 'rounded-[16px]' : ''">
                        <template x-if="server.icon">
                            <img :src="server.icon" class="w-full h-full object-cover">
                        </template>
                        <template x-if="!server.icon">
                            <span class="text-gray-200 font-medium text-sm group-hover:text-white transition" x-text="server.name.charAt(0).toUpperCase()"></span>
                        </template>
                        
                        <div class="absolute -left-3 w-2 bg-white rounded-r-md transition-all duration-200" :class="currentServerId === server.id && currentView === 'server' ? 'h-10' : 'h-0 group-hover:h-5'"></div>
                    </div>
                </template>

                <!-- Create Server Button -->
                <div @click="showCreateServerModal = true" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-[#23a559] hover:bg-[#23a559] hover:text-white transition-all duration-200 flex items-center justify-center cursor-pointer group relative mt-2">
                    <i class="ph ph-plus text-2xl"></i>
                </div>
                
                <!-- Discover Servers Button -->
                <div @click="openHome('discovery')" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] text-[#23a559] hover:bg-[#23a559] hover:text-white transition-all duration-200 flex items-center justify-center cursor-pointer group relative">
                    <i class="ph-fill ph-compass text-2xl"></i>
                </div>
            </div>

            <!-- SECONDARY SIDEBAR: Channels / DMs -->
            <div class="w-60 bg-[#2b2d31] shrink-0 flex flex-col z-10 relative">
                
                <!-- HOME View Sidebar Header -->
                <template x-if="currentView === 'home' || currentView === 'dm'">
                    <div class="h-12 border-b border-[#1f2023] flex items-center px-4 shadow-sm relative">
                        <input type="text" x-model="friendSearch" placeholder="Find or start a conversation" class="w-full bg-[#1e1f22] text-xs text-gray-300 rounded px-2 py-1.5 outline-none placeholder-gray-500">
                    </div>
                </template>

                <!-- SERVER View Sidebar Header -->
                <template x-if="currentView === 'server'">
                    <div class="h-12 border-b border-[#1f2023] flex items-center justify-between px-4 shadow-sm hover:bg-[#35373c] cursor-pointer transition relative group" @click="showServerDropdown = !showServerDropdown" @click.away="showServerDropdown = false">
                        <h2 class="font-bold text-white text-[15px] truncate" x-text="getServerName()"></h2>
                        <i class="ph ph-caret-down text-gray-400 group-hover:text-white transition"></i>
                        
                        <!-- Server Context Menu -->
                        <div x-show="showServerDropdown" style="display: none;" class="absolute top-14 left-2 right-2 bg-[#111214] rounded-md shadow-lg border border-[#1e1f22] p-2 z-50">
                            <button @click.stop="copyInviteLink()" class="w-full text-left px-2 py-1.5 rounded text-sm text-[#5865F2] hover:bg-[#5865F2] hover:text-white transition flex items-center justify-between mb-1">
                                <span>Invite People</span>
                                <i class="ph ph-user-plus"></i>
                            </button>
                            <template x-if="isServerOwner()">
                                <button @click.stop="openServerSettings(currentServerId)" class="w-full text-left px-2 py-1.5 rounded text-sm text-gray-300 hover:bg-[#5865F2] hover:text-white transition flex items-center justify-between">
                                    <span>Server Settings</span>
                                    <i class="ph ph-gear"></i>
                                </button>
                            </template>
                            <div class="h-[1px] bg-[#2b2d31] my-1 mx-1"></div>
                            <button @click.stop="leaveServer()" class="w-full text-left px-2 py-1.5 rounded text-sm text-red-400 hover:bg-red-500 hover:text-white transition flex items-center justify-between">
                                <span>Leave Server</span>
                                <i class="ph ph-sign-out"></i>
                            </button>
                        </div>
                    </div>
                </template>

                <!-- Sidebar Content Scroll Area -->
                <div class="flex-1 overflow-y-auto p-2 custom-scrollbar">
                    
                    <!-- HOME View Content (Friends & DMs) -->
                    <template x-if="currentView === 'home' || currentView === 'dm'">
                        <div>
                            <button @click="openHome('friends')" class="w-full flex items-center px-2 py-2 rounded-md transition mb-4 group" :class="currentView === 'home' && homeTab === 'friends' ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                <i class="ph-fill ph-users text-xl mr-3"></i>
                                <span class="font-medium text-[15px]">Friends</span>
                                <template x-if="pendingRequests.length > 0">
                                    <span class="ml-auto bg-red-500 text-white text-[10px] font-bold px-1.5 rounded-full" x-text="pendingRequests.length"></span>
                                </template>
                            </button>

                            <h3 class="text-xs font-bold text-gray-400 hover:text-gray-300 uppercase px-2 mb-1 flex justify-between items-center group cursor-pointer">
                                <span>Direct Messages</span>
                                <i class="ph ph-plus cursor-pointer"></i>
                            </h3>
                            
                            <template x-for="dm in dms" :key="dm.id">
                                <div @click="openDm(dm.userId)" class="group flex items-center px-2 py-1.5 rounded-md cursor-pointer transition relative" :class="currentDmUserId === dm.userId && currentView === 'dm' ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                    <div class="relative mr-3 shrink-0">
                                        <img :src="getUser(dm.userId).avatar" class="w-8 h-8 rounded-full object-cover">
                                        <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-[#2b2d31] rounded-full flex items-center justify-center">
                                            <div class="w-2.5 h-2.5 rounded-full" :class="isUserOnline(dm.userId) ? 'bg-[#23a559]' : 'bg-gray-500'"></div>
                                        </div>
                                    </div>
                                    <span class="truncate font-medium text-[15px]" x-text="getUser(dm.userId).displayName"></span>
                                    
                                    <!-- Unread Badge -->
                                    <template x-if="dm.unread">
                                        <div class="ml-auto w-2 h-2 bg-red-500 rounded-full"></div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- SERVER View Content (Channels) -->
                    <template x-if="currentView === 'server'">
                        <div class="space-y-4">
                            <!-- Text Channels -->
                            <div>
                                <h3 class="text-xs font-bold text-gray-400 hover:text-gray-300 uppercase px-1 mb-1 flex justify-between items-center group cursor-pointer">
                                    <span>Text Channels</span>
                                    <template x-if="isServerOwner()">
                                        <i class="ph ph-plus cursor-pointer opacity-0 group-hover:opacity-100" @click.stop="openServerSettings(currentServerId, 'channels')"></i>
                                    </template>
                                </h3>
                                <template x-for="channel in getTextChannels()" :key="channel.id">
                                    <div @click="openChannel(channel.id)" class="group flex items-center px-2 py-1.5 rounded-md cursor-pointer transition mb-0.5" :class="currentChannelId === channel.id && !currentVoiceChannelId ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                        <i class="ph ph-hash text-xl mr-1.5 text-gray-400"></i>
                                        <span class="truncate font-medium text-[15px]" x-text="channel.name"></span>
                                    </div>
                                </template>
                            </div>

                            <!-- Voice Channels -->
                            <div>
                                <h3 class="text-xs font-bold text-gray-400 hover:text-gray-300 uppercase px-1 mb-1 flex justify-between items-center group cursor-pointer mt-4">
                                    <span>Voice Channels</span>
                                    <template x-if="isServerOwner()">
                                        <i class="ph ph-plus cursor-pointer opacity-0 group-hover:opacity-100" @click.stop="openServerSettings(currentServerId, 'channels')"></i>
                                    </template>
                                </h3>
                                <template x-for="channel in getVoiceChannels()" :key="channel.id">
                                    <div>
                                        <div @click="joinVoiceChannel(channel.id)" class="group flex items-center px-2 py-1.5 rounded-md cursor-pointer transition mb-0.5" :class="currentVoiceChannelId === channel.id ? 'bg-[#3f4147] text-white' : 'text-gray-400 hover:bg-[#35373c] hover:text-gray-200'">
                                            <i class="ph-fill ph-speaker-high text-xl mr-1.5" :class="currentVoiceChannelId === channel.id ? 'text-white' : 'text-gray-400'"></i>
                                            <span class="truncate font-medium text-[15px]" x-text="channel.name"></span>
                                        </div>
                                        <!-- Users in this VC -->
                                        <div class="ml-6 flex flex-col gap-1 border-l border-[#3f4147] pl-2 mt-1 mb-2">
                                            <template x-for="uid in getVcParticipants(channel.id)" :key="uid">
                                                <div class="flex items-center gap-2 group/user cursor-pointer rounded px-1 py-0.5 hover:bg-[#35373c]" @click="openProfilePopout(uid, $event)">
                                                    <img :src="getUser(uid).avatar" class="w-6 h-6 rounded-full object-cover">
                                                    <span class="text-sm text-gray-300 truncate group-hover/user:text-white" x-text="getUser(uid).displayName"></span>
                                                    <!-- Optional: Add mic/camera icons here if we track states -->
                                                    <template x-if="vcCameraStates[uid]">
                                                        <i class="ph-fill ph-video-camera text-[#5865F2] ml-auto text-xs"></i>
                                                    </template>
                                                    <template x-if="vcScreenshareStates[uid]">
                                                        <i class="ph-bold ph-screencast text-[#5865F2] ml-auto text-xs"></i>
                                                    </template>
                                                </div>
                                            </template>
                                            <template x-if="currentVoiceChannelId === channel.id">
                                                <button @click="showVideoGrid = true" class="mt-1 flex items-center justify-center gap-1 w-full bg-[#1e1f22] hover:bg-[#111214] text-xs text-gray-300 py-1 rounded transition border border-[#1e1f22]">
                                                    <i class="ph-fill ph-video-camera"></i> Show Video Grid
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Bottom User Strip -->
                <div class="h-14 bg-[#232428] shrink-0 flex items-center px-2 z-20 mt-auto flex-col justify-end relative">
                    <!-- Voice Connection Info Bar (pops up above user strip) -->
                    <template x-if="currentVoiceChannelId">
                        <div class="absolute bottom-14 left-0 right-0 bg-[#2b2d31] border-t border-[#1f2023] p-2 shadow-lg flex flex-col gap-2 z-10">
                            <div class="flex items-center justify-between">
                                <div class="flex flex-col min-w-0 flex-1 cursor-pointer" @click="showVideoGrid = true; if(currentServerId) { currentView = 'server'; } else { currentView = 'dm'; }">
                                    <div class="flex items-center gap-1 text-[#23a559] font-bold text-xs truncate">
                                        <i class="ph-fill ph-check-circle"></i> VOICE CONNECTED
                                    </div>
                                    <div class="text-xs text-gray-400 truncate hover:underline" x-text="getVoiceChannelName() + (currentServerId ? ' / ' + getServerName() : '')"></div>
                                </div>
                                <button @click="leaveVoiceChannel()" class="w-8 h-8 rounded bg-[#1e1f22] hover:bg-red-500 text-red-500 hover:text-white flex items-center justify-center transition shrink-0 ml-2" title="Disconnect">
                                    <i class="ph-fill ph-phone-disconnect text-lg"></i>
                                </button>
                            </div>
                            <div class="flex items-center justify-between gap-2">
                                <button @click="toggleCamera()" class="flex-1 py-1 rounded transition flex justify-center items-center group relative" :class="isVideoEnabled ? 'bg-white hover:bg-gray-200' : 'bg-[#1e1f22] hover:bg-[#3f4147]'">
                                    <i class="text-lg" :class="isVideoEnabled ? 'ph-fill ph-video-camera text-black' : 'ph-fill ph-video-camera-slash text-gray-400 group-hover:text-white'"></i>
                                </button>
                                <button @click="toggleScreenShare()" class="flex-1 py-1 rounded transition flex justify-center items-center group relative" :class="isScreenSharing ? 'bg-[#5865F2] hover:bg-[#4752c4]' : 'bg-[#1e1f22] hover:bg-[#3f4147]'">
                                    <i class="text-lg" :class="isScreenSharing ? 'ph-bold ph-screencast text-white' : 'ph-bold ph-screencast text-gray-400 group-hover:text-white'"></i>
                                </button>
                            </div>
                        </div>
                    </template>

                    <div class="flex items-center w-full h-full py-1">
                        <div class="flex items-center rounded-md hover:bg-[#3f4147] px-1.5 py-1 transition cursor-pointer flex-1 min-w-0 group" @click="openSettings()">
                            <div class="relative shrink-0 mr-2">
                                <img :src="myProfile.avatar" class="w-8 h-8 rounded-full object-cover">

                            <div class="flex items-center gap-4">
                                <button @click="homeTab = 'online'" class="text-[15px] font-medium transition" :class="homeTab === 'online' ? 'text-white bg-[#3f4147] px-2 py-0.5 rounded' : 'text-gray-400 hover:text-gray-300 px-2 py-0.5'">Online</button>

                                </button>
                            </div>
                        </div>
                    </template>
                    <template x-if="currentView === 'server'">

                            <div class="ml-auto flex items-center gap-4">
                                <button class="text-gray-400 hover:text-gray-200 transition" @click="showRightPanel = !showRightPanel">
                                    <i class="ph-fill ph-users text-xl"></i>
                                </button>
                            </div>
                        </div>
                    </template>

                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

    <!-- CORE LOGIC MODULE -->
    <script type="module">
        import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/module.esm.js'
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc, deleteDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'le-barochat';
        // Mock config for init to pass locally if system variables missing
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "mock", projectId: "mock", authDomain: "mock", databaseURL: "mock" };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // V4: Completely fresh database namespace to fix UI logic cleanly
        const ISOLATION_PREFIX = '_isolated_discord_p2p_v4_'; 
        
        // Custom SVG Generators for high-quality PFPs
        function generateSVGPfp(type) {
            const wrap = (content) => `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">${content}</svg>`;
            const bgs = {
                'c': '<defs><linearGradient id="gC" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%235865F2"/><stop offset="100%" stop-color="%233b43a3"/></linearGradient></defs><rect width="100" height="100" fill="url(%23gC)"/>',
                'person': '<defs><linearGradient id="gP" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%2380848E"/><stop offset="100%" stop-color="%234E5058"/></linearGradient></defs><rect width="100" height="100" fill="url(%23gP)"/>',
                'pen': '<defs><linearGradient id="gPen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%232b2d31"/><stop offset="100%" stop-color="%231e1f22"/></linearGradient></defs><rect width="100" height="100" fill="url(%23gPen)"/>',
                'hat': '<defs><linearGradient id="gH" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%23DA373C"/><stop offset="100%" stop-color="%23a1282c"/></linearGradient></defs><rect width="100" height="100" fill="url(%23gH)"/>'
            };
            const icons = {
                'c': '<path d="M 70 30 C 55 15, 30 20, 25 45 C 20 70, 45 85, 70 70" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>',
                'person': '<circle cx="50" cy="40" r="18" fill="white"/><path d="M 20 90 Q 50 50 80 90" fill="white"/>',
                'pen': '<path d="M 50 20 L 70 50 L 55 80 L 45 80 L 30 50 Z" fill="%23FEE75C"/><circle cx="50" cy="55" r="5" fill="%232b2d31"/>',
                'hat': '<ellipse cx="50" cy="55" rx="40" ry="12" fill="%232b2d31"/><path d="M 35 55 L 40 30 C 45 25, 55 25, 60 30 L 65 55 Z" fill="%232b2d31"/>'
            };
            return wrap(bgs[type] + icons[type]);
        }

        window.nexusApp = function() {
            return {
                isConnecting: true,
                hasSetupProfile: false,
                onboardingMode: 'register',
                errorMsg: '',
                isProcessingAuth: false,
                
                logicalUid: null,
