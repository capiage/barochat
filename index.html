                init() {
                    const savedUid = localStorage.getItem('nexus_uid');
                    
                    signInAnonymously(auth).then(async (cred) => {
                        const anonUid = cred.user.uid;
                        
                        if (savedUid) {
                            // Verify login details exist in our logical DB
                            const docSnap = await getDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_logins`, savedUid));
                            if (docSnap.exists()) {
                                this.logicalUid = savedUid;
                                this.finishBoot();
                                return;
                            } else {
                                localStorage.removeItem('nexus_uid');
                            }
                        }
                        this.logicalUid = anonUid;
                        this.setupData.avatar = this.defaultPfps[0];
                        setTimeout(() => this.isConnecting = false, 500);
                    }).catch(e => {
                        console.error("Auth failed", e);
                        this.showToast("Connection failed. Strict network detected.", true);
                    });

                    // Watch hardware button states
                    this.$watch('isMuted', (val) => {
                        if(this.localMediaStream) {
                            this.localMediaStream.getAudioTracks().forEach(t => t.enabled = !val);
                        }
                    });
                    
                    // Favicon Notifications
                    this.$watch('dms', () => this.updateFavicon());
                },

                updateFavicon() {
                    let hasUnread = this.dms.some(d => d.unread);
                    let icon = document.querySelector("link[rel*='icon']") || document.createElement('link');
                    icon.type = 'image/x-icon';
                    icon.rel = 'shortcut icon';
                    // Fallback to generating a red dot if actual file missing
                    const canvas = document.createElement('canvas');
                    canvas.width = 32; canvas.height = 32;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#5865F2';
                    ctx.fillRect(0,0,32,32);
                    ctx.fillStyle = '#fff';
                    ctx.font = '24px Arial';
                    ctx.fillText('C', 7, 24);
                    if(hasUnread) {
                        ctx.fillStyle = '#DA373C';
                        ctx.beginPath();
                        ctx.arc(26, 6, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    icon.href = canvas.toDataURL();
                    document.getElementsByTagName('head')[0].appendChild(icon);
                },

                async processAuth() {
                    this.errorMsg = '';
                    if(!this.setupData.email || !this.setupData.password) {
                        this.errorMsg = "Please fill all fields."; return;
                    }

                    this.isProcessingAuth = true;
                    try {
                        const emailQueryStr = this.setupData.email;
                        
                        if(this.onboardingMode === 'register') {
                            if(!this.setupData.displayName) { this.errorMsg = "Display Name required."; this.isProcessingAuth = false; return; }
                            
                            // Check if username exists by reading the doc ID (we use email as doc ID for lookup)
                            const lookupDoc = await getDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_logins`, emailQueryStr));
                            if (lookupDoc.exists()) {
                                this.errorMsg = "Username/Email already taken."; this.isProcessingAuth = false; return;
                            }

                            // Create logical user profile mapped to original AnonUID
                            const newUid = this.logicalUid; 
                            await setDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_logins`, emailQueryStr), {
                                uid: newUid, password: this.setupData.password
                            });
                            
                            await setDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_users`, newUid), {
                                displayName: this.setupData.displayName,
                                email: emailQueryStr,
                                avatar: this.setupData.avatar,
                                banner: this.setupData.banner,
                                bio: '',
                                friends: [],
                                pendingFriends: [],
                                lastActive: Date.now()
                            });

                            localStorage.setItem('nexus_uid', newUid);
                            this.finishBoot();

                        } else {
                            // Login
                            const lookupDoc = await getDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_logins`, emailQueryStr));
                            if (!lookupDoc.exists()) {
                                this.errorMsg = "Account not found."; this.isProcessingAuth = false; return;
                            }
                            const accountData = lookupDoc.data();
                            if (accountData.password !== this.setupData.password) {
                                this.errorMsg = "Incorrect password."; this.isProcessingAuth = false; return;
                            }
                            
                            this.logicalUid = accountData.uid;
                            localStorage.setItem('nexus_uid', this.logicalUid);
                            this.finishBoot();
                        }
                    } catch(e) {
                        console.error(e);
                        this.errorMsg = "An error occurred.";
                        this.isProcessingAuth = false;
                    }
                },

                logout() {
                    localStorage.removeItem('nexus_uid');
                    location.reload();
                },

                async finishBoot() {
                    this.hasSetupProfile = true;
                    this.isConnecting = false;
                    
                    // Subscribe to global users directory
                    this.unsubUsers = onSnapshot(collection(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_users`), snap => {
                        let cache = {};
                        snap.forEach(d => {
                            cache[d.id] = { id: d.id, ...d.data() };
                            if(d.id === this.logicalUid) {
                                this.myProfile = cache[d.id];
                            }
                        });
                        this.allUsersCache = cache;
                        // Build DMs
                        this.buildDmsList();
                        
                        // Heartbeat
                        updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_users`, this.logicalUid), { lastActive: Date.now() }).catch(()=>{});
                    });

                    // Heartbeat interval
                    setInterval(() => {
                        if(this.logicalUid) updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_users`, this.logicalUid), { lastActive: Date.now() }).catch(()=>{});
                    }, 60000);

                    // Subscribe to Servers
                    this.unsubServers = onSnapshot(collection(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_servers`), snap => {
                        let sList = [];
                        snap.forEach(d => sList.push({ id: d.id, ...d.data() }));
                        // Only show servers we are in
                        this.servers = sList.filter(s => s.members?.includes(this.logicalUid));
                        
                        // Handle invite link auto-join
                        const urlParams = new URLSearchParams(window.location.search);
                        const inviteId = urlParams.get('join');
                        if (inviteId) {
                            const found = sList.find(s=>s.id === inviteId);
                            if(found && !found.members.includes(this.logicalUid)) {
                                this.joinServer(inviteId);
                            }
                            window.history.replaceState({}, document.title, window.location.pathname);
                        }

                        // Auto-select first server if none
                        if (!this.currentServerId && this.servers.length > 0 && this.currentView === 'server') {
                            this.openServer(this.servers[0].id);
                        }
                        
                        // Re-validate current server
                        if (this.currentServerId && !this.servers.find(s=>s.id === this.currentServerId)) {
                            this.openHome();
                        }
                    });
                },

                getUser(uid) {
                    return this.allUsersCache[uid] || { displayName: 'Unknown User', avatar: this.defaultPfps[1], email: '@unknown' };
                },

                isUserOnline(uid) {
                    const u = this.allUsersCache[uid];
                    return u && u.lastActive && (Date.now() - u.lastActive < 120000); // 2 mins
                },

                getOnlineServerMembers() {
                    if(!this.currentServerId) return [];
                    const s = this.servers.find(s => s.id === this.currentServerId);
                    if(!s) return [];
                    return s.members.filter(uid => this.isUserOnline(uid));
                },
                
                getOfflineServerMembers() {
                    if(!this.currentServerId) return [];
                    const s = this.servers.find(s => s.id === this.currentServerId);
                    if(!s) return [];
                    return s.members.filter(uid => !this.isUserOnline(uid));
                },

                getPendingFriends() {
                    return this.myProfile.pendingFriends || [];
                },
                
                getFilteredFriends(tab) {
                    let list = this.myProfile.friends || [];
                    if(tab === 'pending') return this.myProfile.pendingFriends || [];
                    if (this.friendSearch) {
                        list = list.filter(uid => {
                            const u = this.getUser(uid);
                            return u.displayName.toLowerCase().includes(this.friendSearch.toLowerCase()) || 
                                   (u.email && u.email.toLowerCase().includes(this.friendSearch.toLowerCase()));
                        });
                    }
                    if (tab === 'online') return list.filter(uid => this.isUserOnline(uid));
                    return list;
                },

                async sendFriendRequest(targetUid) {
                    if(targetUid === this.logicalUid) return;
                    if(this.myProfile.friends?.includes(targetUid)) { this.showToast("Already friends", true); return; }
                    
                    const targetData = this.getUser(targetUid);
                    let pending = targetData.pendingFriends || [];
                    if(!pending.includes(this.logicalUid)) pending.push(this.logicalUid);
                    await updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_users`, targetUid), { pendingFriends: pending });
                },

                async sendFriendRequestByEmail() {
                    this.addFriendMessage = '';
                    const search = this.addFriendInput.toLowerCase().trim();
                    if(!search) return;
                    
                    const target = Object.values(this.allUsersCache).find(u => u.email === search);
                    if(!target) {
                        this.addFriendSuccess = false; this.addFriendMessage = "Hm, didn't work. Double check that the username is correct."; return;
                    }
                    if(target.id === this.logicalUid) {
                        this.addFriendSuccess = false; this.addFriendMessage = "You cannot add yourself."; return;
                    }
                    if(this.myProfile.friends?.includes(target.id)) {
                        this.addFriendSuccess = false; this.addFriendMessage = "You are already friends."; return;
                    }
                    
                    await this.sendFriendRequest(target.id);
                    this.addFriendSuccess = true;
                    this.addFriendMessage = `Success! Your friend request to ${target.displayName} was sent.`;
                    this.addFriendInput = '';
                },

                async acceptFriendRequest(uid) {
                    // Add to my friends, remove from pending
                    let myFriends = this.myProfile.friends || [];
                    if(!myFriends.includes(uid)) myFriends.push(uid);
                    let myPending = this.myProfile.pendingFriends.filter(id => id !== uid);
                    await updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_users`, this.logicalUid), { friends: myFriends, pendingFriends: myPending });
                    
                    // Add me to their friends
                    const theirData = this.getUser(uid);
                    let theirFriends = theirData.friends || [];
                    if(!theirFriends.includes(this.logicalUid)) theirFriends.push(this.logicalUid);
                    await updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_users`, uid), { friends: theirFriends });
                },

                async declineFriendRequest(uid) {
                    let myPending = this.myProfile.pendingFriends.filter(id => id !== uid);
                    await updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_users`, this.logicalUid), { pendingFriends: myPending });
                },

                getPublicServers() {
                    let sList = [];
                    // Need to scan cache since 'servers' only holds joined
                    // We don't have a direct query, so we do a dirty hack for UI:
                    // Subscribe to all servers in background and filter.
                    // For single-file simplicity, we'll fetch them on demand.
                    return []; // Placeholder, implemented dynamically via openHome('discovery')
                },

                async loadPublicServers() {
                    const snap = await getDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_directory`, 'list'));
                    // Need proper collection query
                },

                openHome(tab = 'online') {
                    this.currentView = 'home';
                    this.homeTab = tab;
                    this.currentServerId = null;
                    this.currentChannelId = null;
                    this.currentDmUserId = null;
                    
                    // Leave VC if switching to home (unless we want background voice, but simpler to cut)
                    if(this.currentVoiceChannelId && !this.currentVoiceChannelId.includes('_dm_')) this.leaveVoiceChannel();
                },

                openServer(serverId) {
                    if (this.currentServerId === serverId && this.currentView === 'server') return;
                    this.currentView = 'server';
                    this.currentServerId = serverId;
                    this.currentDmUserId = null;
                    
                    // Disconnect DM voice if entering server
                    if(this.currentVoiceChannelId && this.currentVoiceChannelId.includes('_dm_')) this.leaveVoiceChannel();

                    const server = this.servers.find(s => s.id === serverId);
                    if (server && server.channels && server.channels.length > 0) {
                        const firstText = server.channels.find(c => c.type === 'text');
                        if (firstText) this.openChannel(firstText.id);
                    }
                },

                getRoutingId(uid1, uid2) {
                    return [uid1, uid2].sort().join('_');
                },

                buildDmsList() {
                    // Scan all message channels we are part of
                    // In a real app we'd use Firestore Queries, but we are isolated.
                    // Instead, we check friends list + anyone we've talked to
                    let dmList = [];
                    (this.myProfile.friends || []).forEach(fid => {
                        dmList.push({ userId: fid, lastRead: 0, unread: false, lastUpdate: 0 }); // basic structure
                    });
                    this.dms = dmList;
                    // Note: True notification badge tracking requires server-side read receipts.
                    // For this zero-build prototype, we'll just show friends list as DMs
                },

                openDm(userId) {
                    this.currentView = 'dm';
                    this.currentDmUserId = userId;
                    this.currentServerId = null;
                    
                    // Disconnect server voice if entering DM
                    if(this.currentVoiceChannelId && !this.currentVoiceChannelId.includes('_dm_')) this.leaveVoiceChannel();

                    const roomId = this.getRoutingId(this.logicalUid, userId);
                    this.openChannel(roomId, true);
                    
                    // Move to top (local visual hack)
                    this.dms = this.dms.sort((a,b) => a.userId === userId ? -1 : 1);
                },

                startDmCall() {
                    if(!this.currentDmUserId) return;
                    const roomId = this.getRoutingId(this.logicalUid, this.currentDmUserId) + '_vc';
                    this.joinVoiceChannel(roomId);
                    this.showVideoGrid = true;
                    // Ping the other user (visual text message)
                    this.sendMessage(`📞 Started a voice call. Join me!`);
                },

                openChannel(channelId, isDm = false) {
                    this.currentChannelId = channelId;
                    this.messages = [];
                    this.filteredMessages = [];
                    
                    if (this.unsubMessages) this.unsubMessages();
                    
                    const collPath = isDm ? `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_dms_${channelId}` : `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_msgs_${channelId}`;

                    this.unsubMessages = onSnapshot(collection(db, collPath), snap => {
                        let msgs = [];
                        snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
                        msgs.sort((a, b) => a.timestamp - b.timestamp);
                        this.messages = msgs;
                        this.groupMessages();
                        
                        // Auto-scroll
                        setTimeout(() => {
                            const el = document.getElementById('chat-messages');
                            if (el) el.scrollTop = el.scrollHeight;
                        }, 50);
                    });
                },

                groupMessages() {
                    let grouped = [];
                    for(let i=0; i<this.messages.length; i++) {
                        let msg = this.messages[i];
                        let prev = i > 0 ? this.messages[i-1] : null;
                        
                        let isFirst = true;
                        if(prev && prev.senderId === msg.senderId) {
                            let timeDiff = msg.timestamp - prev.timestamp;
                            if(timeDiff < 300000) { // 5 minutes
                                isFirst = false;
                            }
                        }
                        grouped.push({ ...msg, isFirstInGroup: isFirst });
                    }
                    this.filteredMessages = grouped;
                },

                async sendMessage() {
                    if (!this.newMessage.trim() && !this.imageToUpload) return;
                    
                    const collPath = this.currentView === 'dm' 
                        ? `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_dms_${this.currentChannelId}` 
                        : `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_msgs_${this.currentChannelId}`;
                    
                    await setDoc(doc(collection(db, collPath)), {
                        text: this.newMessage.trim() + (this.imageToUpload ? `<br><img src="${this.imageToUpload}" class="max-w-xs rounded-md mt-2">` : ''),
                        senderId: this.logicalUid,
                        timestamp: Date.now()
                    });
                    
                    this.newMessage = '';
                    this.imageToUpload = null;
                },

                async deleteMessage(msgId) {
                    const collPath = this.currentView === 'dm' ? `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_dms_${this.currentChannelId}` : `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_msgs_${this.currentChannelId}`;
                    await deleteDoc(doc(db, collPath, msgId));
                },

                async saveEditMessage() {
                    if(!this.editMsgId || !this.editMsgText.trim()) return;
                    const collPath = this.currentView === 'dm' ? `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_dms_${this.currentChannelId}` : `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_msgs_${this.currentChannelId}`;
                    await updateDoc(doc(db, collPath, this.editMsgId), {
                        text: this.editMsgText.trim(),
                        edited: true
                    });
                    this.editMsgId = null;
                },

                // ---- Autocomplete Mentions ----
                handleChatKeydown(e) {
                    if (this.showMentionsMenu) {
                        if (e.key === 'ArrowDown') { e.preventDefault(); this.mentionIndex = (this.mentionIndex + 1) % this.filteredMentionUsers.length; }
                        else if (e.key === 'ArrowUp') { e.preventDefault(); this.mentionIndex = (this.mentionIndex - 1 + this.filteredMentionUsers.length) % this.filteredMentionUsers.length; }
                        else if (e.key === 'Tab' || e.key === 'Enter') {
                            e.preventDefault();
                            if(this.filteredMentionUsers.length > 0) this.insertMention(this.filteredMentionUsers[this.mentionIndex]);
                        }
                        else if (e.key === 'Escape') { this.showMentionsMenu = false; }
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        this.sendMessage();
                    }
                },

                $watch: {
                    'newMessage': function(val) {
                        const lastWord = val.split(' ').pop();
                        if (lastWord.startsWith('@') && lastWord.length > 0) {
                            this.mentionSearch = lastWord.substring(1).toLowerCase();
                            let pool = this.currentView === 'server' ? this.servers.find(s=>s.id===this.currentServerId)?.members || [] : [this.currentDmUserId];
                            
                            this.filteredMentionUsers = pool.filter(uid => {
                                const u = this.getUser(uid);
                                return u.displayName.toLowerCase().includes(this.mentionSearch) || (u.email && u.email.toLowerCase().includes(this.mentionSearch));
                            });
                            
                            if (this.filteredMentionUsers.length > 0) {
                                this.showMentionsMenu = true;
                                this.mentionIndex = 0;
                            } else {
                                this.showMentionsMenu = false;
                            }
                        } else {
                            this.showMentionsMenu = false;
                        }
                    }
                },

                insertMention(uid) {
                    const u = this.getUser(uid);
                    const words = this.newMessage.split(' ');
                    words.pop(); // remove the partial @
                    words.push(`@${u.email} `); // Insert deterministic tag
                    this.newMessage = words.join(' ');
                    this.showMentionsMenu = false;
                    // focus back to input
                },

                renderMessageContent(text) {
                    // Escape HTML to prevent basic XSS
                    let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    // Unescape the image tags we injected
                    safeText = safeText.replace(/&lt;br&gt;&lt;img src="(.*?)" class="max-w-xs rounded-md mt-2"&gt;/g, '<br><img src="$1" class="max-w-xs rounded-md mt-2">');
                    
                    // Highlight Mentions
                    const mentionRegex = /@(\S+)/g;
                    safeText = safeText.replace(mentionRegex, (match, username) => {
                        return `<span class="bg-[#5865F2]/30 text-[#c9cdfb] px-1 rounded cursor-pointer hover:bg-[#5865F2] hover:text-white transition">${match}</span>`;
                    });
                    return safeText;
                },

                formatDate(timestamp) {
                    if (!timestamp) return '';
                    const d = new Date(timestamp);
                    const today = new Date();
                    if(d.getDate() === today.getDate() && d.getMonth() === today.getMonth()) {
                        return 'Today at ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                },
                formatTimeOnly(timestamp) {
                    if (!timestamp) return '';
                    return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                },

                getChannelName() {
                    if(!this.currentServerId || !this.currentChannelId) return '';
                    const server = this.servers.find(s => s.id === this.currentServerId);
                    if(!server) return '';
                    const channel = server.channels?.find(c => c.id === this.currentChannelId);
                    return channel ? channel.name : '';
                },
                getServerName() {
                    if(!this.currentServerId) return '';
                    const server = this.servers.find(s => s.id === this.currentServerId);
                    return server ? server.name : '';
                },
                getTextChannels() {
                    if(!this.currentServerId) return [];
                    const s = this.servers.find(s => s.id === this.currentServerId);
                    return s ? (s.channels || []).filter(c => c.type === 'text') : [];
                },
                getVoiceChannels() {
                    if(!this.currentServerId) return [];
                    const s = this.servers.find(s => s.id === this.currentServerId);
                    return s ? (s.channels || []).filter(c => c.type === 'voice') : [];
                },
                getVoiceChannelName() {
                    if(!this.currentVoiceChannelId) return '';
                    if(this.currentVoiceChannelId.includes('_dm_')) return "Direct Call";
                    // Find across all servers for global display
                    for(let s of this.servers) {
                        const c = (s.channels||[]).find(ch => ch.id === this.currentVoiceChannelId);
                        if(c) return c.name;
                    }
                    return '';
                },
                isServerOwner() {
                    if(!this.currentServerId) return false;
                    const s = this.servers.find(s => s.id === this.currentServerId);
                    return s && s.owner === this.logicalUid;
                },
                get currentServerOwner() {
                    if(!this.currentServerId) return null;
                    const s = this.servers.find(s => s.id === this.currentServerId);
                    return s ? s.owner : null;
                },

                handleFileUpload(event, target) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let MAX_W = 256; let MAX_H = 256;
                            if(target === 'chat') { MAX_W = 800; MAX_H = 800; }
                            if(target === 'setupBanner' || target === 'banner') { MAX_W = 600; MAX_H = 240; }
                            
                            let w = img.width; let h = img.height;
                            if (w > h) { if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; } } 
                            else { if (h > MAX_H) { w *= MAX_H / h; h = MAX_H; } }
                            
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                            
                            if (target === 'setupAvatar') this.setupData.avatar = dataUrl;
                            else if (target === 'setupBanner') this.setupData.banner = dataUrl;
                            else if (target === 'avatar') this.editProfile.avatar = dataUrl;
                            else if (target === 'banner') this.editProfile.banner = dataUrl;
                            else if (target === 'serverIcon') this.newServerIcon = dataUrl;
                            else if (target === 'editServerIcon') this.editServer.icon = dataUrl;
                            else if (target === 'chat') this.imageToUpload = dataUrl;
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                },

                async createServer() {
                    if (!this.newServerName.trim()) return;
                    const sid = 'srv_' + Date.now();
                    await setDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_servers`, sid), {
                        name: this.newServerName,
                        icon: this.newServerIcon,
                        owner: this.logicalUid,
                        members: [this.logicalUid],
                        isPublic: false,
                        description: '',
                        channels: [
                            { id: 'c_' + Date.now(), name: 'general', type: 'text' },
                            { id: 'v_' + Date.now(), name: 'General Voice', type: 'voice' }
                        ]
                    });
                    this.showCreateServerModal = false;
                    this.newServerName = '';
                    this.newServerIcon = null;
                    this.openServer(sid);
                },

                async joinServer(sid) {
                    const snap = await getDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_servers`, sid));
                    if(snap.exists()) {
                        let data = snap.data();
                        if(!data.members.includes(this.logicalUid)) {
                            data.members.push(this.logicalUid);
                            await updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_servers`, sid), { members: data.members });
                        }
                        this.openHome(); // Close discovery
                        this.openServer(sid);
                    } else {
                        this.showToast("Server not found", true);
                    }
                },

                async leaveServer() {
                    if(!this.currentServerId) return;
                    if(this.isServerOwner()) { this.showToast("Owners cannot leave. Delete it instead.", true); return; }
                    
                    const server = this.servers.find(s => s.id === this.currentServerId);
                    let newMembers = server.members.filter(id => id !== this.logicalUid);
                    await updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_servers`, this.currentServerId), { members: newMembers });
                    
                    this.showServerDropdown = false;
                    this.openHome();
                },

                async deleteServer() {
                    if(!this.editServer.id) return;
                    await deleteDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_servers`, this.editServer.id));
                    this.showServerSettingsModal = false;
                    this.openHome();
                    this.showToast("Server deleted.");
                },

                copyInviteLink() {
                    const url = window.location.origin + window.location.pathname + '?join=' + this.currentServerId;
                    const helper = document.getElementById('copyHelper');
                    helper.value = url;
                    helper.select();
                    document.execCommand('copy');
                    this.showToast("Invite link copied!");
                    this.showServerDropdown = false;
                },

                openSettings() {
                    // Deep clone to prevent reactivity issues
                    this.editProfile = JSON.parse(JSON.stringify(this.myProfile));
                    this.showSettingsModal = true;
                },

                async saveProfileSettings() {
                    await updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_users`, this.logicalUid), {
                        displayName: this.editProfile.displayName,
                        bio: this.editProfile.bio,
                        avatar: this.editProfile.avatar,
                        banner: this.editProfile.banner
                    });
                    this.showSettingsModal = false;
                    this.showToast("Profile saved!");
                },

                openServerSettings(sid, tab='overview') {
                    const s = this.servers.find(s=>s.id === sid);
                    if(!s) return;
                    this.editServer = JSON.parse(JSON.stringify(s));
                    this.serverSettingsTab = tab;
                    this.showServerSettingsModal = true;
                    this.showServerDropdown = false;
                },

                async saveServerSettings() {
                    await updateDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_servers`, this.editServer.id), {
                        name: this.editServer.name,
                        icon: this.editServer.icon,
                        isPublic: this.editServer.isPublic,
                        description: this.editServer.description,
                        channels: this.editServer.channels
                    });
                    this.showToast("Server updated!");
                },

                async addChannel() {
                    if(!this.newChannelName.trim()) return;
                    if(!this.editServer.channels) this.editServer.channels = [];
                    this.editServer.channels.push({
                        id: (this.newChannelType==='text'?'c_':'v_') + Date.now(),
                        name: this.newChannelName.trim().toLowerCase().replace(/\s/g, '-'),
                        type: this.newChannelType
                    });
                    this.newChannelName = '';
                },

                removeChannel(cid) {
                    this.editServer.channels = this.editServer.channels.filter(c => c.id !== cid);
                },

                openProfilePopout(uid, event) {
                    const rect = event.currentTarget.getBoundingClientRect();
                    this.popoutUser = this.getUser(uid);
                    this.popoutMsg = '';
                    // Calculate positioning to keep it on screen
                    let top = rect.top;
                    let left = rect.right + 10;
                    if(top + 400 > window.innerHeight) top = window.innerHeight - 410;
                    if(left + 340 > window.innerWidth) left = rect.left - 350;
                    
                    this.popoutStyle = `top: ${top}px; left: ${left}px;`;
                    this.showProfilePopout = true;
                },

                sendDmFromPopout() {
                    if(!this.popoutMsg.trim()) return;
                    this.showProfilePopout = false;
                    this.openDm(this.popoutUser.id);
                    // Slight delay to ensure channel is opened
                    setTimeout(() => {
                        this.newMessage = this.popoutMsg;
                        this.sendMessage();
                    }, 200);
                },

                showToast(msg, isErr=false) {
                    this.toast.message = msg;
                    this.toast.isError = isErr;
                    this.toast.show = true;
                    setTimeout(()=>this.toast.show=false, 3000);
                },
                
                // Color Extraction for UI
                getDominantColor(imgSrc, fallback) {
                    if(!imgSrc || imgSrc.includes('svg')) return fallback;
                    // Simple hash or basic fallback to avoid canvas thread locking for every avatar
                    return fallback;
                },

                // ==========================================
                // WEBRTC FULL MESH IMPLEMENTATION
                // ==========================================
                
                getVcParticipants(channelId) {
                    let parts = [];
                    for(let [uid, cId] of Object.entries(this.vcParticipants)) {
                        if(cId === channelId) parts.push(uid);
                    }
                    return parts;
                },

                async joinVoiceChannel(channelId) {
                    if (this.currentVoiceChannelId === channelId) return;
                    if (this.currentVoiceChannelId) this.leaveVoiceChannel();

                    this.currentVoiceChannelId = channelId;
                    this.isVideoEnabled = false; // Default OFF
                    this.isScreenSharing = false;
                    
                    // Announce presence to isolated signaling node
                    await setDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_presence`, this.logicalUid), { channelId: channelId, timestamp: Date.now() });

                    // Setup Media
                    try {
                        this.localMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); // Audio only initially
                        const videoEl = document.getElementById('localVideo');
                        if(videoEl) {
                            videoEl.srcObject = this.localMediaStream;
                            videoEl.muted = true; // prevent echo
                        }
                    } catch(e) {
                        console.error("Mic access denied", e);
                        this.showToast("Microphone access required for voice channels", true);
                        this.leaveVoiceChannel();
                        return;
                    }

                    // Track Room Presences
                    this.unsubPresence = onSnapshot(collection(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_presence`), snap => {
                        let currentInRoom = {};
                        snap.forEach(d => {
                            if (d.data().channelId === this.currentVoiceChannelId) currentInRoom[d.id] = this.currentVoiceChannelId;
                        });
                        this.vcParticipants = currentInRoom;

                        // Connect to new peers
                        for (let uid of Object.keys(currentInRoom)) {
                            if (uid !== this.logicalUid && !this.peers[uid]) {
                                // Deterministic initiator: alphabetically lower UID initiates
                                const isInitiator = this.logicalUid < uid;
                                this.createPeerConnection(uid, isInitiator);
                            }
                        }
                    });

                    // Listen for incoming signals addressed to me
                    onSnapshot(collection(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_signals_${channelId}_${this.logicalUid}`), snap => {
                        snap.forEach(d => {
                            const data = d.data();
                            const senderId = data.senderId;
                            if (data.type === 'cam_state') {
                                this.vcCameraStates[senderId] = data.enabled;
                                return;
                            }
                            if (data.type === 'screen_state') {
                                this.vcScreenshareStates[senderId] = data.enabled;
                                return;
                            }
                            
                            // Handling standard WebRTC signals
                            let targetPeer = data.isScreen ? this.screenPeers[senderId] : this.peers[senderId];
                            
                            if (!targetPeer && !data.isScreen) {
                                // If we don't have a peer but get a signal, create it as receiver
                                targetPeer = this.createPeerConnection(senderId, false);
                            } else if (!targetPeer && data.isScreen && data.signal.type === 'offer') {
                                // Handle incoming screen share offer
                                targetPeer = this.createScreenPeerConnection(senderId, false);
                            }
                            
                            if(targetPeer && data.signal) {
                                try {
                                    targetPeer.signal(data.signal);
                                } catch(e) { console.error("Signal error", e); }
                            }
                            
                            // Delete signal after reading
                            deleteDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_signals_${channelId}_${this.logicalUid}`, d.id)).catch(()=>{});
                        });
                    });
                },

                createPeerConnection(targetUid, initiator) {
                    // Metered.ca Free TURN for strict firewalls
                    const peer = new SimplePeer({
                        initiator: initiator,
                        trickle: true,
                        stream: this.localMediaStream,
                        config: { iceServers: [
                            { urls: 'stun:openrelay.metered.ca:80' },
                            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                        ]}
                    });

                    peer.on('signal', signal => {
                        // Send signal to target
                        setDoc(doc(collection(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_signals_${this.currentVoiceChannelId}_${targetUid}`)), {
                            senderId: this.logicalUid,
                            signal: JSON.parse(JSON.stringify(signal)),
                            timestamp: Date.now()
                        });
                    });

                    peer.on('stream', stream => {
                        setTimeout(() => {
                            const vid = document.getElementById('remoteVideo_' + targetUid);
                            if(vid) vid.srcObject = stream;
                        }, 100);
                    });

                    peer.on('error', err => console.error('Peer error', err));
                    
                    this.peers[targetUid] = peer;
                    return peer;
                },

                createScreenPeerConnection(targetUid, initiator) {
                    const peer = new SimplePeer({
                        initiator: initiator,
                        trickle: true,
                        stream: this.localScreenStream,
                        config: { iceServers: [
                            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                        ]}
                    });

                    peer.on('signal', signal => {
                        setDoc(doc(collection(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_signals_${this.currentVoiceChannelId}_${targetUid}`)), {
                            senderId: this.logicalUid,
                            isScreen: true,
                            signal: JSON.parse(JSON.stringify(signal)),
                            timestamp: Date.now()
                        });
                    });

                    peer.on('stream', stream => {
                        setTimeout(() => {
                            const vid = document.getElementById('remoteScreen_' + targetUid);
                            if(vid) vid.srcObject = stream;
                        }, 100);
                    });
                    
                    this.screenPeers[targetUid] = peer;
                    return peer;
                },

                async toggleCamera() {
                    if(!this.localMediaStream || !this.currentVoiceChannelId) return;
                    
                    this.isVideoEnabled = !this.isVideoEnabled;
                    
                    if(this.isVideoEnabled) {
                        try {
                            const vidStream = await navigator.mediaDevices.getUserMedia({ video: true });
                            const videoTrack = vidStream.getVideoTracks()[0];
                            this.localMediaStream.addTrack(videoTrack);
                            
                            // Re-bind to local element
                            document.getElementById('localVideo').srcObject = this.localMediaStream;

                            // Inform all peers to renegotiate
                            Object.values(this.peers).forEach(p => p.addTrack(videoTrack, this.localMediaStream));
                        } catch(e) {
                            this.showToast("Camera access denied", true);
                            this.isVideoEnabled = false;
                        }
                    } else {
                        const videoTrack = this.localMediaStream.getVideoTracks()[0];
                        if(videoTrack) {
                            videoTrack.stop();
                            this.localMediaStream.removeTrack(videoTrack);
                            Object.values(this.peers).forEach(p => p.removeTrack(videoTrack, this.localMediaStream));
                        }
                    }

                    // Broadcast state change to UI
                    this.broadcastUiState('cam_state', this.isVideoEnabled);
                },

                async toggleScreenShare() {
                    if(!this.currentVoiceChannelId) return;
                    
                    if(this.isScreenSharing) {
                        this.stopScreenShare();
                        return;
                    }

                    try {
                        this.localScreenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                        this.isScreenSharing = true;
                        
                        document.getElementById('localScreen').srcObject = this.localScreenStream;

                        // Create separate peer connections purely for screenshare
                        for (let uid of Object.keys(this.vcParticipants)) {
                            if (uid !== this.logicalUid) {
                                this.createScreenPeerConnection(uid, true);
                            }
                        }

                        // Broadcast state
                        this.broadcastUiState('screen_state', true);

                        // Handle native OS stop button
                        this.localScreenStream.getVideoTracks()[0].onended = () => {
                            this.stopScreenShare();
                        };

                    } catch(e) {
                        console.error("Screenshare cancelled", e);
                    }
                },

                stopScreenShare() {
                    if(this.localScreenStream) {
                        this.localScreenStream.getTracks().forEach(t => t.stop());
                        this.localScreenStream = null;
                    }
                    this.isScreenSharing = false;
                    
                    // Destroy screen peers
                    Object.values(this.screenPeers).forEach(p => p.destroy());
                    this.screenPeers = {};
                    
                    this.broadcastUiState('screen_state', false);
                    if(this.fullscreenPeerId === 'local_screen') this.fullscreenPeerId = null;
                },

                broadcastUiState(type, enabled) {
                    if(!this.currentVoiceChannelId) return;
                    for(let uid of Object.keys(this.vcParticipants)) {
                        if(uid !== this.logicalUid) {
                            setDoc(doc(collection(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_signals_${this.currentVoiceChannelId}_${uid}`)), {
                                senderId: this.logicalUid, type: type, enabled: enabled, timestamp: Date.now()
                            });
                        }
                    }
                },

                leaveVoiceChannel() {
                    if (this.unsubPresence) this.unsubPresence();
                    if (this.currentVoiceChannelId) {
                        deleteDoc(doc(db, `artifacts/${appId}/public/data/${ISOLATION_PREFIX}_presence`, this.logicalUid)).catch(()=>{});
                    }
                    
                    if(this.localMediaStream) {
                        this.localMediaStream.getTracks().forEach(t => t.stop());
                        this.localMediaStream = null;
                    }
                    if(this.localScreenStream) {
                        this.stopScreenShare();
                    }
                    
                    Object.values(this.peers).forEach(p => p.destroy());
                    this.peers = {};
                    Object.values(this.screenPeers).forEach(p => p.destroy());
                    this.screenPeers = {};
                    
                    this.currentVoiceChannelId = null;
                    this.showVideoGrid = false;
                    this.vcParticipants = {};
                    this.vcCameraStates = {};
                    this.vcScreenshareStates = {};
                    this.fullscreenPeerId = null;
                },

                toggleFullscreen(id) {
                    if (this.fullscreenPeerId === id) this.fullscreenPeerId = null;
                    else this.fullscreenPeerId = id;
                }
            }
        }
        
        document.addEventListener('alpine:init', () => {
            Alpine.data('nexusApp', window.nexusApp);
        });
        Alpine.start();
    </script>
</body>
